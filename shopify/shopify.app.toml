# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "5043b19078496382d037c1e32912b53b"
name = "qs-b2b-portal"
# The B2B app (UI version of the prototype), hosted on Vercel, shown inside Shopify admin.
application_url = "https://rfq-x-b2b-ui.vercel.app/b2b/shopify/"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

[access.admin]
direct_api_mode = "online"
embedded_app_direct_api_access = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,write_orders,write_customers,write_companies,write_draft_orders,write_online_store_navigation,read_content,customer_read_customers,customer_read_orders"

# Storefront → backend: /apps/qs-b2b/order-request turns a cart over a maximum the
# seller reviews into a draft order (backend/api/proxy/order-request.js).
[app_proxy]
url = "https://qs-b2b-api.vercel.app/api/proxy"
subpath = "qs-b2b"
prefix = "apps"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]

[metaobjects.app.faq]
name = "FAQ"

[metaobjects.app.faq.fields.question]
name = "Question"
type = "single_line_text_field"
required = true

[metaobjects.app.faq.fields.answer]
name = "Answer"
type = "multi_line_text_field"
required = true

[metaobjects.app.faq.fields.show_on_faq_page]
name = "Show on FAQ page"
type = "boolean"

[product.metafields.app.faq]
name = "FAQ"
description = "FAQ for this product"
type = "metaobject_reference<$app:faq>"

  [product.metafields.app.faq.access]
  admin = "merchant_read_write"

[sidekick]
extensions_summary = "Read FAQ entries stored in the app"
