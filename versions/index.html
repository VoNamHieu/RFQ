<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prototype changelog — RFQ × B2B</title>
<style>
  :root{--border:#e3e3e3;--text:#303030;--sub:#616161;--accent:#4b2e83}
  *{box-sizing:border-box;margin:0}
  body{font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:#f6f6f7;padding-bottom:60px}
  .topbar{height:52px;background:#1a1a1a;color:#fff;display:flex;align-items:center;gap:10px;padding:0 16px;position:sticky;top:0}
  .logo-mark{width:24px;height:24px;border-radius:5px;background:#ffe478;color:#303030;display:grid;place-items:center;font-size:11px;font-weight:800}
  .topbar strong{font-weight:650}
  .topbar a{margin-left:auto;color:#fff;font-size:13px;font-weight:600;text-decoration:none;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:6px 10px}
  .topbar a:hover{background:rgba(255,255,255,.12)}
  .wrap{max-width:760px;margin:24px auto 0;padding:0 16px}
  h1{font-size:20px;margin-bottom:2px}
  .sub{color:var(--sub);font-size:13px}
  .ver{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-top:14px}
  .ver.latest{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .ver-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .ver-head h2{font-size:16px}
  .meta{color:var(--sub);font-size:12.5px}
  .open{margin-left:auto;color:#005bd3;font-weight:600;font-size:13px;text-decoration:none;white-space:nowrap}
  .open:hover{text-decoration:underline}
  .note{margin-top:6px;color:var(--sub)}
  ul{padding-left:18px;margin-top:8px}
  li{margin:5px 0}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo-mark">QS</div><strong>Prototype changelog</strong>
  <a href="/">Open latest prototype ↗</a>
</div>
<div class="wrap">
  <h1>RFQ × B2B — các bản prototype</h1>
  <div class="sub">Mỗi bản được lưu nguyên trạng; bấm "Mở bản này" để xem prototype đúng như thời điểm chốt.</div>
  <div id="list"><p style="margin-top:16px;color:var(--sub)">Đang tải…</p></div>
</div>
<script>
fetch('/versions/manifest.json', {cache: 'no-store'})
  .then(r => r.json())
  .then(data => {
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const card = (title, meta, note, changes, href, label, latest) => `
      <section class="ver${latest ? ' latest' : ''}">
        <div class="ver-head"><h2>${esc(title)}</h2><span class="meta">${esc(meta)}</span>
          <a class="open" href="${href}">${esc(label)} →</a></div>
        ${note ? `<p class="note">${esc(note)}</p>` : ''}
        ${changes && changes.length ? `<ul>${changes.map(c => `<li>${esc(c)}</li>`).join('')}</ul>` : ''}
      </section>`;
    let html = '';
    if(data.unreleased){
      html += card('Latest', 'đang phát triển — chưa chốt', data.unreleased.note,
        data.unreleased.changes, '/', 'Mở prototype', true);
    }
    html += (data.versions || []).slice().reverse()
      .map(v => card(v.id, v.date, v.note, v.changes, `/versions/${v.id}/`, 'Mở bản này', false))
      .join('');
    document.getElementById('list').innerHTML = html || '<p style="margin-top:16px">Chưa có version nào.</p>';
  })
  .catch(() => { document.getElementById('list').textContent = 'Không tải được danh sách version.'; });
</script>
</body>
</html>
