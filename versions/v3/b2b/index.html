/* ===== Pricing rules — drag-and-drop reorder =====
   Kéo bằng handle (data-rule-grip), thả lên hàng đích (data-rule-drag). First-match
   trên→dưới nên thứ tự là priority thật. Row đích là vị trí chèn. */
function moveRuleTo(from, to){
  const arr = state.builder && state.builder.conditionalRules;
  if(!arr || from<0 || from>=arr.length || to<0 || to>=arr.length || from===to) return false;
  const edited = (state.ruleEdit!=null) ? arr[state.ruleEdit] : null;
  const [it] = arr.splice(from,1);
  arr.splice(to,0,it);
  if(edited){ const ni=arr.indexOf(edited); state.ruleEdit = ni>=0?ni:null; }
  return true;
}
let _dragRuleIdx = null;
function clearRuleDropMarks(){
  document.querySelectorAll('.rule-drag-row.dragging,.rule-drag-row.drop-target')
    .forEach(el=>el.classList.remove('dragging','drop-target'));
}
document.addEventListener('dragstart', e => {
  const grip = e.target.closest && e.target.closest('[data-rule-grip]');
  if(!grip) return;
  const row = grip.closest('[data-rule-drag]'); if(!row) return;
  _dragRuleIdx = Number(row.dataset.ruleDrag);
  if(e.dataTransfer){
    e.dataTransfer.effectAllowed='move';
    try{ e.dataTransfer.setData('text/plain', String(_dragRuleIdx)); }catch(_){}
    try{ e.dataTransfer.setDragImage(row, 12, 12); }catch(_){}
  }
  row.classList.add('dragging');
});
document.addEventListener('dragover', e => {
  if(_dragRuleIdx===null) return;
  const row = e.target.closest && e.target.closest('[data-rule-drag]');
  if(!row) return;
  e.preventDefault();
  if(e.dataTransfer) e.dataTransfer.dropEffect='move';
  document.querySelectorAll('.rule-drag-row.drop-target').forEach(el=>{ if(el!==row) el.classList.remove('drop-target'); });
  if(Number(row.dataset.ruleDrag)!==_dragRuleIdx) row.classList.add('drop-target'); else row.classList.remove('drop-target');
});
document.addEventListener('drop', e => {
  if(_dragRuleIdx===null) return;
  const row = e.target.closest && e.target.closest('[data-rule-drag]');
  const from = _dragRuleIdx; _dragRuleIdx=null; clearRuleDropMarks();
  if(!row) return;
  e.preventDefault();
  if(moveRuleTo(from, Number(row.dataset.ruleDrag))) renderBuilder();
});
document.addEventListener('dragend', () => { _dragRuleIdx=null; clearRuleDropMarks(); });

document.addEventListener('click', e => {
  // a label wrapping an input fires twice (label click + forwarded input click)
  if(e.target.tagName==='INPUT' && e.target.closest('[data-btoggle],[data-bchoice],[data-qt],[data-ar],[data-atarget],[data-acustomer],[data-customer-pick],[data-company-pick],[data-loc-pick],[data-assign-target],[data-company-sort-field],[data-pricing-sort-field],[data-sloc],[data-locpick]')) return;
  const t = e.target.closest('[data-view],[data-company],[data-location],[data-ctab],[data-anav],[data-action],[data-edit-policy],[data-section],[data-bchoice],[data-btoggle],[data-list-tool],[data-company-filter],[data-company-sort-field],[data-company-sort-dir],[data-pricing-sort-field],[data-pricing-sort-dir],[data-pricing-audience],[data-pricing-kind],[data-pricing-status],[data-quote],[data-quote-filter],[data-atype],[data-acustomer],[data-tag-remove],[data-customer-remove],[data-customer-pick],[data-b2b-remove],[data-loc-remove],[data-company-pick],[data-loc-pick],[data-atarget],[data-assign-target],[data-product-search],[data-assign-search],[data-close-drawer],[data-close-modal],[data-qt],[data-ar],[data-shopify-company],[data-sloc],[data-market]');
  if(!t) return;

  if(t.dataset.closeDrawer !== undefined) return closeDrawer();
  if(t.dataset.closeModal !== undefined) return closeModal();

  if(t.dataset.view){ state.view=t.dataset.view; state.listFilter='all'; if(t.dataset.view==='analytics'){ state.analyticsCompanyFilter='all'; state.analyticsLocationFilter='all'; state.analyticsPeriod='90'; state.analyticsCompare='none'; state.appAnalyticsSection='overview'; state.analyticsBreakdown='company'; state.analyticsMeasure='revenue'; state.analyticsPrimaryMode='trend'; } return render(); }
  if(t.dataset.company){ state.selectedCompany=t.dataset.company; state.companyTab='pricing'; state.view='company'; return render(); }
  if(t.dataset.location){ state.selectedLocation=t.dataset.location; state.view='location'; return render(); }
  if(t.dataset.sloc){
    const id=t.dataset.sloc;
    const i=state.selectedShopifyLocations.indexOf(id);
    if(i>=0) state.selectedShopifyLocations.splice(i,1); else state.selectedShopifyLocations.push(id);
    return openShopifyCompanySetup();
  }
  if(t.dataset.ctab){ state.companyTab=t.dataset.ctab; state.orderFilter='all'; state.orderLocationSort=null; return render(); }
  if(t.dataset.anav){ state.analyticsSection=t.dataset.anav; return render(); }
  if(t.dataset.qt){ state.quoteTreatment=t.dataset.qt; return openQuoteTreatment(); }
  if(t.dataset.ar){ state.appRoute=t.dataset.ar; return openApplicationRoute(); }
  if(t.dataset.editPolicy){ state.builder=newBuilder(policyById(t.dataset.editPolicy));
    /* Opened from an account page: a change here probably means "change it for
       this account", not "change it for everyone sharing the template". */
    state.editScopeCompanyId = t.dataset.scopeCompany
      || (t.dataset.scopeLocation ? state.selectedCompany : null);
    state.editScopeLocationId = t.dataset.scopeLocation ? state.selectedLocation : null;
    /* Đường về do nơi mở quyết định, không do Company nào tình cờ được gán. */
    state.builder._returnTo = t.dataset.scopeLocation ? {view:'location'}
      : t.dataset.scopeCompany ? {view:'company', id:t.dataset.scopeCompany}
      : {view:'pricing'};
    state.openSections={1:true,2:true,3:false,4:false};
    return renderBuilder(); }
  if(t.dataset.section){ const n=t.dataset.section; state.openSections[n]=!state.openSections[n]; return renderBuilder(); }
  if(t.dataset.bchoice){ state.builder[t.dataset.bchoice]=t.dataset.value; return renderBuilder(); }
  if(t.dataset.btoggle){
    const k=t.dataset.btoggle;
    if(k==='explicitEnabled') state.builder.explicitEnabled = !explicitOn(state.builder);
    else state.builder[k]=!state.builder[k];
    return renderBuilder(); }
  if(t.dataset.atype){
    if(state.assign.typeLocked) return;
    if(state.assign.targetType===t.dataset.atype) return;
    state.assign.targetType=t.dataset.atype;
    state.assign.ids=[]; state.assignSearch='';
    return renderAssign(); }
  if(t.dataset.locPick){
    if(assignmentLocked()) return;
    const id=t.dataset.locPick;
    const f=findLocation(id); if(!f) return;
    const co=f.company, sibIds=(co.locations||[]).map(l=>l.id);
    const lset=new Set(state.locationPickerIds||[]);
    const cset=new Set(state.companyPickerIds||[]);
    const coveredByCompany = cset.has(co.id) && !lset.has(id);
    const checked = coveredByCompany || lset.has(id);
    if(checked){
      /* Bỏ tick một location: nếu company cha đang phủ cả cụm thì "nổ" cụm ra —
         company off, các location anh em CÒN LẠI thành override riêng, mình off. */
      if(cset.has(co.id)){
        cset.delete(co.id);
        sibIds.forEach(sid=>{ if(sid!==id) lset.add(sid); });
      }
      lset.delete(id);
    } else {
      /* Tick một location: nếu cả cụm đã đủ mặt thì gộp lên company cho gọn
         (company checked = mọi location của nó được chọn, hiện "Covered by company"). */
      lset.add(id);
      if(sibIds.length && sibIds.every(sid=>lset.has(sid))){
        sibIds.forEach(sid=>lset.delete(sid));
        cset.add(co.id);
      }
    }
    state.locationPickerIds=[...lset];
    state.companyPickerIds=[...cset];
    return openCompanyPicker();
  }
  if(t.dataset.companyPick){
    if(assignmentLocked()) return;
    const id=t.dataset.companyPick, list=state.companyPickerIds||[];
    const on = !list.includes(id);
    state.companyPickerIds = on ? [...list, id] : list.filter(x=>x!==id);
    /* Tick company = phủ mọi location của nó (chúng hiện "Covered by company",
       vẫn bỏ tick lẻ được — xử lý ở nhánh locPick). Dọn location con khỏi danh
       sách override để chúng phủ-qua-company chứ không nhân đôi override; untick
       company thì các location covered tự bỏ theo. */
    const co=companyById(id);
    if(co && on){
      const locIds=new Set((co.locations||[]).map(l=>l.id));
      state.locationPickerIds=(state.locationPickerIds||[]).filter(x=>!locIds.has(x));
    }
    return openCompanyPicker();
  }
  if(t.dataset.b2bRemove){
    state.builder.b2bCompanyIds=(state.builder.b2bCompanyIds||[]).filter(x=>x!==t.dataset.b2bRemove);
    return renderBuilder();
  }
  if(t.dataset.locRemove){
    state.builder.b2bLocationIds=(state.builder.b2bLocationIds||[]).filter(x=>x!==t.dataset.locRemove);
    return renderBuilder();
  }
  if(t.dataset.customerPick){
    const id=t.dataset.customerPick, list=state.customerPickerIds||[];
    state.customerPickerIds = list.includes(id) ? list.filter(x=>x!==id) : [...list, id];
    return openCustomerPicker();
  }
  if(t.dataset.customerRemove){
    state.builder.assignmentTargetIds=(state.builder.assignmentTargetIds||[]).filter(x=>x!==t.dataset.customerRemove);
    return renderBuilder();
  }
  if(t.dataset.tagRemove){
    const tag=t.dataset.tagRemove;
    if(t.dataset.tagScope==='assign') state.assign.ids=(state.assign.ids||[]).filter(x=>x!==tag);
    else state.builder.assignmentTargetIds=(state.builder.assignmentTargetIds||[]).filter(x=>x!==tag);
    return t.dataset.tagScope==='assign' ? renderAssign() : renderBuilder();
  }
  if(t.dataset.listTool!==undefined){
    const key=t.dataset.listTool;
    const which = state.view==='pricing' ? 'pricingTool' : 'companyTool';
    state[which] = (!key || state[which]===key) ? '' : key;
    if(!state[which]){
      /* Trên Pricing, tìm và lọc ở chung một hàng, nên đóng hàng đó là rời khỏi cả
         hai: để lại một bộ lọc đang bật thì hàng lại tự mở ra và nút Cancel thành
         nút không làm gì. Dải đối tượng nằm trên card, không thuộc hàng này, nên
         nó không bị đụng tới. */
      if(which==='pricingTool'){
        state.pricingSearch=''; state.pricingKind=''; state.pricingStatus='';
        state.pricingKindMenu=false; state.pricingStatusMenu=false;
      } else state.companySearch='';
    }
    return render();
  }
  if(t.dataset.companyFilter!==undefined){
    state.listFilter=t.dataset.companyFilter;
    return render();
  }
  if(t.dataset.companySortField!==undefined){ state.companySortField=t.dataset.companySortField; return render(); }
  if(t.dataset.companySortDir!==undefined){ state.companySortDir=t.dataset.companySortDir; return render(); }
  if(t.dataset.pricingSortField!==undefined){ state.pricingSortField=t.dataset.pricingSortField; return render(); }
  if(t.dataset.pricingSortDir!==undefined){ state.pricingSortDir=t.dataset.pricingSortDir; return render(); }
  if(t.dataset.pricingAudience!==undefined){ state.pricingAudience=t.dataset.pricingAudience; return render(); }
  if(t.dataset.pricingKind!==undefined){
    state.pricingKind=t.dataset.pricingKind; state.pricingKindMenu=false; return render(); }
  if(t.dataset.pricingStatus!==undefined){
    state.pricingStatus=t.dataset.pricingStatus; state.pricingStatusMenu=false; return render(); }
  if(t.dataset.quote!==undefined && t.dataset.action===undefined){
    state.selectedQuote=t.dataset.quote; state.view='quote'; return render(); }
  if(t.dataset.quoteFilter!==undefined){ state.quoteFilter=t.dataset.quoteFilter; return render(); }
  if(t.dataset.acustomer){
    if(state.assign.customerTarget===t.dataset.acustomer) return;
    state.assign.customerTarget=t.dataset.acustomer;
    state.assign.ids=[]; state.assignSearch='';
    return renderAssign(); }
  if(t.dataset.assignTarget){
    const id=t.dataset.assignTarget, list=state.assign.ids;
    state.assign.ids = list.includes(id) ? list.filter(x=>x!==id) : [...list, id];
    return renderAssign(); }
  if(t.dataset.atarget){
    if(assignmentLocked()) return;
    if(customerTargetOf(state.builder)===t.dataset.atarget) return;
    state.builder.customerTarget=t.dataset.atarget;
    state.builder.assignmentTargetIds=[];
    return renderBuilder();
  }


  // Shopify directory rows do not use data-action.
  // Handle them before the generic `if (!a) return` action branch.
  const shopifyCompanyRow = t.closest('[data-shopify-company]');
  if(shopifyCompanyRow){
    const id=shopifyCompanyRow.dataset.shopifyCompany;
    if(db.companies.some(c=>c.shopifyCompanyId===id)) return toast('This Shopify Company is already added.');
    state.selectedShopifyCompany=id;
    state.selectedShopifyLocations=[];
    return openShopifyCompanyBrowser();
  }

  if(t.dataset.market){
    const m=t.dataset.market;
    state.builder.selectedMarkets=(state.builder.selectedMarkets||[]).includes(m)
      ? state.builder.selectedMarkets.filter(x=>x!==m)
      : [...(state.builder.selectedMarkets||[]),m];

  const a = t.dataset.action;
  if(a==='preview-all-prices'){
    state.priceBoardSearch='';
    openModal('Resolved prices', fullResolutionTable(state.builder), null, true);
    return;

  /* ===== Analytics actions (ported) ===== */
  if(a==='open-app-analytics'){
    state.analyticsCompanyFilter=t.dataset.companyId||state.selectedCompany||'all';
    state.appAnalyticsSection=({performance:'overview',ordering:'orders',quotes:'quotes',pricing:'pricing'})[state.analyticsSection]||'overview';

      if(!state.companySetupPolicyByKind.base.includes(state.companySetupDraftPolicy))
        state.companySetupPolicyByKind.base.push(state.companySetupDraftPolicy);
    } else {
      state.companySetupPolicyByKind[k]=state.companySetupDraftPolicy;
    }
    state.companySetupPricingMode='existing';
    state.companySetupAddKind=null;
    state.companySetupDraftPolicy=null;
    syncSetupPolicySelections();
    return openShopifyCompanySetup(3);
  }
  if(a==='setup-discard-kind'){
    /* Discard leaves the committed value alone: opening Change and discarding
       must not clear a pricing type that was already saved. */
    const dk=state.companySetupAddKind, dp=state.companySetupDraftPolicy;
    const committed = dk==='base' ? selBaseRefs(state.companySetupPolicyByKind).includes(dp)
                                  : state.companySetupPolicyByKind[dk]===dp;
    if(dk && isDraftRef(dp) && !committed)
      delete state.companySetupDrafts[dk];
    state.companySetupAddKind=null;
    state.companySetupDraftPolicy=null;
    state.companySetupPricingMode=kindSelPrimary(state.companySetupPolicyByKind)?'existing':'later';
    return openShopifyCompanySetup(3);
  }
  if(a==='setup-remove-kind'){
    const k=t.dataset.kind, ref=t.dataset.ref;
    /* Bỏ đúng item được bấm; nếu là draft thì xoá luôn draft. */
    if(k==='base'){
      if(isDraftRef(ref)) delete state.companySetupDrafts[draftKindOf(ref)];
      state.companySetupPolicyByKind.base=selBaseRefs(state.companySetupPolicyByKind).filter(r=>r!==ref);
    } else {
      if(isDraftRef(state.companySetupPolicyByKind[k])) delete state.companySetupDrafts[k];
      state.companySetupPolicyByKind[k]=null;
    }
    if(state.companySetupAddKind===k){ state.companySetupAddKind=null; state.companySetupDraftPolicy=null; }
    syncSetupPolicySelections();
    state.companySetupPricingMode=kindSelPrimary(state.companySetupPolicyByKind)?'existing':'later';
    return openShopifyCompanySetup(3);
  }
  if(a==='company-pricing-existing'){
    state.companySetupPricingMode='existing';
    if(!kindSelPrimary(state.companySetupPolicyByKind)){
      seedKindSelFromPolicy(state.companySetupPolicyByKind, db.policies[0]?.id);
      state.companySetupPolicySeeded=true;
      syncSetupPolicySelections();
    }
    return openShopifyCompanySetup(3);
  }
  if(a==='company-pricing-later'){
    state.companySetupPricingMode='later';
    return openShopifyCompanySetup(3);
  }
  if(a==='create-price-for-company-setup'){
    const source=shopifyCompanyDirectory.find(c=>c.id===state.selectedShopifyCompany);
    state.priceCreateContext={type:'company_setup'};
    state.builder=newBuilder(null); state.pricingBuilderTab='settings';
    /* Open straight into the config screen for the type the merchant picked. */
    applyKindDefaults(state.builder, t.dataset.kind || state.companySetupAddKind || 'base');
    prefillAssignmentFromContext(state.builder,state.priceCreateContext);
    state.builder.name=`${source?.name||'Company'} ${kindName(state.builder.priceKind).toLowerCase()}`;
    state.openSections={1:true,2:true,3:false,4:false};
   
    closeModal();
    return renderBuilder();
  }
  if(a==='create-price-from-assignment'){
    /* From the quote flow: seed the real editor with the scoped quote pricing. */
    if(state.assign && state.assign.quoteOverrides && state.assign.targetType==='company' && state.assign.companyId){
      const lines = state.assign.quoteLines || [];
      const cid = state.assign.companyId;
      closeModal();
      return startQuotePricingBuilder(cid, lines);
    }
    const assignCopy=JSON.parse(JSON.stringify(state.assign));
    let name='Custom pricing';
    if(assignCopy.targetType==='company') name=`${companyById(assignCopy.companyId)?.name||'Company'} ${assignCopy.kind?kindName(assignCopy.kind).toLowerCase():'pricing'}`;
    if(assignCopy.targetType==='customer') name=`${customerById(assignCopy.customerId)?.name||'Customer'} pricing`;
    if(assignCopy.targetType==='customer_group') name=`${tagById(assignCopy.groupId)?.name||'Tag'} pricing`;
    state.priceCreateContext={type:'assignment',assign:assignCopy};
    state.builder=newBuilder(null); state.pricingBuilderTab='settings';
    state.builder._returnTo = assignCopy.targetType==='company' && assignCopy.companyId
      ? {view:'company', id:assignCopy.companyId} : {view:'pricing'};
    /* The row that was clicked already decided the pricing type. */
    if(assignCopy.kind) applyKindDefaults(state.builder,assignCopy.kind);
    prefillAssignmentFromContext(state.builder,state.priceCreateContext);
    state.builder.name=name;
    state.openSections={1:true,2:true,3:false,4:false};
   
    closeModal();
    return renderBuilder();
  }
  if(a==='continue-shopify-company'){
    if(!state.selectedShopifyCompany) return toast('Select a Shopify Company first.');
    const source=shopifyCompanyDirectory.find(c=>c.id===state.selectedShopifyCompany);
    // Vào bước Locations với tất cả location được chọn sẵn — merchant bỏ bớt nếu cần.
    if(source) state.selectedShopifyLocations=source.locations.map(l=>l.id);
    state.companySetupStep=2;
    return openShopifyCompanySetup(2);
  }
  if(a==='add-selected-shopify-company'){
    const source=shopifyCompanyDirectory.find(c=>c.id===state.selectedShopifyCompany);
    if(!source) return toast('Select a Shopify Company first.');
    if(db.companies.some(c=>c.shopifyCompanyId===source.id)) return toast('This Shopify Company is already added.');
    if(!state.selectedShopifyLocations.length) return toast('Select at least one Shopify Location.');

    /* Đây là lần ghi duy nhất: draft dựng trong luồng này mới trở thành pricing
       profile thật ở đúng thời điểm Company được tạo. */
    const setupPricing=emptyKindSel();
    const commitRef = ref => {
      if(isDraftRef(ref)){
        const d=state.companySetupDrafts[draftKindOf(ref)];
        if(!d) return null;
        d.id=d.id||demoId('p'); d.status=d.status||'Active'; delete d.draftKind;
        if(!db.policies.some(p=>p.id===d.id)) db.policies.push(d);
        return d.id;
      }
      return policyById(ref) ? ref : null;
    };
    setupPricing.base = selBaseRefs(state.companySetupPolicyByKind).map(commitRef).filter(Boolean);
    setupPricing.quantity = state.companySetupPolicyByKind.quantity ? commitRef(state.companySetupPolicyByKind.quantity) : null;
    const hasPricing = (setupPricing.base && setupPricing.base.length) || !!setupPricing.quantity;
    const mainContact=mainContactOf(source)?.name||'None';
    const selectedLocations=source.locations.filter(l=>state.selectedShopifyLocations.includes(l.id));
    const readyLocationCount=hasPricing?selectedLocations.length:0;

    const companyId=demoId('c');
    const company={
      id:companyId,
      shopifyCompanyId:source.id,
      name:source.name,
      mainContact,
      source:'Shopify Company',
      pricing:setupPricing,
      revenue:0,
      locations:selectedLocations.map(location=>({
        id:demoId('l'),
        shopifyLocationId:location.id,
        name:location.name,
        ordering:location.ordering||'Buys directly',
        terms:location.terms,
        lastOrder:null,
        buyers:buyersAt(source,location.name).length
      })),
      /* Roles come from Shopify as they are — the previous version guessed
         (first contact = admin, everyone on every Location), so what setup
         showed and what the Company ended up with did not match. */
      contacts:source.contacts
        .filter(contact=>selectedLocations.some(l=>l.name===contact.location))
        .map(contact=>({
          name:contact.name,
          email:contact.email,
          role:contact.role,
          access:contact.access,
          locations:contact.location
        })),
      quotes:[],exceptions:[],orders:[],
      activity:[{when:'Now',what:'Existing Shopify Company linked to the app'}]
    };

    db.companies.push(normalizeCompany(company));

    state.selectedCompany=companyId;
    state.companyTab='pricing';
    state.view='company';
    closeModal();
    toast('Company added');
    state.companySetupStep=3;
    state.companySetupPolicySeeded=false; state.companySetupAddKind=null; state.companySetupDraftPolicy=null;
    state.companySetupPolicyByKind=emptyKindSel();
    state.companySetupDrafts={};
    state.priceCreateContext=null;
    return render();
  }
  /* ── Location resource actions ── */
  if(a==='open-company-locations'){ state.view='company'; state.companyTab='locations'; return render(); }
  if(a==='open-general-form') return openGeneralForm();
  if(a==='save-general-form'){
    const c=companyById(state.selectedCompany); const l=c&&locationById(c,state.selectedLocation);
    if(!c||!l) return;
    const name=document.getElementById('genFormName').value.trim();
    if(!name) return toast('Enter a location name');
    l.name=name;
    l.externalId=document.getElementById('genFormExternalId').value.trim();
    closeModal();
    toast('Location updated');
    return render();
  }
  if(a==='open-shipping-form') return openShippingForm();
  if(a==='save-shipping-form'){
    const c=companyById(state.selectedCompany); const l=c&&locationById(c,state.selectedLocation);
    if(!c||!l) return;
    l.shipping={
      country:document.getElementById('shipFormCountry').value,
      firstName:document.getElementById('shipFormFirstName').value.trim(),
      lastName:document.getElementById('shipFormLastName').value.trim(),
      company:document.getElementById('shipFormCompany').value.trim(),
      address1:document.getElementById('shipFormAddress1').value.trim(),
      address2:document.getElementById('shipFormAddress2').value.trim(),
      city:document.getElementById('shipFormCity').value.trim(),
      postal:document.getElementById('shipFormPostal').value.trim(),
      phoneCountry:document.getElementById('shipFormPhoneCountry').value,
      phone:document.getElementById('shipFormPhone').value.trim()
    };
    l.billingSameAsShipping=document.getElementById('shipFormBillingSame').checked;
    // Giữ dòng phụ ở Locations index khớp với shipping mới.
    l.address=[l.shipping.address1,l.shipping.city].filter(Boolean).join(', ');
    closeModal();
    toast('Shipping address updated');
    return render();
  }
  if(a==='set-loc-pricing') return openLocationPricing(t.dataset.kind);
  if(a==='save-loc-assign'){
    const c=companyById(state.selectedCompany); const l=c&&locationById(c,state.selectedLocation);
    if(!c||!l) return;
    const k=state.locAssignKind; if(!KIND_ORDER.includes(k)) return;
    if(!l.pricing) l.pricing={base:null,quantity:null};
    l.pricing[k]=state.locAssignPolicyId || null;
    closeModal();
    toast(l.pricing[k]?'Location pricing set':'Using company pricing');
    return render();
  }
  if(a==='create-loc-price'){
    const c=companyById(state.selectedCompany); const l=c&&locationById(c,state.selectedLocation);
    if(!c||!l) return;
    const k=state.locAssignKind;
    closeModal();
    state.builder=newBuilder(null);
    applyKindDefaults(state.builder, k);
    state.builder.audienceType='b2b';
    state.builder.b2bCompanyIds=[]; state.builder.b2bLocationIds=[l.id];
    state.builder._returnTo={view:'location'};
    state.pricingBuilderTab='settings';
    state.editScopeCompanyId=null; state.editScopeLocationId=null; state.forkToLocation=null;
    state.openSections={1:true,2:true,3:false,4:false};
    return renderBuilder();
  }
  if(a==='revert-loc-pricing'){
    const c=companyById(state.selectedCompany); const l=c&&locationById(c,state.selectedLocation);
    if(!c||!l||!l.pricing) return;
    l.pricing[t.dataset.kind]=null;
    toast('Reverted to company pricing');
    return render();
  }
  if(a==='open-company-quotes'){ state.view='company'; state.companyTab='quotes'; state.quoteFilter='all'; return render(); }
  if(a==='view-company-orders'){
    // Full history xem ở tab Orders của cả Company, gắn sẵn sort theo location nguồn.
    state.view='company'; state.companyTab='orders';
    state.orderLocationSort=t.dataset.locationId||null;
    return render();
  }
  if(a==='clear-order-location-sort'){ state.orderLocationSort=null; return render(); }
  if(a==='add-location') return openLocationForm(null);
  if(a==='save-location'){
    const c=companyById(state.selectedCompany); if(!c) return;
    const name=document.getElementById('locFormName').value.trim();
    if(!name) return toast('Enter a location name');
    const address=document.getElementById('locFormAddress').value.trim();
    const paymentTerms=document.getElementById('locFormTerms').value;
    const purchasingMode=document.querySelector('input[name="locFormMode"]:checked')?.value || 'DIRECT';
    if(state.locationFormId){
      const l=locationById(c, state.locationFormId); if(!l) return;
      Object.assign(l,{name,address,paymentTerms,purchasingMode});
      toast('Location updated');
    } else {
      const l={id:demoId('l'),name,address,status:'Active',paymentTerms,purchasingMode};
      c.locations.push(l);
      state.selectedLocation=l.id; state.view='location';
      toast('Location created');
    }
    state.locationFormId=null; closeModal(); return render();
  }
  if(a==='assign-buyer') return openAssignBuyer(t.dataset.locationId || state.selectedLocation);
  if(a==='confirm-assign-buyer'){
    const c=companyById(state.selectedCompany); if(!c) return;
    const ct=(c.contacts||[]).find(x=>x.email===t.dataset.buyerEmail); if(!ct) return;
    ct.locationId=t.dataset.locationId;
    const roleSel=t.closest('tr')?.querySelector('[data-buyer-role]');
    if(roleSel && roleSel.value) ct.role=roleSel.value;
    closeModal(); toast('Buyer assigned'); return render();
  }
  if(a==='unassign-buyer'){
    const c=companyById(state.selectedCompany); if(!c) return;
    const ct=(c.contacts||[]).find(x=>x.email===t.dataset.buyerEmail); if(!ct) return;
    ct.locationId=null;
    toast('Buyer removed from location'); return render();
  }
  if(a==='delete-company') return openDeleteAccount('company', t.dataset.deleteId || state.selectedCompany);
  if(a==='confirm-delete-company'){
    const id=t.dataset.deleteId; const company=companyById(id); if(!company) return;
    db.companies=db.companies.filter(c=>c.id!==id);
    db.attention=db.attention.filter(x=>x.company!==id);
    closeModal(); state.view='customers'; state.selectedCompany=db.companies[0]?.id||null;
    toast('Company deleted'); return render();
  }
  if(a==='toggle-empty-mode'){ setEmptyMode(!state.emptyMode); return render(); }
  if(a==='reset-demo'){ location.reload(); return; }
  if(a==='quotesnap') return toast('Handed to QuoteSnap');
  if(a==='quote-treatment') return openQuoteTreatment();
  if(a==='application-route') return openApplicationRoute();
  if(a==='base-page-prev'){ state.basePage=Math.max(1,(state.basePage||1)-1); return render(); }
  if(a==='base-page-next'){ state.basePage=(state.basePage||1)+1; return render(); }
  if(a==='build-base-from-quotes') return openCompanyClosedQuotesPricing(t.dataset.targetCompany);
  /* ── Cross-app price: quote → B2B pricing (opens the real select/create modal) ── */
  if(a==='open-quote-pricing'){
    return openQuotePricingModal(t.dataset.quote || state.selectedQuote);
  }
  /* Add the quoted prices to the base picked in the real assign modal, forking a
     company-specific copy first if that base is shared. */
  if(a==='apply-quote-assign'){
    const s=state.assign; if(!s || !s.quoteOverrides) return;
    const co=companyById(s.companyId); if(!co) return toast('Company not found.');
    const base=policyById(s.policyId); if(!base) return toast('Pick a pricing first.');
    const overrides=s.quoteOverrides;
    const u=policyUsage(base.id);
    const shared=(u.count - (u.companies.some(c=>c.id===co.id)?1:0))>0;
    let msg;
    if(shared){
      const fork=JSON.parse(JSON.stringify(base));
      fork.id=demoId('p'); fork.type='Account-specific';
      if(fork.name===base.name) fork.name=`${co.name} pricing`;
      fork.productAdjustments={...(fork.productAdjustments||{}), ...overrides}; fork.explicitEnabled=true;
      db.policies.push(fork);
      removeCompanyBase(co, base.id); addCompanyBase(co, fork.id);
      msg=`Forked ${base.name} → ${fork.name} and added the quoted prices`;
    } else {
      base.productAdjustments={...(base.productAdjustments||{}), ...overrides}; base.explicitEnabled=true;
      msg=`Quoted prices added to ${base.name}`;
    }
    closeModal();
    state.view='company'; state.selectedCompany=co.id; state.companyTab='pricing';
    toast(msg);
    return render();
  }
  if(a==='apply-quote'){ closeModal();
    if(state.quoteTreatment==='one-time') toast('Order created');
    else { toast('Pricing created');
      state.builder=newBuilder(null); state.builder.name='Highland Fitout from Q-1042';
      state.builder.scopeType='products';
      state.openSections={1:true,2:true,3:false,4:false}; renderBuilder(); }
    return; }
  if(a==='apply-route'){ closeModal();
    return toast(state.appRoute==='reject' ? 'Application declined' : 'Application approved'); }
  if(a==='demo') return toast('Demo only');
  if(a==='save-settings') return toast('Settings saved');
});

/* Mọi ô tìm kiếm lọc ngay khi gõ. Trước đây chúng nằm ở sự kiện change, mà change
   trên ô text chỉ bắn khi rời ô, nên gõ xong danh sách vẫn y nguyên và ô tìm kiếm
   đọc như một thứ hỏng. Vẽ lại thì ô bị thay mới, nên phải đặt lại con trỏ vào đúng
   vị trí cũ, không thì mỗi ký tự lại nhảy về cuối. */
const LIVE_SEARCH = {
  companySearch:      {key:'companySearch',      redraw:()=>render()},
  pricingSearch:      {key:'pricingSearch',      redraw:()=>render()},
  basePricingSearch:  {key:'basePricingSearch',  redraw:()=>{ state.basePage=1; return render(); }},
  productSearch:      {key:'productSearch',      redraw:()=>renderBuilder()},
  priceBoardSearch:   {key:'priceBoardSearch',   redraw:()=>reopenPriceBoard()},
  assignSearch:       {key:'assignSearch',       redraw:()=>renderAssign()},
  companyPickerSearch:{key:'companyPickerSearch',redraw:()=>openCompanyPicker()},
  customerPickerSearch:{key:'customerPickerSearch',redraw:()=>openCustomerPicker()}
};
function runLiveSearch(input){
  const name=Object.keys(LIVE_SEARCH).find(k=>input.dataset[k]!==undefined);
  if(!name) return false;
  const {key,redraw}=LIVE_SEARCH[name];
  const caret=input.selectionStart;
  state[key]=input.value;
  redraw();
  const again=document.querySelector(`[data-${name.replace(/[A-Z]/g,c=>'-'+c.toLowerCase())}]`);
  if(again){ again.focus(); try{ again.setSelectionRange(caret,caret); }catch(err){} }
  return true;
}

document.addEventListener('input', e => {
  if(runLiveSearch(e.target)) return;
  /* Clear a field's error as it is being fixed, without re-rendering — that
     would take the cursor out of the field mid-keystroke. */
  const bf=e.target.dataset.bf;
  if(bf && state.errors && state.errors[bf]){ const x={...state.errors}; delete x[bf]; setErrors(x); }
  if(e.target.dataset.companySetup) state[e.target.dataset.companySetup]=e.target.value;
  if(e.target.id==='shopifyCompanySearch'){
    state.shopifyCompanySearch=e.target.value;
    const q=e.target.value.trim().toLowerCase();
    let visible=0;
    document.querySelectorAll('[data-shopify-company]').forEach(row=>{
      const show=!q || (row.dataset.search||'').includes(q);
      row.style.display=show?'':'none';
      if(show) visible++;
    });
    const count=document.getElementById('shopifyCompanyCount');
    if(count) count.textContent=`${visible} available`;
  }
});

document.addEventListener('change', e => {
  const t=e.target;
  if(runLiveSearch(t)) return;
  if(t.dataset.companySort!==undefined){ state.companySort=t.value; return render(); }
  if(t.dataset.pricingSort!==undefined){ state.pricingSort=t.value; return render(); }
  if(t.dataset.tagInput!==undefined){
    const tag=(t.value||'').trim().replace(/,$/,'');
    t.value='';
    if(!tag) return;
    if(t.dataset.tagInput==='assign'){
      const list=state.assign.ids||[];
      if(!list.includes(tag)) state.assign.ids=[...list,tag];
      return renderAssign();
    }
    const list=state.builder.assignmentTargetIds||[];
    if(!list.includes(tag)) state.builder.assignmentTargetIds=[...list,tag];
    return renderBuilder();
  }
  if(t.dataset.setupPolicyKind){
    state.companySetupDraftPolicy = t.value || null;
    state.companySetupDraftIsNew = false;   // chosen from the library, not built here
    return openShopifyCompanySetup(3);
  }
  if(t.dataset.companySetup){
    state[t.dataset.companySetup]=t.value;
    return openShopifyCompanySetup();
  }
  if(t.dataset.bf){
    const b=state.builder, k=t.dataset.bf;
    if(state.errors && state.errors[k]){ const e={...state.errors}; delete e[k]; setErrors(e); }
    b[k] = ['value','priority'].includes(k) ? Number(t.value||0) : t.value;
    if(k==='pricingRule'){ if(b.pricingRule==='set') b.valueType='amount'; }
    return renderBuilder();
  }
  if(t.dataset.assignmentSelect){
    const id=t.dataset.assignmentSelect; const list=state.builder.assignmentTargetIds||[];
    state.builder.assignmentTargetIds=t.checked?[...new Set([...list,id])]:list.filter(x=>x!==id);
    return renderBuilder();
  }
  if(t.dataset.vf){
    const arr=state.builder.volumeRanges=state.builder.volumeRanges||[];
    const idx=Number(t.dataset.idx); const row=arr[idx]||{}; const key=t.dataset.vf;
    row[key]=['from','to','value'].includes(key)?Number(t.value||0):t.value;
    arr[idx]=row; return renderBuilder();
  }
  if(t.dataset.crAddval!==undefined){
    /* Thêm một value vào condition (multi-value). Select tự reset về option rỗng
       sau khi render lại. */
    const arr=state.builder.conditionalRules||[];
    const [ri,ci]=String(t.dataset.crAddval).split('.').map(Number);
    const r=arr[ri]; const c=r&&(r.conditions||[])[ci]; if(!c || !t.value) return;
    const vals=condValues(c); if(!vals.includes(t.value)) vals.push(t.value);
    c.values=vals; delete c.value; state.ruleEditError=false;
    if(state.errors && state.errors.rule){ const e={...state.errors}; delete e.rule; setErrors(e); }
    return renderBuilder();
  }
  if(t.dataset.crRule!==undefined || t.dataset.crAdjval!==undefined){
    const arr=state.builder.conditionalRules||[];
    const idx=Number(t.dataset.crRule ?? t.dataset.crAdjval);
    const r=arr[idx]; if(!r) return;
    if(t.dataset.crRule!==undefined){
      if(t.value==='set'){ r.rule='set'; r.valueType='amount'; }
      else if(t.value==='decrease_amt'){ r.rule='decrease'; r.valueType='amount'; }
      else { r.rule='decrease'; r.valueType='percentage'; }
    }
    if(t.dataset.crAdjval!==undefined) r.value=t.value===''?null:Number(t.value);
    return renderBuilder();
  }
  if(t.dataset.bp){
    const b=state.builder, sku=t.dataset.bp;
    b.selectedProducts = t.checked ? [...new Set([...(b.selectedProducts||[]),sku])]
                                   : (b.selectedProducts||[]).filter(s=>s!==sku);
    return renderBuilder();
  }
  if(t.dataset.adjRule || t.dataset.adjValue || t.dataset.adjType){
    const b=state.builder;
    const sku = t.dataset.adjRule || t.dataset.adjValue || t.dataset.adjType;
    b.productAdjustments = b.productAdjustments || {};
    const o = b.productAdjustments[sku] || {};
    if(t.dataset.adjRule){ if(!t.value) delete b.productAdjustments[sku]; else { o.rule=t.value; if(t.value==='set') o.valueType='amount'; b.productAdjustments[sku]=o; } }
    if(t.dataset.adjValue){ o.value=Number(t.value||0); b.productAdjustments[sku]=o; }
    if(t.dataset.adjType){ o.valueType=t.value; b.productAdjustments[sku]=o; }
    return renderBuilder();
  }
  if(t.dataset.as){ state.assign[t.dataset.as] = t.value;
    return renderAssign(); }
  if(t.dataset.locPolicy!==undefined){ state.locAssignPolicyId = t.value;
    return renderLocationPricing(); }
});

document.querySelectorAll('.scrim').forEach(s => s.addEventListener('click', e => {
  if(e.target === s) s.classList.remove('open');
}));
document.addEventListener('keydown', e => { if(e.key==='Escape'){ closeDrawer(); closeModal(); } });

/* ── Handoff from QuoteSnap RFQ ──────────────────────────────────────────
   The RFQ app writes the just-created company to localStorage and navigates
   here. Read it once, add it to db.companies (or match an existing one by
   name), and open that company. */
// Build (or match) a B2B company from an RFQ payload; returns its id.
function injectRfqCompany(p){
  if(!p || !p.id || !p.name) return null;
  const existing = db.companies.find(c => c.id === p.id || c.name === p.name);
  // The requester (from the quote) is the person being assigned into a location.
  const reqName = (p.quote && p.quote.buyer) || p.mainContact || p.contactEmail || '';
  const reqEmail = (p.quote && p.quote.email) || p.contactEmail || '';
  let id;
  if(existing){
    id = existing.id;
    const assigned = p.assignedLocation || (existing.locations[0] && existing.locations[0].name) || '';
    // A location created during the flow may be new to this company — add it.
    let loc = existing.locations.find(l => l.name === assigned);
    if(assigned && !loc){
      loc = { id:id+'-l'+(existing.locations.length+1), name:assigned, ordering:'Quote only', terms:p.terms || 'Not set', lastOrder:null, buyers:0 };
      existing.locations.push(loc);
    }
    // Add the requester as a contact at the assigned location, if not already
    // there — and count them as a buyer of that location.
    if(reqEmail && !existing.contacts.some(c => c.email === reqEmail)){
      existing.contacts.push({ name:reqName || reqEmail, email:reqEmail, role:'Ordering only', access:'Quote only', locations:assigned });
      if(loc) loc.buyers = (loc.buyers || 0) + 1;
    }
  } else {
    id = p.id;
    const locNames = ((p.locationList && p.locationList.length) ? p.locationList : [p.locationName || p.name]).slice();
    const assigned = p.assignedLocation || locNames[0];
    // A location created during the flow may not be in the Shopify list — include it.
    if(assigned && locNames.indexOf(assigned) === -1) locNames.push(assigned);
    // Syncing pulls the WHOLE company across — materialize every buyer, not just
    // the requester, so B2B buyer counts match the RFQ signal (source of truth).
    let contacts = [];
    if(p.buyerList && p.buyerList.length){
      contacts = p.buyerList.map(b => ({
        name: b.name || b.email, email: b.email,
        role: (reqEmail && b.email === reqEmail) ? 'Location admin' : 'Ordering only',
        access: 'Quote only',
        // The requester lands where the picker put her; the rest keep their home.
        locations: (reqEmail && b.email === reqEmail) ? assigned : (b.location || assigned)
      }));
    }
    // Requester not covered by the list → add her at the assigned location.
    if(reqEmail && !contacts.some(c => c.email === reqEmail)){
      contacts.push({ name:reqName || reqEmail, email:reqEmail, role:'Location admin', access:'Quote only', locations:assigned });
    }
    // Every buyer's location must exist on the company.
    contacts.forEach(c => { if(c.locations && locNames.indexOf(c.locations) === -1) locNames.push(c.locations); });
    db.companies.push({
      id, name:p.name, mainContact:reqName || 'Not set',
      source:'QuoteSnap RFQ', externalId:p.externalId || '',
      pricing:{base:null, quantity:null}, revenue:0, orders:[],
      locations: locNames.map((ln, i) => ({ id:id+'-l'+(i+1), name:ln, ordering:'Quote only', terms:p.terms || 'Not set', lastOrder:null, buyers: contacts.filter(c => c.locations === ln).length })),
      contacts,
      quotes:[], exceptions:[],
      activity:[{when:'Today', what:'Created from QuoteSnap RFQ'}]
    });
  }
  normalizeCompany(companyById(id));
  // Bring the originating RFQ quote across too, so the company's Quotes tab is the record.
  if(p.quote && p.quote.id && !db.quotes.some(q => q.id === p.quote.id && q.company === id)){
    db.quotes.push({
      id:p.quote.id, company:id,
      buyer:p.quote.buyer || p.mainContact || '', email:p.quote.email || p.contactEmail || '',
      location:p.assignedLocation || p.locationName || p.name,
      created:p.quote.created || 'Today', updated:p.quote.created || 'Today',
      leadScore:null, progress:'Quote received', status:'New Received',
      assignee:null, expires:null, source:'RFQ form'
    });
  }
  return id;
}

// Restore every company created/synced from RFQ (persist across tab switches).
(function restoreRfqCompanies(){
  let raw = null;
  try { raw = localStorage.getItem('rfqB2BDemoState'); } catch(e){ return; }
  if(!raw) return;
  let s; try { s = JSON.parse(raw); } catch(e){ return; }
  if(s && s.b2bCompanies) Object.keys(s.b2bCompanies).forEach(k => injectRfqCompany(s.b2bCompanies[k]));
})();

// Reset the whole demo (shared with the RFQ app) back to seed.
document.getElementById('resetDemoBtn').addEventListener('click', () => {
  try { localStorage.removeItem('rfqB2BDemoState'); localStorage.removeItem('rfqHandoffCompany'); } catch(e){}
  window.location.reload();
});

/* Apply the destination the merchant already chose on the RFQ side — create a
   scoped base or merge into an existing one (forking if shared). Same engine as
   the in-app modal; here it runs without re-prompting. */
function applyQuotePricingTransfer(companyId, lines, transfer){
  const co = companyById(companyId); if(!co) return '';
  const priced = (lines||[]).filter(l=>l.quoted!=null && productBySku(l.sku));
  if(!priced.length) return '';
  const overrides = {};
  priced.forEach(l=>{ overrides[l.sku]={rule:'set', valueType:'amount', value:Number(l.quoted)}; });
  const tid = transfer && transfer.targetId;
  if(tid==='__new__' || !policyById(tid)){
    const prof = quoteToBasePricing(transfer.newName || `${co.name} quote prices`, transfer.newPriority, overrides);
    prof.id = demoId('p'); db.policies.push(prof); addCompanyBase(co, prof.id);
    return `Quote prices saved as “${prof.name}”`;
  }
  const base = policyById(tid), u = policyUsage(base.id);
  const shared = (u.count - (u.companies.some(c=>c.id===co.id)?1:0)) > 0;
  if(shared){
    const fork = JSON.parse(JSON.stringify(base));
    fork.id = demoId('p'); fork.type='Account-specific';
    if(fork.name===base.name) fork.name=`${co.name} pricing`;
    fork.productAdjustments = {...(fork.productAdjustments||{}), ...overrides}; fork.explicitEnabled=true;
    db.policies.push(fork); removeCompanyBase(co, base.id); addCompanyBase(co, fork.id);
    return `Forked ${base.name} → ${fork.name} with the quote prices`;
  }
  base.productAdjustments = {...(base.productAdjustments||{}), ...overrides}; base.explicitEnabled=true;
  return `Quote prices added to ${base.name}`;
}

// Handoff: open the specific company just handed over from RFQ.
(function receiveRfqHandoff(){
  let raw = null;
  try { raw = localStorage.getItem('rfqHandoffCompany'); } catch(e){ return; }
  if(!raw) return;
  try { localStorage.removeItem('rfqHandoffCompany'); } catch(e){}
  let p; try { p = JSON.parse(raw); } catch(e){ return; }
  const id = injectRfqCompany(p);
  if(!id) return;
  state.view = 'company';
  state.selectedCompany = id;
  const lines = (p.quote && Array.isArray(p.quote.lines)) ? p.quote.lines : [];
  const hasLines = !!lines.length;
  state.companyTab = (hasLines && (p.pricingTransfer || p.pricingIntent)) ? 'pricing' : 'locations';
  /* The merchant already chose on the RFQ side → apply it. If they deferred
     (intent only, no chosen destination) → open the real modal to choose here. */
  if(hasLines && p.pricingTransfer) state._pendingQuoteApply = {companyId:id, lines, transfer:p.pricingTransfer};
  else if(hasLines && p.pricingIntent) state._pendingQuotePricing = {companyId:id, lines};
})();

if(state._pendingQuoteApply){
  const a = state._pendingQuoteApply; state._pendingQuoteApply = null;
  state._quoteToast = applyQuotePricingTransfer(a.companyId, a.lines, a.transfer);
}
render();
if(state._quoteToast){ const m=state._quoteToast; state._quoteToast=null; toast(m); }
if(state._pendingQuotePricing){
  const pend = state._pendingQuotePricing; state._pendingQuotePricing = null;
  openQuotePricingAssign(pend.companyId, pend.lines);
}
</script>
<script>
// ── Prototype version switcher ────────────────────────────────────────────
// Cùng logic với trang RFQ: manifest đọc từ root, snapshot nằm ở /versions/vN/.
(function(){
  const match = location.pathname.match(/\/versions\/(v\d+)(\/|$)/);
  const current = match ? match[1] : 'latest';
  fetch('/versions/manifest.json', {cache: 'no-store'})
    .then(r => r.ok ? r.json() : null)
    .then(data => {
      const versions = data && Array.isArray(data.versions) ? data.versions : null;
      if(!versions) return;
      const sel = document.getElementById('versionSwitcher');
      if(sel){
        const opts = [{id: 'latest', label: 'Version: Latest'}]
          .concat(versions.slice().reverse().map(v => ({id: v.id, label: `Version: ${v.id} · ${v.date}`})));
        sel.innerHTML = opts.map(o => `<option value="${o.id}"${o.id === current ? ' selected' : ''}>${o.label}</option>`).join('')
          + '<option value="changelog">Changelog ↗</option>';
        sel.style.display = '';
        sel.addEventListener('change', () => {
          location.href = sel.value === 'changelog' ? '/versions/'
            : sel.value === 'latest' ? '/b2b/' : `/versions/${sel.value}/b2b/`;
        });
      }
    })
    .catch(() => {});
})();
</script>
