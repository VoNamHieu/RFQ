const TODAY = new Date('2026-07-28');
/* Status suy ra, không lưu. Một pricing không ai giữ thì không tính giá cho ai, nên
   in "Active" lên nó là nói sai về thứ đang xảy ra. Thứ tự đọc theo mức độ quyết
   định: tắt tay là quyết định rõ ràng nhất, kế đến là không có ai giữ, rồi mới đến
   ngày hiệu lực. `reason` để chỗ hiển thị nói được vì sao, thay vì bắt người dùng
   đoán từ một chữ Inactive. */
function policyStatus(p){
  if(!p) return {label:'Not set', tone:'', reason:''};
  if(p.status==='Inactive')
    return {label:'Inactive', tone:'', reason:'Turned off. It applies to nobody until it is turned back on.'};
  if(!policyUsageCount(p.id))
    return {label:'Inactive', tone:'', reason:'Nobody is assigned this pricing, so it changes no prices. Assign it to make it live.'};
  if(p.validityType==='dated' && p.startDate && new Date(p.startDate) > TODAY)
    return {label:'Scheduled', tone:'info', reason:validityLabel(p)};
  return {label:'Active', tone:'success', reason:validityLabel(p)};
}
const POLICY_STATUSES = ['Active','Scheduled','Inactive'];
/* Tắt hay bật một pricing chưa gán cho ai thì không đổi gì cả, nên nút đó không có
   việc để làm. Nó xuất hiện lại ngay khi có người giữ, kể cả với pricing từng bị
   tắt tay, nên không có ngõ cụt. */
const canToggleStatus = p => !!(p && policyUsageCount(p.id));

function validityLabel(p){
  if(!p) return 'None';
  return p.validityType==='evergreen' ? 'Always on' : `${date(p.startDate)} to ${date(p.endDate)}`;
}

/* counts */
const companyNeedsPrice = c => c.locations.some(l => !resolveCompany(c,l).profile);

/* The derived Company state answers one question, the one this app exists to
   answer: does a price apply to it. "Pricing status" says which question is
   being answered, and its two values are the two the filter offers, so a badge
   and a filter can never describe the list differently. Whether a given
   Location can actually place the order is a Location question and stays on
   the Location badge, where the missing buyer account or payment term is
   named. */
function companyStatus(c){
  return companyNeedsPrice(c)
    /* Neutral, not amber: a Company without pricing yet is an ordinary step
       left to do, not something that went wrong. */
    ? {label:'Needs a price', tone:'',
       why:'No pricing applies to this Company yet, so its buyers cannot order.'}
    : {label:'Price ready', tone:'success',
       why:`Pricing applies to all ${c.locations.length} Location${c.locations.length===1?'':'s'} of this Company.`};
}
function counts(){
  return {
    companies:db.companies.length,
    cNeed:db.companies.filter(companyNeedsPrice).length,
    profiles:db.policies.filter(p=>p.type==='Reusable').length
  };
}

/* Polaris Toast: short confirmations only, ideally noun + verb and no longer
   than about three words, never carrying an instruction the merchant has to
   act on, and on screen for at least 10,000ms so a screen reader can finish
   announcing it. */
/* A fresh install has none of this app's own records: no Company linked, no
   pricing written, no tag priced, no store-wide default. It still has all of
   Shopify's: products, customers, and the Companies waiting to be linked. The
   toggle empties only the first set, so the empty states show what a merchant
   actually sees on day one rather than a blank screen. */
let demoBackup = null;
function setEmptyMode(on){
  state.emptyMode = !!on;
  if(on){
    if(!demoBackup) demoBackup = JSON.parse(JSON.stringify({
      companies:db.companies, policies:db.policies, tagPricing:db.tagPricing,
      defaults:db.defaults, customers:db.customers, quotes:db.quotes, directory:shopifyCompanyDirectory}));
    shopifyCompanyDirectory.length=0;
    db.companies=[];
    db.policies=[];
    db.quotes=[];
    db.tagPricing=db.tagPricing.map(t=>({...t, defaultPolicyId:null}));
    db.customers=db.customers.map(c=>({...c, policyId:null}));
    db.defaults={b2bPolicyId:null, wholesalePolicyId:null};
  } else if(demoBackup){
    db.companies=JSON.parse(JSON.stringify(demoBackup.companies));
    db.policies=JSON.parse(JSON.stringify(demoBackup.policies));
    db.tagPricing=JSON.parse(JSON.stringify(demoBackup.tagPricing));
    db.customers=JSON.parse(JSON.stringify(demoBackup.customers));
    db.quotes=JSON.parse(JSON.stringify(demoBackup.quotes));
    db.defaults=JSON.parse(JSON.stringify(demoBackup.defaults));
    shopifyCompanyDirectory.length=0;
    JSON.parse(JSON.stringify(demoBackup.directory)).forEach(c=>shopifyCompanyDirectory.push(c));
    demoBackup=null;
  }
  state.selectedCompany=db.companies[0]?.id||null;
  state.view=state.view==='company'?'customers':state.view;
}

   thì mở đúng chỗ làm việc đó. */
const RFQ_APP_URL = 'https://admin.shopify.com/store/northline-supply/apps/quotesnap/form/quotes';
/* The Shopify admin, not this app: companies are created there. */

/* Shopify puts a help link under the content of a page, on every page and in
   every state, so a merchant who is stuck on an empty screen has somewhere to
   go. Rendered by render(), which means no page can forget it. */
const HELP_LINKS = {
  customers:['linking B2B companies','https://help.shopify.com/en/manual/b2b/companies'],
  company:['company pricing','https://help.shopify.com/en/manual/b2b/catalogs'],
  quote:['B2B quotes and draft orders','https://help.shopify.com/en/manual/b2b/orders'],
  pricing:['B2B pricing and catalogs','https://help.shopify.com/en/manual/b2b/catalogs'],
  settings:['setting up B2B','https://help.shopify.com/en/manual/b2b']
};
function helpFooter(view){
  const h = HELP_LINKS[view] || HELP_LINKS.settings;
  return `<div class="help-foot">Learn more about
    <a href="${h[1]}" target="_blank" rel="noopener">${h[0]}</a></div>`;
}

function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>t.remove(),10000);
}
function openDrawer(title, body, foot, full){
  const drawer = document.getElementById('drawer');
  const scrim = document.getElementById('drawerScrim');
  /* The builder re-renders itself in place on every toggle (audience, sections,
     scope…). Rebuilding the drawer recreates .drawer-body, its scroll container,
     which would snap the merchant back to the top mid-edit. Keep the scroll
     position when we're re-rendering the same drawer that is already open; a new
     drawer (different title) still opens at the top. */
  const sameDrawerReopen = scrim.classList.contains('open') && drawer.dataset.drawerKey === title;
  const keepScroll = sameDrawerReopen ? (drawer.querySelector('.drawer-body')?.scrollTop || 0) : 0;
  drawer.className = 'drawer' + (full?' fullscreen':'');
  drawer.dataset.drawerKey = title;
  drawer.innerHTML =
    `<div class="drawer-head"><h2>${title}</h2><button class="x-btn" data-close-drawer aria-label="Close">${ICON.close}</button></div>
     <div class="drawer-body">${body}</div>
     <div class="drawer-foot">${foot||'<button class="btn" data-close-drawer>Close</button>'}</div>`;
  scrim.classList.add('open');
  if(sameDrawerReopen){ const nb = drawer.querySelector('.drawer-body'); if(nb) nb.scrollTop = keepScroll; }
}
function closeDrawer(){ document.getElementById('drawerScrim').classList.remove('open'); }
function openModal(title, body, foot, wide){
  const m = document.getElementById('modal');
  m.className = 'modal' + (wide ? ' modal-wide' : '');
  m.innerHTML =
    `<div class="drawer-head"><h2>${title}</h2><button class="x-btn" data-close-modal aria-label="Close">${ICON.close}</button></div>
     <div class="drawer-body">${body}</div>
     <div class="drawer-foot">${foot||'<button class="btn" data-close-modal>Close</button>'}</div>`;
  document.getElementById('modalScrim').classList.add('open');
}
function closeModal(){ document.getElementById('modalScrim').classList.remove('open'); }

const demoId = prefix => `${prefix}${Date.now().toString(36)}${Math.floor(Math.random()*999).toString(36)}`;
const cleanValue = id => (document.getElementById(id)?.value || '').trim();
function openShopifyCompanyBrowser(){
  state.companySource='shopify';
  const q = (state.shopifyCompanySearch || '').toLowerCase();
  const selected = shopifyCompanyDirectory.find(c=>c.id===state.selectedShopifyCompany) || null;

  /* A Company that is already linked is not shown at all. Listing it as a
     disabled row only tells the merchant about a record they cannot act on
     here, and it made the list read as a mix of two different things. */
  const available = shopifyCompanyDirectory.filter(company=>!db.companies.some(c=>c.shopifyCompanyId===company.id));
  const addedCount = shopifyCompanyDirectory.length - available.length;

  const rows = available.map(company=>{
    const searchable = `${company.name} ${company.locations.map(l=>l.name).join(' ')} ${company.contacts.map(c=>c.email).join(' ')}`.toLowerCase();
    const hidden = q && !searchable.includes(q);
    return `<button class="directory-row ${selected?.id===company.id?'selected':''}" 
        data-shopify-company="${company.id}" data-search="${esc(searchable)}"
        style="${hidden?'display:none':''}">
      <span class="directory-radio" aria-hidden="true"></span>
      <span>
        <span class="directory-title">${esc(company.name)}</span>
        <span class="directory-meta">${company.locations.length} location${company.locations.length===1?'':'s'} · ${company.contacts.length} contact${company.contacts.length===1?'':'s'}</span>
      </span>
    </button>`;
  }).join('') || `<div class="empty" style="padding:32px 20px">
      <div class="empty-title">${shopifyCompanyDirectory.length?'All companies already added':'No Shopify companies found'}</div>
      <p>${shopifyCompanyDirectory.length
        ? 'Open them from B2B Company to set their pricing.'
        : 'Create a B2B company in Shopify admin. When you return, it will appear here and be available to link.'}</p>
    </div>`;

  const addedNote = addedCount
    ? `<div class="banner info" style="margin:0 0 12px"><div>Only Companies that are not in this app yet are listed. ${addedCount} already-added Compan${addedCount===1?'y is':'ies are'} hidden. Open ${addedCount===1?'it':'them'} from B2B Company.</div></div>`
    : '';

  /* With nothing to list there is nothing to search and nothing to select, so
     the toolbar and the instruction underneath come off. */
  const isEmpty = !available.length;
  openModal('Add company from Shopify', `
    ${addedNote}
    ${isEmpty?'':`<div class="directory-toolbar">
      ${searchField('Search company, location or buyer email','id="shopifyCompanySearch"',state.shopifyCompanySearch)}
      <span class="badge" id="shopifyCompanyCount">${available.length} available</span>
    </div>`}
    <div class="directory-list" id="shopifyCompanyDirectory" ${isEmpty?'style="border:0;background:transparent"':''}>${rows}</div>
    ${isEmpty?'':`<div class="hint" style="margin-top:8px">${selected
      ? `<b>${esc(selected.name)}</b> selected. Continue to review its Locations and set pricing.`
      : 'Select a Company to link it to this app. All of its Locations come along in the next step (you cannot pick a subset).'}</div>`}`,
    `<button class="btn" data-close-modal>Cancel</button>
     ${isEmpty
       ? (shopifyCompanyDirectory.length
          ? `<button class="btn primary" data-view="customers" data-close-modal>Go to B2B Company</button>`
          : `<a class="btn primary" href="${SHOPIFY_COMPANIES_URL}" target="_blank" rel="noopener">Create Shopify company${ICON.external}</a>`)
       : `<button class="btn primary" data-action="continue-shopify-company" ${selected?'':'disabled'}>Continue</button>`}`);
}

/* Setup: Company → Locations → pricing → review. Bước Locations quay lại vì
   Location giờ là resource thật — partial link không còn là ngõ cụt (location
   thiếu thêm được sau từ tab Locations của Company). */
function companySetupSteps(){
  const current=Number(state.companySetupStep||3);
  const steps=[[1,'Company'],[2,'Locations'],[3,'Assign pricing'],[4,'Review']];
  return `<div class="setup-steps">${steps.map((step,i)=>{
    const done=step[0]<current, active=step[0]===current;
    return `<div class="setup-step ${done?'done':''} ${active?'active':''}">
      <span class="step-dot">${done?'✓':i+1}</span><span>${step[1]}</span>
    </div>`;
  }).join('')}</div>`;
}

function companyDefaultPolicy(){
  return state.companySetupPricingMode==='existing'
    ? setupPolicy(state.companySetupPolicyId)
    : null;
}

function openShopifyCompanySetup(step=null){
  const source=shopifyCompanyDirectory.find(c=>c.id===state.selectedShopifyCompany);
  if(!source) return openShopifyCompanyBrowser();
  if(step!==null) state.companySetupStep=Number(step);
  /* selectedShopifyLocations được seed đủ khi Continue từ browser; merchant
     tinh chỉnh ở bước Locations (step 2). */
  if(!Array.isArray(state.selectedShopifyLocations)) state.selectedShopifyLocations=source.locations.map(l=>l.id);
  if(!state.companySetupPolicyByKind) state.companySetupPolicyByKind=emptyKindSel();
  if(!state.companySetupPolicySeeded){
    state.companySetupPolicySeeded=true;
    state.companySetupPricingMode = kindSelPrimary(state.companySetupPolicyByKind) ? 'existing' : 'later';
  }
  syncSetupPolicySelections();

  const selectedLocations=source.locations.filter(l=>state.selectedShopifyLocations.includes(l.id));
  const selectedPolicy=policyById(state.companySetupPolicyId);
  const selectedHeader=`
    <div class="selected-source">
      <div><div class="cell-main">${esc(source.name)}</div>
        <div class="cell-sub">${source.locations.length} locations · ${source.contacts.length} contacts</div></div>
    </div>`;

  let body='', foot='';

  if(state.companySetupStep===2){
    /* Location pick: chọn Location nào của Company đi vào app. Contact đi theo
       Location được chọn; pricing vẫn là Company-level, không hỏi ở đây. */
    body=`
      ${companySetupSteps()}
      ${selectedHeader}
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">
        ${source.locations.map(l=>{
          const nBuyers=buyersAt(source,l.name).length;
          /* Locations không chọn/untick riêng — mọi Location của Company đều được đưa vào (khoá). */
          return `<label class="rule-card selected" style="cursor:default">
            <input type="checkbox" checked disabled>
            <div><div class="rule-title">${esc(l.name)}</div>
              <div class="rule-desc">${esc(l.terms)} · ${esc(l.ordering)} · ${nBuyers} buyer${nBuyers===1?'':'s'}</div></div>
          </label>`;
        }).join('')}
      </div>
      <div class="inline-note" style="margin-top:10px">All ${source.locations.length} location${source.locations.length===1?'':'s'} will be added. Contacts follow their location.</div>`;
    foot=`<button class="btn" data-action="company-setup-back">Back</button>
      <button class="btn primary" data-action="company-setup-next" ${selectedLocations.length?'':'disabled'}>Continue</button>`;
  }

  if(state.companySetupStep===3){
    /* This version always prices the whole Company: every Location of the
       Company shares one pricing. There is no per-Location pricing anywhere
       in this version. */

    /* One select per pricing model. A target can hold a Price list, a Volume
       pricing and a Price rule at the same time; the most specific one wins. */
    /* One flow: add pricing. A Company can hold at most one profile per pricing
       type, so each type can be added once and the card greys out afterwards. */
    const kindDesc = KIND_TOOLTIP;

    /* A pricing type only appears in the added list once it is saved. While its
       editor is open the row is hidden, so a draft never looks committed.
       The full summary belongs to the deciding stage — the chooser shows it
       before Save. Once it is in the slot, one line is enough. */
    const rowHtml = (k, ref) => {
      const p = setupPolicy(ref);
      if(!p) return '';
      const createdHere = isDraftRef(ref);
      return `<div class="added-row">
        <span class="dot ready"></span>
        <span class="grow"><span class="a-name">${esc(p.name)}</span>
          <span class="a-meta">${kindName(k)}</span></span>
        ${createdHere
          ? `<button class="btn small icon" data-action="setup-edit-kind" data-kind="${k}" data-ref="${ref}"
               title="Edit pricing" aria-label="Edit pricing">${ICON.edit}</button>`
          : (k==='quantity'
            ? `<button class="btn small icon" data-action="setup-change-kind" data-kind="${k}"
               title="Change to another ${kindName(k).toLowerCase()}" aria-label="Change to another ${kindName(k).toLowerCase()}">${ICON.swap}</button>`
            : '')}
        <button class="btn small icon critical" data-action="setup-remove-kind" data-kind="${k}" data-ref="${ref}"
          title="Remove this ${kindName(k).toLowerCase()}" aria-label="Remove this ${kindName(k).toLowerCase()}">${ICON.unassign}</button>
      </div>`;
    };
    /* Base: mọi base đã thêm luôn hiện (draft đang dựng nằm ở chooser, chưa vào list).
       Quantity: 1 slot, ẩn khi đang mở chooser để đổi. */
    const addedRows = [
      ...selBaseRefs(state.companySetupPolicyByKind).map(ref=>rowHtml('base',ref)),
      ...(state.companySetupPolicyByKind.quantity && state.companySetupAddKind!=='quantity'
        ? [rowHtml('quantity', state.companySetupPolicyByKind.quantity)] : [])
    ].join('');

    const addedCount = selBaseRefs(state.companySetupPolicyByKind).length + (state.companySetupPolicyByKind.quantity?1:0);
    const addKind = state.companySetupAddKind;

    /* Three bare buttons named after concepts the merchant may be meeting for
       the first time. Each card says what its type does; how the three rank
       against each other stays in the tooltip. */
    const typeCards = `<div class="kind-pick-row">
      ${KIND_ORDER.map(k=>{
        const taken = k==='base' ? false : !!state.companySetupPolicyByKind[k];
        return `<button class="kind-pick ${taken?'taken':''}" title="${taken?'Already added':kindDesc[k]}"
          ${taken?'disabled':`data-action="setup-add-kind" data-kind="${k}"`}>
          <span class="k-head"><span class="plus">${taken?'✓':'+'}</span>${kindName(k)}</span>
          <span class="k-purpose">${kindPurpose(k)}</span>
        </button>`;
      }).join('')}
    </div>`;

    /* Picking a type opens the choice between an existing profile and a new one. */
    const kindChooser = addKind ? (()=>{
      const label = kindName(addKind).toLowerCase();
      /* Setup luôn gán cho một Company, nên chỉ pricing phục vụ Company mới được
         chào ở đây. Pricing của phía customer không tìm thấy và không gán được. */
      const options = policiesFor('b2b', addKind).filter(p=> addKind!=='base' || !selBaseRefs(state.companySetupPolicyByKind).includes(p.id));
      const cur = state.companySetupDraftPolicy || '';
      const sel = setupPolicy(cur);
      /* A pricing just built in this flow is the selection. Leaving the library
         dropdown live would let one wrong pick replace it with no way back —
         it is a brand-new profile among a list of names that all look alike.
         Discard is the way out, and it says so. */
      const justBuilt = !!(sel && state.companySetupDraftIsNew);
      return `<div class="soft-card" style="margin-top:6px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <h3 style="margin:0;flex:1">${addKind==='base'?'Add':(state.companySetupPolicyByKind.quantity?'Change':'Add')} ${label}</h3>
          ${sel && state.companySetupDraftIsNew
            ? `<button class="btn small" data-action="setup-edit-draft">Edit</button>` : ''}
          <button class="btn small" data-action="setup-discard-kind">Discard</button>
          <button class="btn primary small" data-action="setup-save-kind" ${sel?'':'disabled'}>Save</button>
        </div>
        ${justBuilt
          ? `<div class="form-field"><label>New ${label}</label>
              <div class="added-row" style="margin:0">
                <span class="dot ready"></span>
                <span class="grow"><span class="a-name">${esc(sel.name)}</span></span>
              </div>
              <div class="hint">Discard to go back to picking an existing ${label}.</div>
            </div>`
          : options.length
            ? `<div class="form-field"><label>Use an existing ${label}</label>
                <select data-setup-policy-kind="${addKind}">
                  <option value="">Select a ${label}…</option>
                  ${options.map(p=>`<option value="${p.id}" ${p.id===cur?'selected':''}>${esc(p.name)}</option>`).join('')}
                </select>
              </div>`
            /* Nothing to pick from: a disabled select reading "No price rule
               profiles yet" is a control that exists only to say it cannot be
               used. Creating one is the only route, so that is the only thing
               on screen. Nói luôn lý do, vì thư viện có thể đang đầy pricing mà
               vẫn không cái nào hiện ra ở đây. */
            : `<div class="inline-note" style="margin-bottom:8px">No ${label} serves Companies yet. Pricing set up for customers cannot be assigned to a Company.</div>`}
        ${sel?`<div class="review-block" style="margin-bottom:8px"><div class="review-body"><dl class="kv">
          <dt>Products</dt><dd>${scopeLabel(sel)}</dd>
          <dt>Price calculation</dt><dd>${priceLabel(sel)}</dd>
          <dt>Also assigned to</dt><dd>${policyUsageCount(sel.id)?`${policyUsageLabel(sel.id)}. Editing it later changes all of them`:'Nothing else yet'}</dd>
        </dl></div></div>`:''}
        ${sel?'':`
          ${options.length?`<div class="chooser-or">or</div>`:''}
          ${addKind==='base' && selBaseRefs(state.companySetupPolicyByKind).some(isDraftRef)
            ? `<div class="inline-note">You can create one new base pricing here. Add existing ones now, or create more from Pricing after setup.</div>`
            : `<button class="btn-alt" data-action="create-price-for-company-setup" data-kind="${addKind}">
                <span class="plus">+</span>Create a new ${label}
              </button>`}`}
      </div>`;
    })() : '';

    const companyEditor=`
      <div class="context-target-title">Assign pricing</div>

      ${addedRows}
      ${(selBaseRefs(state.companySetupPolicyByKind).some(isDraftRef) || (isDraftRef(state.companySetupPolicyByKind.quantity) && state.companySetupAddKind!=='quantity'))
        ? `<div class="hint" style="margin:-2px 0 8px">A pricing created here can’t be swapped for a template. Remove it to pick a template, or edit it.</div>` : ''}

      ${/* An open editor decides what shows here — not how many slots are
            filled. Keying on the count meant Change on a Company with all three
            types set rendered "All three pricing types are set." instead of the
            chooser: the row hid itself, no editor appeared, and Review stayed
            disabled because an editor was open. Nothing left to click. */''}
      ${addKind ? kindChooser : typeCards}

      ${addedCount===0 && !addKind
        ? `<div class="banner warning" style="margin-top:4px"><div><b>No pricing yet</b>You can still finish setup. The Company and its Locations are added, but buyers cannot order until pricing is assigned from the Pricing page.</div></div>`
        : ''}`;

    body=`
      ${companySetupSteps()}
      ${companyEditor}`;
    /* An open chooser with nothing picked in it costs nothing to walk away
       from, so it does not block the step. Only an unsaved choice does: that is
       something the merchant selected or built, and continuing past it would
       drop it without a word. */
    const pending = !!(addKind && state.companySetupDraftPolicy);
    foot=`<button class="btn" data-action="company-setup-back">Back</button>
      <button class="btn primary" data-action="company-setup-next" ${pending?'disabled':''}
        ${pending?`title="Save or discard the ${kindName(addKind).toLowerCase()} first"`:''}
        >${addedCount?'Review setup':'Continue without pricing'}</button>`;
  }

  if(state.companySetupStep===4){
    const companyPolicy=companyDefaultPolicy();
    const picked=setupKindPolicies(state.companySetupPolicyByKind);
    const readyCount=companyPolicy?selectedLocations.length:0;
    /* A Company with many Locations turned Review into a scroll of identical
       Shopify rows, pushing the confirm button off screen. Three is enough to
       show the shape; the rest is one click away. */
    const TERMS_PREVIEW=3;
    const termsShown=state.setupTermsExpanded?selectedLocations:selectedLocations.slice(0,TERMS_PREVIEW);
    const termsHidden=Math.max(0,selectedLocations.length-termsShown.length);

    body=`
      ${companySetupSteps()}
      <div class="review-block"><div class="review-head">Company and Locations</div>
        <div class="review-body"><dl class="kv">
          <dt>Company</dt><dd>${esc(source.name)}</dd>
          <dt>Locations</dt><dd>${selectedLocations.map(l=>esc(l.name)).join(', ')}</dd>
          <dt>Contacts of company</dt><dd>${source.contacts.filter(ct=>selectedLocations.some(l=>l.name===ct.location)).length}</dd>
          <dt>Main contact</dt><dd>${esc(mainContactOf(source)?.name||'None on this Company')}</dd>
        </dl></div></div>

      <div class="review-block"><div class="review-head">Pricing setup</div>
        <div class="review-body">
          ${picked.length
            /* Review confirms what was chosen, not how it calculates. The meta
               line repeated the type, the rule and the product scope — with
               "5 products · 5 selected products" saying the same thing twice —
               and the badge said All Locations on every row, which is what
               Company-level pricing means and never varies. The type is the
               one thing that differs per row, so it takes the badge. */
            ? picked.map(p=>`<div class="row" style="padding-left:0;padding-right:0">
                <div class="grow"><div class="row-title">${esc(p.name)}</div></div>
                <span class="badge info">${kindName(kindOf(p))}</span>
              </div>`).join('')
            : `<div class="row" style="padding-left:0;padding-right:0">
                <div class="grow"><div class="row-title">No pricing yet</div>
                  <div class="row-meta">Assign a profile from the Pricing page after setup</div></div>
                <span class="badge warning">Assign later</span>
              </div>`}
        </div></div>

      <div class="review-block"><div class="review-head">Ordering and payment terms</div>
        <div class="review-body">
          ${termsShown.map(location=>`
            <div class="row" style="padding-left:0;padding-right:0">
              <div class="grow"><div class="row-title">${esc(location.name)}</div>
                <div class="row-meta">${esc(location.ordering||'Buys directly')} · ${esc(location.terms)}</div></div>
            </div>`).join('')}
          ${termsHidden>0||state.setupTermsExpanded?`<button class="sub-toggle" data-action="toggle-setup-terms" style="margin-top:6px">
            <span>${state.setupTermsExpanded?'▾':'▸'}</span>
            ${state.setupTermsExpanded?'Show fewer Locations':`Show ${termsHidden} more Location${termsHidden===1?'':'s'}`}
            <span class="n">${selectedLocations.length} total</span>
          </button>`:''}
        </div></div>`;
    foot=`<button class="btn" data-action="company-setup-back">Back</button>
      <button class="btn primary" data-action="add-selected-shopify-company">${picked.length?'Add company and apply pricing':'Add company without pricing'}</button>`;
  }

  openModal('Set up Shopify company',body,foot);
}

function openDeleteAccount(kind, id){
  const item = companyById(id);
  if(!item) return;
  const assigned = companyPolicies(item).length;
  openModal(`Delete company`, `
    <div class="banner critical"><div><b>Delete “${esc(item.name)}”?</b>
      Its ${item.locations.length} Location${item.locations.length===1?'':'s'} and ${item.contacts.length} contact${item.contacts.length===1?'':'s'} stop being managed here${assigned?`, and ${assigned} assigned pricing profile${assigned===1?'':'s'} ${assigned===1?'is':'are'} unassigned from it`:''}. Its buyers can no longer order.</div></div>

/* BFS 4.2.4: an error in a toast disappears on a timer and sits nowhere near
   the field that caused it. Validation errors are held per field, rendered in
   red under that field, and cleared on the next save attempt so a fixed field
   stops complaining. */
const fieldError = key => state.errors?.[key] || '';
const errorLine = key => fieldError(key)
  ? `<div class="field-error" role="alert">${esc(fieldError(key))}</div>` : '';
const errorClass = key => fieldError(key) ? ' has-error' : '';
function setErrors(map){ state.errors = map; }
function clearErrors(){ state.errors = {}; }

const head = (title, sub, actions='') =>
  `<div class="page-head"><div><h1>${title}</h1><div class="page-sub">${sub}</div></div><div class="head-actions">${actions}</div></div>`;

/* ============================================================
   B2B COMPANIES
   The app lists Companies only. Individual customers were removed:
   this app does not own the Shopify customer record and cannot
   manage it, so a list of them promised something it could not
   deliver. Customer-level pricing is still assigned from Pricing.
   ============================================================ */
function renderCustomers(){
  if(!db.companies.length) return renderCustomersEmpty();

  const q=(state.companySearch||'').trim().toLowerCase();
  let list = db.companies;
  if(state.listFilter==='need') list = list.filter(companyNeedsPrice);
  if(state.listFilter==='active') list = list.filter(c=>companyStatus(c).label==='Price ready');
  if(q) list = list.filter(c=>[c.name, c.source, c.mainContact||'',
      ...c.locations.map(l=>l.name), ...companyPolicies(c).map(p=>p.name)]
    .join(' ').toLowerCase().includes(q));

  const by = {
    name:(a,b)=>a.name.localeCompare(b.name),
    locations:(a,b)=>a.locations.length-b.locations.length || a.name.localeCompare(b.name),
    status:(a,b)=>(companyNeedsPrice(a)?1:0)-(companyNeedsPrice(b)?1:0) || a.name.localeCompare(b.name)
  };
  list = [...list].sort(by[state.companySortField]||by.name);
  if(state.companySortDir==='desc') list.reverse();

  const open = state.companyTool||'';

  const body = list.length ? `<table>
    <thead><tr><th>Company</th><th>Pricing status</th><th>Locations</th><th>Pricing assigned</th><th>Main contact</th></tr></thead>
    <tbody>${list.map(c=>{
      const assigned = companyPolicies(c);
      /* One line, names only. The pricing type was printed under every name and
         the count beside it repeated what the names already showed, so a
         Company with two pricings stood three lines tall in a list meant for
         scanning. The type is on hover, and in full on the Company page. */
      return `<tr class="clickable" data-company="${c.id}">
        <td><div class="cell-main">${c.name}</div><div class="cell-sub">From ${c.source}</div></td>
        <td>${(()=>{const st=companyStatus(c);
          return `<span class="badge ${st.tone}" title="${esc(st.why)}">${st.label}</span>`;})()}</td>
        <td>${c.locations.length}</td>
        <td>${assigned.length
            ? `<span title="${esc(assigned.map(p=>`${kindName(kindOf(p))}: ${p.name}`).join(' \u00b7 '))}">${assigned.map(p=>esc(p.name)).join(', ')}</span>`
            : '<span class="dim">Not set</span>'}</td>
        <td>${esc(c.mainContact||'None')}</td></tr>`;
    }).join('')}</tbody></table>` : emptyFilter();

  return head('Companies', 'Who gets which price.',
      `<button class="btn primary" data-action="add-account">Add company</button>`) + `
    <div class="card">
      ${(()=>{
        const fields=[['name','Name','A to Z','Z to A'],
                      ['locations','Locations','Fewest first','Most first'],
                      ['status','Pricing status','Needs a price first','Price ready first']];
        const sort = o => o==='sort' ? sortMenu('data-company-sort-field','data-company-sort-dir',
          state.companySortField||'name', state.companySortDir||'asc', fields) : '';
        /* Sort phải đi theo vào hàng tìm kiếm, giống bên Pricing. Trước đây mở tìm
           kiếm là nút Sort biến mất, nên muốn sắp xếp một danh sách vừa lọc thì phải
           thoát tìm kiếm trước, và thoát ra là mất luôn từ khoá. */
        return open==='find'
          ? findHead(searchField('Search companies','data-company-search',state.companySearch), '',
              `<span class="tool-wrap">${listTools(open,['sort'])}${sort(open)}</span>`)
          : `<div class="card-head" style="border-bottom:0">
              <h2>Companies <span class="n">${list.length}</span></h2>
              <div class="right"><span class="tool-wrap">${listTools(open)}${sort(open)}</span></div>
            </div>`;
      })()}
      ${findFilterRow(companyFilterBar())}
      ${body}
    </div>`;
}
const emptyFilter = () => `<div class="empty"><div class="empty-title">No companies match</div>
  <p>Try a different search, or clear the pricing status filter.</p></div>`;

/* F-01: the boundary explanation lives here — once, when it is useful */
/* No header action here: the empty state has the one button, and two buttons
   for the same act, one of them tucked in a corner, is a choice that is not a
   choice. */
function renderCustomersEmpty(){
  return head('Companies','Who gets which price.','') + `
    <div class="card"><div class="empty">
      <div class="empty-title">No companies linked yet</div>
      <p>Link a Shopify B2B Company to decide what its buyers pay. Shopify keeps the Company record and takes the orders; this app only decides the price.</p>
      <div class="btns"><button class="btn primary" data-action="add-account">Link your first company</button></div>
    </div></div>`;
}

/* ============================================================
   COMPANY DETAIL
   ============================================================ */
/* Base pricing and Quantity pricing are DIFFERENT shapes — a Company holds a
   LIST of base pricings but a single quantity — so they live in two separate
   cards instead of one mixed table. The base overview is read-only: priority is
   edited inside a base's Edit (company-scoped), never on this screen. */
function companyBasePricingCard(c){
  const entries = companyBaseEntries(c);
  const PAGE_SIZES = [10,20,100];
  const showTools = entries.length > 10;
  const q = showTools ? (state.basePricingSearch||'').trim().toLowerCase() : '';
  const filtered = q ? entries.filter(e=>{ const p=policyById(e.id); return p && p.name.toLowerCase().includes(q); }) : entries;
  const size = PAGE_SIZES.includes(state.basePageSize) ? state.basePageSize : 10;
  const pageCount = Math.max(1, Math.ceil(filtered.length / size));
  const page = Math.min(Math.max(1, state.basePage||1), pageCount);
  const start = (page-1)*size;
  const pageEntries = filtered.slice(start, start+size);
  const rows = pageEntries.map(e=>{
    const p=policyById(e.id), st=policyStatus(p);
    return `<tr>
      <td><div class="cell-main">${esc(p.name)}</div></td>
      <td class="nowrap">${e.priority}</td>
      <td class="nowrap"><span class="badge ${st.tone}">${st.label}</span></td>
      <td class="num" style="white-space:nowrap">

/* Tags are typed, not browsed. The Discount section puts an Enter tags field

/* Self-contained: the old markup only looked right inside .pl-toolbar, where a
   parent rule positioned the icon and padded the input. Reused anywhere else,
   the icon fell above a full-width input. This one carries its own box, so it
   works wherever it is dropped. */
/* One toolbar shape for both lists: search on the left, sort on the right.
   Sorting is by what the columns actually show, so every option maps to
   something the merchant can see. */
/* The filter sits on the card in its own right, so this button is only search.
   It used to carry a filter mark too, from when the two opened together. */
function listTools(open, only){
  const b=(key,icon,label)=>`<button class="tool-btn ${open===key?'on':''}"
    data-list-tool="${key}" title="${label}" aria-label="${label}">${icon}</button>`;
  const want = k => !only || only.includes(k);
  return `<div class="tool-group">
    ${want('find')?b('find',ICON.search,'Search'):''}
    ${want('sort')?b('sort',ICON.sort,'Sort'):''}
  </div>`;
}
/* The search takes the place of the heading rather than opening a row beneath
   it. Leaving the title and the buttons sitting above an empty band was the
   list telling the merchant it had made room for something. */
/* Tìm và lọc là một việc: thu hẹp danh sách. Chúng ở chung một hàng thay vì hai dải
   riêng trên card. Vì một bộ lọc đang bật sẽ giữ hàng này mở, sort phải có mặt ở đây,
   nếu không bật lọc là mất luôn đường vào sort. */
function findHead(searchMarkup, filtersMarkup, toolsMarkup){
  return `<div class="card-head find-head">
    ${searchMarkup}
    ${filtersMarkup||''}
    ${toolsMarkup||''}
    <button class="btn small cancel" data-list-tool="">Cancel</button>
  </div>`;
}
function findFilterRow(filtersMarkup){
  return `<div class="find-filters">${filtersMarkup}</div>`;
}

/* Two states, three states with All: they fit on the card, so they are on the
   card. A popover to choose between two answers is a click spent on opening
   something, and it hid which answers even existed until it was opened. */
const PRICING_STATUS_FILTERS = [['all','All'],['active','Price ready'],['need','Needs a price']];
function companyFilterBar(){
  return `<div class="segmented">${PRICING_STATUS_FILTERS.map(o=>
    `<button class="segment ${state.listFilter===o[0]?'active':''}"
      data-company-filter="${o[0]}">${o[1]}</button>`).join('')}</div>`;
}
/* Hai bộ lọc, hai mức độ hiện diện. Phía phục vụ nằm thẳng trên card vì đó là câu
   hỏi người dùng mang sẵn khi mở màn này: pricing của Company và pricing của customer
   là hai tập không bao giờ gán chung chỗ. Loại pricing thì không: nó lùi vào sau một
   nút, mở ra mới thấy ba giá trị. Để cả hai thành hai dải segmented cạnh nhau thì cái
   thứ hai đọc như phần tiếp của cái thứ nhất, và bộ lọc ít dùng hơn lại chiếm đúng
   lượng chỗ như bộ lọc chính. */
function pricingAudienceBar(){
  const opts=[['','All'],['b2b','Companies'],['d2c','Customers']];
  return `<div class="segmented">${opts.map(o=>
    `<button class="segment ${state.pricingAudience===o[0]?'active':''}"
      data-pricing-audience="${o[0]}">${o[1]}</button>`).join('')}</div>`;
}
/* Nút mang luôn giá trị đang lọc, nên đóng menu lại vẫn đọc được đang lọc theo gì.
   Clear chỉ xuất hiện khi có cái để clear. Một hàm cho mọi bộ lọc dạng này, để cái
   thứ hai không kịp lệch khỏi cái thứ nhất. */
function filterButton({label, attr, value, options, open, toggleAction}){
  const cur = options.find(o=>o[0]===value);
  return `<span class="tool-wrap">
    <button class="filter-btn ${value?'on':''}" data-action="${toggleAction}">
      ${value?`${label}: ${cur?cur[1]:value}`:label}${ICON.chevronDown}
    </button>
    ${open?`<div class="sort-menu filter-menu">
      <div class="sort-menu-title">${label}</div>
      ${options.map(o=>`<label class="sort-row" ${attr}="${o[0]}">
        <input type="radio" name="${attr}" ${value===o[0]?'checked':''}>
        <span>${o[1]}</span></label>`).join('')}
      ${value?`<div class="sort-sep"></div>
      <label class="sort-row" ${attr}=""><span>Clear</span></label>`:''}
    </div>`:''}
  </span>`;
}
const pricingKindFilter = () => filterButton({label:'Pricing type', attr:'data-pricing-kind',
  value:state.pricingKind, options:KIND_ORDER.map(k=>[k,kindName(k)]),
  open:state.pricingKindMenu, toggleAction:'toggle-pricing-kind-menu'});
const pricingStatusFilter = () => filterButton({label:'Status', attr:'data-pricing-status',
  value:state.pricingStatus, options:POLICY_STATUSES.map(x=>[x,x]),
  open:state.pricingStatusMenu, toggleAction:'toggle-pricing-status-menu'});
const pricingFiltersOn = () => !!(state.pricingKind || state.pricingStatus);

/* Sort is a field and a direction, not one flat list of every combination.
   The menu hangs off its button so the list underneath does not move.

   Every field states its own two directions. "Low to high" on a name, or on a
   category such as a pricing type, is a direction the reader has to translate
   into something real; a field only earns a place here if it has a high and a
   low that mean something on the page, and the page has to be able to answer it
   for every row. Each entry is
   [key, label, what ascending means, what descending means].

   One field left means there is nothing to choose, so the radio list goes and the
   title carries the field name instead. A list of one option is a control that
   exists only to say it cannot be used. */
function sortMenu(fieldAttr, dirAttr, field, dir, fields){
  const cur = fields.find(f=>f[0]===field) || fields[0];
  const many = fields.length>1;
  return `<div class="sort-menu">
    <div class="sort-menu-title">${many?'Sort by':`Sort by ${cur[1].toLowerCase()}`}</div>
    ${many?`${fields.map(f=>`<label class="sort-row" ${fieldAttr}="${f[0]}">
      <input type="radio" name="sort-field" ${f[0]===field?'checked':''}>
      <span>${f[1]}</span></label>`).join('')}
    <div class="sort-sep"></div>`:''}
    <label class="sort-row" ${dirAttr}="asc"><span class="dir">${ICON.arrowUp}</span>
      <span>${cur[2]}</span>${dir==='asc'?`<span class="tick">${ICON.check}</span>`:''}</label>
    <label class="sort-row" ${dirAttr}="desc"><span class="dir">${ICON.arrowDown}</span>
      <span>${cur[3]}</span>${dir==='desc'?`<span class="tick">${ICON.check}</span>`:''}</label>
  </div>`;
}

function searchField(placeholder, attrs, value=''){
  return `<span class="search-field">${ICON.search}
    <input type="text" placeholder="${esc(placeholder)}" ${attrs} value="${esc(value||'')}">
  </span>`;
}
const kindPurpose = k => ({base:'What a product normally costs',
  quantity:'How the price changes with quantity'}[k]||'');

function orderTone(status){
  return (status==='Fulfilled'||status==='Paid') ? 'success'
    : status==='Needs review' ? 'warning'
    : status==='Blocked' ? 'critical' : 'neutral';
}

function renderCompany(){
  const c = companyById(state.selectedCompany);

        ? `<button class="btn small" data-action="clear-order-location-sort" title="Show all company orders">Location: ${esc(filterLoc.name)} ✕</button>`
        : `<span class="dim">Placed by this company's buyers</span>`}</div></div>
      ${rows.length?`<table><thead><tr><th>Order</th><th>Location</th><th>Buyer</th><th>Date</th>
        <th class="num">Total</th><th>Status</th></tr></thead><tbody>
      ${rows.map(o=>{
        const ln=(locationById(c,o.locationId)||{}).name||o.location||'—';
        return `<tr>
          <td><div class="cell-main">${esc(o.id)}</div>${o.po&&o.po!=='None'?`<div class="cell-sub">${esc(o.po)}</div>`:''}</td>
          <td>${esc(ln)}</td><td>${esc(o.buyer)}</td>
          <td class="nowrap">${esc(o.date)}</td>
          <td class="num">${money(o.amount)}</td>
          <td><span class="badge ${orderTone(o.status)}"><span class="dot"></span>${esc(o.status)}</span></td>
        </tr>`;}).join('')}
      </tbody></table>`
      :`<div class="empty"><div class="empty-title">${filterLoc?`No orders from ${esc(filterLoc.name)} yet`:'No orders yet'}</div>
          <p>${filterLoc?'Clear the location filter to see all company orders.':'Orders placed by company buyers will appear here.'}</p></div>`}
      </div>`;
  }

  else if(state.companyTab==='contacts'){
    body = `<div class="card"><div class="card-head"><h2>Contacts</h2>
      <div class="right"><span class="dim">Managed on the Shopify company record</span>
        <button class="btn small" data-action="demo">Open in Shopify</button></div></div>
      <table><thead><tr><th>Name</th><th>Shopify role</th><th>How they buy</th><th>Location</th></tr></thead><tbody>
      ${c.contacts.map(p=>`<tr><td><div class="cell-main">${p.name}</div><div class="cell-sub">${p.email}</div></td>
        <td>${p.role}</td><td>${p.access}</td><td>${esc(contactLocationName(c,p))}</td></tr>`).join('')}
      </tbody></table></div>`;
  }

  else if(state.companyTab==='pricing'){
    body = `
      ${companyBasePricingCard(c)}
      ${companyQuantityPricingCard(c)}`;
  }

  else if(state.companyTab==='analytics'){
    /* Company analytics is evidence-first: metrics, charts and breakdowns only.
       Interpretation is intentionally reserved for a separate AI insights layer. */
    const completedOrders = companyOrders.filter(o=>['Fulfilled','Paid'].includes(o.status));
    const sales = completedOrders.reduce((sum,o)=>sum+(Number(o.amount)||0),0);
    const avgOrder = completedOrders.length ? sales/completedOrders.length : 0;
    const sortedOrders = completedOrders.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
    const lastOrder = sortedOrders[sortedOrders.length-1] || null;
    const demoToday = new Date('2026-08-24T00:00:00');
    const days = (a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);
    const orderGaps = sortedOrders.slice(1).map((o,i)=>days(sortedOrders[i].date,o.date)).filter(n=>n>0);
    const sortedGaps = orderGaps.slice().sort((a,b)=>a-b);
    const typicalReorder = sortedGaps.length>=3 ? (sortedGaps.length%2 ? sortedGaps[(sortedGaps.length-1)/2] : Math.round((sortedGaps[sortedGaps.length/2-1]+sortedGaps[sortedGaps.length/2])/2)) : null;
    const daysSinceLast = lastOrder ? Math.round((demoToday-new Date(lastOrder.date+'T00:00:00'))/86400000) : null;
    const reorderDelay = typicalReorder!=null && daysSinceLast!=null ? Math.max(0,daysSinceLast-typicalReorder) : null;
    const repeatOrders = sortedOrders.slice(1);
    const repeatRevenue = repeatOrders.reduce((sum,o)=>sum+(Number(o.amount)||0),0);
    const repeatShare = sales ? Math.round((repeatRevenue/sales)*100) : 0;

    const monthMap = new Map();
    completedOrders.forEach(o=>{
      const d=new Date(o.date+'T00:00:00');
      const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      const label=new Intl.DateTimeFormat('en-US',{month:'short'}).format(d);
      const cur=monthMap.get(key)||{key,label,sales:0,orders:0};
      cur.sales += Number(o.amount)||0; cur.orders++; monthMap.set(key,cur);
    });
    let months=[...monthMap.values()].sort((a,b)=>a.key.localeCompare(b.key));
    if(!months.length) months=[{key:'none',label:'No data',sales:0,orders:0}];

    const lineChart=(items)=>{
      const W=680,H=220,PL=48,PR=16,PT=16,PB=32,innerH=H-PT-PB,innerW=W-PL-PR;
      /* Nice round axis top with headroom, so the peak never touches the top gridline. */
      const rawMax=Math.max(1,...items.map(x=>x.sales));
      const niceStep=r=>{const p=Math.pow(10,Math.floor(Math.log10(r)||0));const n=r/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;};
      const step=niceStep(rawMax/4);
      const top=Math.max(step,Math.ceil(rawMax/step)*step);
      const fmtAxis=v=>v>=1000?`$${(v/1000).toFixed(v%1000?1:0)}k`:`$${Math.round(v)}`;
      const x=i=>items.length===1?(PL+innerW/2):PL+i*(innerW/(items.length-1));
      const y=v=>PT+innerH*(1-v/top);
      const tickVals=[];for(let t=0;t<=top+1e-6;t+=step)tickVals.push(t);
      const ticks=tickVals.map(val=>{const yy=y(val);return `<line x1="${PL}" y1="${yy.toFixed(1)}" x2="${W-PR}" y2="${yy.toFixed(1)}" class="chart-grid-line"/><text x="${PL-10}" y="${(yy+4).toFixed(1)}" text-anchor="end" class="chart-axis-text">${val?fmtAxis(val):'$0'}</text>`}).join('');
      const pts=items.map((m,i)=>({x:x(i),y:y(m.sales),label:m.label,v:m.sales}));
      const path=pts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
      const slot=innerW/Math.max(1,items.length);
      /* Selective labels only — value shown on hover (crosshair + tooltip), not on
         every point. Same pure-CSS hover as the advanced chart. */
      const pointG=p=>{
        const above=p.y>64,th=39,bgY=above?-(th+10):14,ty0=bgY+16;
        return `<g class="cpoint"><rect class="cp-hit" x="${(p.x-slot/2).toFixed(1)}" y="${PT}" width="${slot.toFixed(1)}" height="${innerH}"/>`
          +`<line class="cp-guide" x1="${p.x.toFixed(1)}" y1="${PT}" x2="${p.x.toFixed(1)}" y2="${(PT+innerH).toFixed(1)}"/>`
          +`<circle class="dot" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4"/>`
          +`<g class="cp-tip" transform="translate(${p.x.toFixed(1)},${p.y.toFixed(1)})"><rect class="cp-tip-bg" x="-58" y="${bgY}" width="116" height="${th}" rx="7"/>`
            +`<text class="cp-tip-t" x="0" y="${ty0}" text-anchor="middle">${esc(p.label)}</text>`
            +`<text class="cp-tip-v" x="0" y="${ty0+15}" text-anchor="middle">${money(p.v)}</text></g>`
          +`<text x="${p.x.toFixed(1)}" y="${H-10}" text-anchor="middle" class="chart-axis-text">${esc(p.label)}</text></g>`;
      };
      return `<svg viewBox="0 0 ${W} ${H}" class="metric-line-chart shopify-line-chart" role="img" aria-label="Sales over time">
        ${ticks}
        <path class="series" fill="none" d="${path}"/>
        ${pts.map(pointG).join('')}
      </svg>`;
    };

    const locationRows=c.locations.map(l=>{
      const orders=completedOrders.filter(o=>o.locationId===l.id || o.location===l.name);
      const locSales=orders.reduce((sum,o)=>sum+(Number(o.amount)||0),0);
      const share=sales?Math.round((locSales/sales)*100):0;
      return {l,orders,locSales,share};
    }).sort((a,b)=>b.locSales-a.locSales);
    const activeLocations=locationRows.filter(x=>x.orders.length).length;

    const received=quotes.filter(q=>q.status!=='Trashed').length;
    const priced=quotes.filter(q=>q.status!=='Trashed' && (q.lines||[]).some(line=>line.quoted!=null)).length;
    const quoteOrders=quotes.filter(q=>q.status!=='Trashed' && (q.progress==='Draft Order Created' || q.status==='Deal Closed')).length;
    const quoteToOrder=received ? Math.round((quoteOrders/received)*100) : null;
    const openQuotes=quotes.filter(q=>['New Received','Read','Updated'].includes(q.status));
    const open=openQuotes.length;
    const oldestOpenAge=openQuotes.length ? Math.max(...openQuotes.map(q=>Math.max(0,Math.round((demoToday-new Date(String(q.created).slice(0,10)+'T00:00:00'))/86400000)))) : 0;
    const funnelMax=Math.max(1,received);
    const funnelRows=[['Requested',received],['Priced',priced],['Order created',quoteOrders]].map(([label,n])=>`<div class="funnel-row"><div class="funnel-label">${label}</div><div class="funnel-track"><div class="funnel-fill" style="width:${Math.round((n/funnelMax)*100)}%"></div></div><div class="funnel-count">${n}</div></div>`).join('');

    const establishedOrders=completedOrders.filter(o=>['direct checkout','reorder'].includes(String(o.source||'').toLowerCase()));
    const assistedOrders=completedOrders.filter(o=>String(o.source||'').toLowerCase()==='sales-assisted');
    const establishedRevenue=establishedOrders.reduce((sum,o)=>sum+(Number(o.amount)||0),0);
    const assistedRevenue=assistedOrders.reduce((sum,o)=>sum+(Number(o.amount)||0),0);
    const establishedShare=sales ? Math.round((establishedRevenue/sales)*100) : 0;
    const assistedShare=sales ? Math.round((assistedRevenue/sales)*100) : 0;

    const usageMap=new Map();
    completedOrders.forEach(o=>{
      const key=o.pricing && o.pricing!=='None' ? o.pricing : 'Shopify price';
      const cur=usageMap.get(key)||{name:key,source:o.pricingSource||'',orders:0,revenue:0};
      cur.orders++; cur.revenue+=Number(o.amount)||0; usageMap.set(key,cur);
    });
    const pricingUsage=[...usageMap.values()].sort((a,b)=>b.revenue-a.revenue);
    const maxPricingRevenue=Math.max(1,...pricingUsage.map(x=>x.revenue));

    const orderTimeline=sortedOrders.map((o,i)=>{
      const prev=i?sortedOrders[i-1]:null;
      return `<div class="order-event">
        <div class="order-gap">${prev?days(prev.date,o.date)+'d':''}</div>
        <div class="order-event-bar" style="height:${Math.max(28,Math.round((Number(o.amount)||0)/Math.max(1,...sortedOrders.map(x=>Number(x.amount)||0))*115))}px"></div>
        <div class="order-event-value">${money(o.amount)}</div>
        <div class="order-event-date">${new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric'}).format(new Date(o.date+'T00:00:00'))}</div>
      </div>`;
    }).join('');

    const analyticsSection = state.analyticsSection || 'performance';
    const analyticsViews = {
      performance: `<section class="analytics-pane evidence-pane">
        <div class="analytics-summary three">
          <div class="analytics-kpi"><div class="label">Sales</div><div class="value">${money(sales)}</div><div class="meta">Completed B2B orders</div></div>
          <div class="analytics-kpi"><div class="label">Orders</div><div class="value">${completedOrders.length}</div><div class="meta">Completed in selected period</div></div>
          <div class="analytics-kpi"><div class="label">Average order</div><div class="value">${money(avgOrder)}</div><div class="meta">Completed-order value</div></div>
        </div>
        <section class="analytics-card chart-card-wide">
          <div class="analytics-card-head"><div><h3>Sales over time</h3><p>Completed order value by month.</p></div><button class="btn small" data-ctab="orders">View orders</button></div>
          <div class="chart-body">${lineChart(months)}</div>
        </section>
        <section class="analytics-card">
          <div class="analytics-card-head"><div><h3>Sales by location</h3><p>Contribution to completed Company sales.</p></div><button class="btn small" data-ctab="locations">View locations</button></div>
          <div class="hbar-list">${locationRows.filter(x=>x.locSales>0).map(x=>`<div class="hbar-row"><div class="hbar-head"><span>${esc(x.l.name)}</span><span>${money(x.locSales)} · ${x.share}%</span></div><div class="hbar-track"><div class="hbar-fill" style="width:${x.share}%"></div></div></div>`).join('') || '<div class="overview-empty">No completed sales yet.</div>'}</div>
        </section>
      </section>`,

      ordering: `<section class="analytics-pane evidence-pane">
        <div class="analytics-summary three">
          <div class="analytics-kpi"><div class="label">Repeat revenue</div><div class="value">${repeatShare}%</div><div class="meta">${money(repeatRevenue)} from repeat orders</div></div>
          <div class="analytics-kpi"><div class="label">Typical reorder</div><div class="value">${typicalReorder!=null?typicalReorder+' days':'—'}</div><div class="meta">Shown after 3+ observed intervals</div></div>
          <div class="analytics-kpi"><div class="label">Since last order</div><div class="value">${daysSinceLast!=null?daysSinceLast+' days':'—'}</div><div class="meta">Most recent completed purchase</div></div>
        </div>
        <section class="analytics-card chart-card-wide">
          <div class="analytics-card-head"><div><h3>Order rhythm</h3><p>Each bar is a completed order. Labels between bars are days between purchases.</p></div><button class="btn small" data-ctab="orders">Order history</button></div>
          <div class="order-timeline">${orderTimeline || '<div class="overview-empty">Not enough order history.</div>'}</div>
        </section>
      </section>`,

      quotes: `<section class="analytics-pane evidence-pane">
        <div class="analytics-summary three">
          <div class="analytics-kpi"><div class="label">RFQs</div><div class="value">${received}</div><div class="meta">Received in account history</div></div>
          <div class="analytics-kpi"><div class="label">RFQ → order</div><div class="value">${quoteToOrder===null?'—':quoteToOrder+'%'}</div><div class="meta">${quoteOrders} of ${received} created an order</div></div>
          <div class="analytics-kpi"><div class="label">Open RFQs</div><div class="value">${open}</div><div class="meta">${open?`Oldest open ${oldestOpenAge} days`:'None currently open'}</div></div>
        </div>
        <div class="analytics-two">
          <section class="analytics-card">
            <div class="analytics-card-head"><div><h3>RFQ funnel</h3><p>Counts at each observable stage.</p></div><button class="btn small" data-ctab="quotes">View quotes</button></div>
            <div class="funnel large">${funnelRows}</div>
            <div class="evidence-strip"><b>Evidence:</b> ${received} requested → ${priced} priced → ${quoteOrders} order created.</div>
          </section>
          <section class="analytics-card">
            <div class="analytics-card-head"><div><h3>Buying motion</h3><p>Completed revenue by how the order was created.</p></div></div>
            <div class="motion-card">
              <div class="motion-big"><div><div class="value">${establishedShare}%</div><div class="label">Established / direct</div></div><div style="text-align:right"><div class="value" style="font-size:20px">${assistedShare}%</div><div class="label">Sales-assisted</div></div></div>
              <div class="motion-stack"><div class="motion-established" style="width:${establishedShare}%"></div><div class="motion-assisted" style="width:${assistedShare}%"></div></div>
              <div class="motion-money"><span>${money(establishedRevenue)}</span><span>${money(assistedRevenue)}</span></div>
            </div>
          </section>
        </div>
      </section>`,

      pricing: `<section class="analytics-pane evidence-pane">
        <div class="analytics-summary three">
          <div class="analytics-kpi"><div class="label">Pricing profiles used</div><div class="value">${pricingUsage.length}</div><div class="meta">On completed orders</div></div>
          <div class="analytics-kpi"><div class="label">Location-price revenue</div><div class="value">${sales?Math.round(completedOrders.filter(o=>o.pricingSource==='Location price').reduce((s,o)=>s+(Number(o.amount)||0),0)/sales*100):0}%</div><div class="meta">Share of completed sales</div></div>
          <div class="analytics-kpi"><div class="label">Active locations</div><div class="value">${activeLocations} / ${c.locations.length}</div><div class="meta">Placed a completed order</div></div>
        </div>
        <section class="analytics-card chart-card-wide">
          <div class="analytics-card-head"><div><h3>Revenue by pricing used</h3><p>This describes actual completed orders. Shopify price is valid if an order used it.</p></div><button class="btn small" data-ctab="pricing">Manage pricing</button></div>
          <div class="hbar-list pricing-bars">${pricingUsage.map(u=>{const share=sales?Math.round(u.revenue/sales*100):0;return `<div class="hbar-row"><div class="hbar-head"><span><b>${esc(u.name)}</b><small>${esc(u.source||'')}</small></span><span>${money(u.revenue)} · ${share}% · ${u.orders} order${u.orders===1?'':'s'}</span></div><div class="hbar-track"><div class="hbar-fill" style="width:${Math.round(u.revenue/maxPricingRevenue*100)}%"></div></div></div>`}).join('') || '<div class="overview-empty">No pricing usage data.</div>'}</div>
        </section>
      </section>`
    };

    body=`<div class="company-analytics">
      <div class="analytics-toolbar">
        <div class="analytics-toolbar-copy"><b>${esc(c.name)}</b> · Company analytics</div>
        <div class="analytics-toolbar-right">
          <div class="analytics-period">Last 90 days ▾</div>
          <button class="btn primary" data-action="open-app-analytics" data-company-id="${c.id}">View advanced analytics</button>
        </div>
      </div>
      <nav class="analytics-model-nav embedded" aria-label="Analytics sections">
        <button class="${analyticsSection==='performance'?'active':''}" data-anav="performance">Performance</button>
        <button class="${analyticsSection==='ordering'?'active':''}" data-anav="ordering">Ordering</button>
        <button class="${analyticsSection==='quotes'?'active':''}" data-anav="quotes">Quotes</button>
        <button class="${analyticsSection==='pricing'?'active':''}" data-anav="pricing">Pricing</button>
      </nav>
      ${analyticsViews[analyticsSection] || analyticsViews.performance}
    </div>`;
  }

  return head(c.name, `${companyStatus(c).label} · ${c.locations.length} location${c.locations.length>1?'s':''}`,
      `<button class="btn" data-view="customers">Back</button>
       <button class="btn critical" data-action="delete-company" data-delete-id="${c.id}">Delete</button>`) + `
    <div class="card" style="margin-bottom:16px">
      <div class="tabs" style="overflow-x:auto">${tabs.map(t=>`<button class="tab ${state.companyTab===t[0]?'active':''}" data-ctab="${t[0]}">${t[1]}</button>`).join('')}</div>
    </div>
    ${body}`;
}

/* ============================================================
   LOCATION DETAIL — full page resource (companies/:id/locations/:id).
   Modal/drawer chỉ dùng cho interaction nhỏ (add/edit form, assign buyer).
   ============================================================ */
function renderLocation(){
  const c = companyById(state.selectedCompany);
  const l = c && locationById(c, state.selectedLocation);
  if(!c || !l){ state.view='company'; return renderCompany(); }
  const ep = effectivePricing(c, l);
  const buyers = locationBuyers(c, l);
  const locOrders = (c.orders||[]).filter(o=>o.locationId===l.id)
    .slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const recentOrders = locOrders.slice(0,5);
  const skv = rows => rows.map(([k,v]) =>
    `<div class="summary-item" style="padding:5px 0"><span>${k}</span><b>${v}</b></div>`).join('');

  /* General + Shipping đều edit qua modal (openGeneralForm / openShippingForm);
     các control một-lựa-chọn ở Commerce settings là live (data-loc-live). */
  const ship = l.shipping || {};
  // Country luôn có sẵn nên không tính vào việc "đã có địa chỉ hay chưa".
  const shipName = [ship.firstName, ship.lastName].map(x=>String(x||'').trim()).filter(Boolean).join(' ');
  const shipCore = [shipName, ship.company, ship.address1, ship.address2, ship.city, ship.postal].map(x=>String(x||'').trim()).filter(Boolean);
  const shipParts = shipCore.length ? [...shipCore, SHIP_COUNTRY_NAMES[ship.country]||''].filter(Boolean) : [];
  const shipPreview = shipParts.length ? shipParts.map(esc).join('<br>') : '<span class="dim">No shipping address provided.</span>';
  const sideCtrl = (label, control) => `<div style="margin-bottom:12px"><div class="dim" style="font-size:12px;margin-bottom:4px">${label}</div>${control}</div>`;

  const totalSales = locOrders.reduce((s,o)=>s+(o.amount||0),0);
  const locQuotes = db.quotes.filter(qq=>qq.company===c.id && qq.location===l.name)
    .slice().sort((a,b)=>String(b.created).localeCompare(String(a.created)));

  /* ── LEFT: overview → buyers → pricing → quotes → order history (activity) ── */
  const overviewCard = `<div class="card"><div class="card-head"><h2>Location overview</h2></div>
    <div class="stats" style="grid-template-columns:repeat(3,1fr);border:0;border-radius:0">
      <div class="stat"><div class="stat-label">Sales</div><div class="stat-value">${money(totalSales)}</div><div class="stat-note">All-time from this location</div></div>
      <div class="stat"><div class="stat-label">Orders</div><div class="stat-value">${locOrders.length}</div><div class="stat-note">Placed by its buyers</div></div>
      <div class="stat"><div class="stat-label">Quotes</div><div class="stat-value">${locQuotes.length}</div><div class="stat-note">RFQ requests from this location</div></div>
    </div></div>`;

  const buyersCard = `<div class="card"><div class="card-head"><h2>Buyers${buyers.length?` <span class="n">${buyers.length}</span>`:''}</h2>
      <div class="right"><button class="btn small primary" data-action="assign-buyer" data-location-id="${l.id}">Assign buyer</button></div></div>
    ${buyers.length ? `<table><thead><tr><th>Name</th><th>Role</th><th class="num"></th></tr></thead><tbody>
      ${buyers.map(b=>`<tr>
        <td><div class="cell-main">${esc(b.name)}</div><div class="cell-sub">${esc(b.email)}</div></td>
        <td>${esc(b.role||'Ordering only')}</td>
        <td class="num"><button class="btn small" data-action="unassign-buyer" data-buyer-email="${esc(b.email)}">Remove</button></td>
      </tr>`).join('')}
      </tbody></table>`
    : `<div class="empty"><div class="empty-title">No buyers assigned</div>
        <p>Assign a buyer so someone can purchase under this location.</p></div>`}
  </div>`;

  /* Location không còn giữ pricing riêng — card Pricing chỉ hiển thị, mọi kind
     inherit từ Company (quản lý ở trang Company). Không nút assign/swap/override. */
  const pricingCard = `<div class="card"><div class="card-head"><h2>Pricing</h2>
      <div class="right"><span class="dim">Inherited from the company · manage on the Company</span></div></div>
    <table><thead><tr><th>Pricing type</th><th>Pricing</th><th>Products</th><th>Status</th></tr></thead><tbody>
    ${(()=>{
      let rows='';
      const baseEntries = ep.entries.filter(e=>e.kind==='base');
      if(baseEntries.length){
        baseEntries.forEach((e,i)=>{
          const p=e.policy, first=i===0;
          rows += `<tr>
            <td title="${esc(KIND_TOOLTIP.base||'')}"><div class="cell-main">${kindName('base')}</div>${first?`<div class="cell-sub">${kindPurpose('base')}</div>`:''}</td>
            <td><div class="cell-main">${esc(p.name)}</div><div class="cell-sub">Inherited from ${esc(c.name)}</div></td>
            <td class="nowrap">${scopeLabel(p)}</td>
            <td class="nowrap"><span class="badge ${policyStatus(p).tone}">${policyStatus(p).label}</span></td>
          </tr>`;
        });

/* ── Cross-app price: turn a Deal-Closed quote's agreed line prices into B2B
   pricing for its Company. The quote only prices a few products, so the result
   is a base SCOPED to exactly those SKUs (set-price product overrides); every
   other product falls through to the next base by priority. Destination is
   either a new scoped pricing, or merged into one of the company's existing
   base pricings (forking if that base is shared). ── */
function quoteToBasePricing(name, priority, overrides){
  let p = Math.round(Number(priority));
  if(!Number.isFinite(p)) p = 1;
  return {
    id:null, name, type:'Account-specific', status:'Active', audienceType:'b2b',
    priority:Math.max(0,Math.min(99,p)),
    priceKind:'base', scopeType:'products', collection:'', selectedProducts:Object.keys(overrides),
    pricingRule:'keep', valueType:'percentage', value:0,
    productAdjustments:overrides, explicitEnabled:true, conditionalRules:[],
    fallback:'fallback', validityType:'evergreen', startDate:'', endDate:''
  };
}
function quotePricedLines(q){ return (q.lines||[]).filter(l=>l.quoted!=null && productBySku(l.sku)); }
function openQuotePricingModal(quoteId){
  const q = quoteById(quoteId) || quoteById(state.selectedQuote);
  if(!q) return;
  if(!quoteIsClosed(q)) return toast('Only a Deal Closed quote can become pricing.');
  if(!companyById(q.company)) return toast('Link this quote to a B2B company before saving prices.');
  return openQuotePricingAssign(q.company, q.lines);
}
/* Open the REAL select/create-pricing modal (openAssign) seeded with the quoted
   prices: pick an existing base to add them to, or "Create a new base pricing"
   which opens the editor pre-filled. Same modal used everywhere else. */
function openQuotePricingAssign(companyId, lines){
  const co = companyById(companyId);
  if(!co) return toast('Company not found.');
  const priced = (lines||[]).filter(l=>l.quoted!=null && productBySku(l.sku));
  if(!priced.length) return toast('This quote has no priced lines with known products.');
  const overrides = {};
  priced.forEach(l=>{ overrides[l.sku]={rule:'set', valueType:'amount', value:Number(l.quoted)}; });
  state.view='company'; state.selectedCompany=companyId; state.companyTab='pricing';
  render();
  openAssign({companyId, targetType:'company', kind:'base', targetLocked:true, typeLocked:true,
    quoteOverrides:overrides, quoteLines:priced});
}
/* Company-level "Build pricing from closed quotes": gộp giá đã chốt của MỌI closed
   quote thành một base — mỗi SKU lấy giá ở quote MỚI NHẤT (sort created tăng dần →
   sau ghi đè trước), đánh dấu xung đột nếu cùng SKU có giá khác nhau giữa các quote.
   Mở modal review: sửa quoted / xóa dòng / xem nguồn, rồi lưu vào base chọn hoặc tạo mới. */
function openCompanyClosedQuotesPricing(companyId){
  const co = companyById(companyId); if(!co) return;
  /* Most recent CLOSED quote wins: sort theo thời điểm closed (updated, fallback created)
     tăng dần → quote closed gần nhất ghi đè. Không đánh dấu "conflict". */
  const closed = (db.quotes||[]).filter(q=>q.company===companyId && quoteIsClosed(q))
    .slice().sort((a,b)=>String(a.updated||a.created||'').localeCompare(String(b.updated||b.created||'')));
  const bySku = {};
  closed.forEach(q=>{ quotePricedLines(q).forEach(l=>{ bySku[l.sku]={sku:l.sku, quoted:Number(l.quoted), proposed:Number(l.quoted), from:q.id}; }); });
  const rows = Object.values(bySku);
  if(!rows.length) return toast('No closed quotes with priced lines for this company yet.');
  state.buildQuotes = { companyId, rows,
    dest:(companyBaseEntries(co)[0]?.id)||null,
    newName:`${co.name} · quote prices`, newPriority:1 };
  renderBuildFromQuotes();
}

function saveBuildFromQuotes(){

/* Seed the existing pricing EDITOR (builder) with a scoped base built from the
   quoted lines, bound to this company — so "Create new pricing" reuses the
   normal create-pricing model instead of a bespoke form. */
function startQuotePricingBuilder(companyId, lines){
  const co = companyById(companyId); if(!co) return;
  const overrides = {};
  lines.forEach(l=>{ overrides[l.sku]={rule:'set', valueType:'amount', value:Number(l.quoted)}; });
  const b = newBuilder(null);
  b.priceKind='base'; b.name=`${co.name} · quote prices`;
  b.scopeType='products'; b.selectedProducts=Object.keys(overrides);
  b.pricingRule='keep'; b.valueType='percentage'; b.value=0;
  b.productAdjustments=overrides; b.explicitEnabled=true;
  b.fallback='fallback'; b.type='Account-specific'; b.audienceType='b2b';
  state.builder=b;
  state.priceCreateContext={type:'assignment', assign:{targetType:'company', companyId, kind:'base'}};
  prefillAssignmentFromContext(b, state.priceCreateContext);
  state.editScopeCompanyId=companyId; state.editScopeLocationId=null;
  b._returnTo={view:'company', id:companyId};
  state.pricingBuilderTab='settings';
  state.openSections={1:true,2:true,3:false,4:false};
  state.view='company'; state.selectedCompany=companyId; state.companyTab='pricing';
  renderBuilder();
}

/* ============================================================
   QUOTES
   Quote là bản ghi app sở hữu: buyer hỏi giá, merchant trả lời, và câu trả lời
   có thể trở thành pricing. Nó thuộc về quan hệ với một Company nên nó sống trong
   Company page, không phải một section riêng ở sidebar.
   ============================================================ */
/* Vốn từ trạng thái lấy nguyên của app RFQ, kể cả thứ tự tab, để hai màn không mô tả
   cùng một quote bằng hai bộ chữ khác nhau. */
const QUOTE_STATUS = [
  ['New Received','q-new'],
  ['Read','q-read'],
  ['Updated','q-updated'],
  ['Deal Closed','q-closed'],
  ['Deal Rejected','q-rejected'],
  ['Trashed','q-trashed']
];
/* Tab của RFQ gộp Read và Updated làm một, nên tab ở đây cũng vậy. */
const QUOTE_TABS = [
  ['all','All',null],
  ['New Received','New received',['New Received']],
  ['Read','Read',['Read','Updated']],
  ['Deal Closed','Deal closed',['Deal Closed']],
  ['Deal Rejected','Deal rejected',['Deal Rejected']],
  ['Trashed','Trashed',['Trashed']]
];
const quoteInTab = (q,key) => {
  const t=QUOTE_TABS.find(x=>x[0]===key);
  return !t || !t[2] ? true : t[2].includes(q.status);
};
/* Deal Closed là trạng thái duy nhất có giá đã chốt để mang sang pricing. */
const quoteIsClosed = q => q.status==='Deal Closed';
const quoteById = id => db.quotes.find(q=>q.id===id) || null;
const quoteTone = st => (QUOTE_STATUS.find(x=>x[0]===st)||[,''])[1];
const quoteTotal = q => (q.lines||[]).reduce((n,l)=>{
  const p=productBySku(l.sku); if(!p) return n;
  return n + (l.quoted!=null ? l.quoted : p.list) * l.qty;
},0);
const quoteListPrice = q => (q.lines||[]).reduce((n,l)=>{
  const p=productBySku(l.sku); return p ? n + p.list*l.qty : n;
},0);
/* Giá quote so với giá Shopify: đây là con số merchant cân trước khi gửi, và là
   thứ duy nhất trên dòng không đọc được từ chỗ khác. */
function quoteDelta(q){
  const list=quoteListPrice(q), now=quoteTotal(q);
  if(!list || now===list) return null;
  return Math.round((now-list)/list*1000)/10;
}

/* Giá Company đang được hưởng cho một product, dùng để merchant thấy mình đang báo
   cao hay thấp hơn giá hiện tại của chính họ. */
function resolvedPriceFor(company, product){
  /* Bases in priority order (Active + in-date). A base only prices products in
     its scope, so a product outside a base's scope falls through to the next
     base. Then the quantity slot. First price wins. */
  for(const p of companyActiveBasePolicies(company)){
    if(!baseInScope(p, product.sku)) continue;
    const v=priceFor(p, product); if(v!=null) return v;
  }
  const q=companyPricing_quantity(company);
  if(q && q.status!=='Inactive'){ const v=priceFor(q, product); if(v!=null) return v; }
  return null;
}

/* One list, as before. The pricing type is a column, not a separate section —
   splitting the library into three tables made it harder to scan. What each
   profile is assigned to is counted from the assignments, never stored. */
function renderAnalytics(){
  const filterId = state.analyticsCompanyFilter || 'all';
  const locationFilter = state.analyticsLocationFilter || 'all';
  const periodDays = Number(state.analyticsPeriod || 90);
  const analyticsToday = new Date('2026-08-24T00:00:00');
  const analyticsNow = new Date('2026-08-24T16:43:00');
  const cutoff = periodDays===9999 ? null : new Date(analyticsToday.getTime()-periodDays*86400000);
  const inPeriod = d => !cutoff || (d && new Date(String(d).slice(0,10)+'T00:00:00') >= cutoff);
  const toDate = d => d ? new Date(String(d).slice(0,10)+'T00:00:00') : null;
  const dayMs = 86400000;
  const hasComparablePreviousPeriod = periodDays!==9999;
  const currentPeriodStart = cutoff;
  const currentPeriodEnd = analyticsToday;
  const previousPeriodEnd = hasComparablePreviousPeriod ? new Date(cutoff.getTime()-dayMs) : null;
  const previousPeriodStart = hasComparablePreviousPeriod ? new Date(previousPeriodEnd.getTime() - (periodDays-1)*dayMs) : null;
  const inDateRange = (d,start,end) => {
    const dt = toDate(d);
    return !!dt && (!start || dt >= start) && (!end || dt <= end);
  };
  const sumRevenueInRange = (rows,start,end) => rows.filter(o=>inDateRange(o.date,start,end)).reduce((a,o)=>a+(Number(o.amount)||0),0);
  const scopedCompanies = filterId==='all' ? db.companies.slice() : db.companies.filter(c=>c.id===filterId);
  const selected = filterId==='all' ? null : scopedCompanies[0] || null;
  const scopedIds = new Set(scopedCompanies.map(c=>c.id));
  const completedStatuses = new Set(['Fulfilled','Paid']);
  const comparisonMode = state.analyticsCompare || 'none';
  const compareEnabled = comparisonMode==='previous' && hasComparablePreviousPeriod;
  let allScopedOrders = scopedCompanies.flatMap(c=>(c.orders||[]).map(o=>({...o,companyId:c.id,companyName:c.name,items:analyticsOrderItems[o.id]||[]}))).filter(o=>completedStatuses.has(o.status));
  if(locationFilter!=='all') allScopedOrders=allScopedOrders.filter(o=>`${o.companyId}::${o.location}`===locationFilter);
  let orders = allScopedOrders.filter(o=>inPeriod(o.date));
  const previousOrders = compareEnabled ? allScopedOrders.filter(o=>inDateRange(o.date,previousPeriodStart,previousPeriodEnd)) : [];
  let quotes = (db.quotes||[]).filter(q=>scopedIds.has(q.company)&&inPeriod(q.created));
  if(locationFilter!=='all'){ const [,loc]=locationFilter.split('::'); quotes=quotes.filter(q=>q.location===loc); }
  const sales = orders.reduce((a,o)=>a+(Number(o.amount)||0),0);
  const orderCount = orders.length;
  const aov = orderCount?sales/orderCount:0;
  const activeCompanyIds = new Set(orders.map(o=>o.companyId));
  /* Repeat is a relationship fact, not an order-source label. Mark every completed
     order after a Company's first completed order as repeat, regardless of whether
     it came through direct checkout or sales assistance. */
  const repeatOrderKeys = new Set();
  scopedCompanies.forEach(c=>{
    const history=(c.orders||[]).filter(o=>completedStatuses.has(o.status)).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))||String(a.id).localeCompare(String(b.id)));
    history.slice(1).forEach(o=>repeatOrderKeys.add(`${c.id}::${o.id}`));
  });
  const isRepeatOrder = o => repeatOrderKeys.has(`${o.companyId}::${o.id}`);
  const repeatOrders = orders.filter(isRepeatOrder);
  const repeatRevenue = repeatOrders.reduce((a,o)=>a+(Number(o.amount)||0),0);
  const repeatShare = sales?Math.round(repeatRevenue/sales*100):0;
  const salesAssist = orders.filter(o=>String(o.source||'').toLowerCase()==='sales-assisted');
  const salesAssistRevenue = salesAssist.reduce((a,o)=>a+(Number(o.amount)||0),0);
  const directOrders = orders.filter(o=>String(o.source||'').toLowerCase()==='direct checkout');
  const directRevenue = directOrders.reduce((a,o)=>a+(Number(o.amount)||0),0);
  const received = quotes.length;
  const pricedQuotes = quotes.filter(q=>q.lines?.some(l=>l.quoted!=null)||['Email Sent','PDF Exported','Draft Order Created','Auto Confirmed'].includes(q.progress));
  const sentQuotes = quotes.filter(q=>['Email Sent','PDF Exported','Draft Order Created','Auto Confirmed'].includes(q.progress)||q.status==='Deal Closed');
  const orderQuotes = quotes.filter(q=>q.progress==='Draft Order Created'||q.progress==='Auto Confirmed'||q.status==='Deal Closed');
  const openQuotes = quotes.filter(q=>!['Deal Closed','Deal Rejected','Trashed'].includes(q.status));
  const quoteToOrder = received?Math.round(orderQuotes.length/received*100):0;
  const quoteValue = quotes.reduce((sum,q)=>sum+(q.lines||[]).reduce((s,l)=>s+(Number(l.quoted)||0)*(Number(l.qty)||0),0),0);
  const timelineDate = (label, fallbackYear=2026) => {
    const m=String(label||'').match(/([A-Z][a-z]{2})\s+(\d{1,2})/); if(!m) return null;
    const month={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11}[m[1]];
    return month==null?null:new Date(fallbackYear,month,Number(m[2]));
  };
  const responseDays = pricedQuotes.map(q=>{
    const created=String(q.created||'').slice(0,10); if(!created) return null;
    const first=(q.timeline||[]).find(e=>/quote sent|email sent|exported as pdf|priced/i.test(String(e.what||'')));
