  /* BFS 4.1.1 #10 — .dim marks real content ("Not assigned", "Not set"), so it

  .app-reset:hover{background:rgba(255,255,255,.1);color:var(--p-color-text-brand-on-bg-fill)}

  .top-actions{margin-left:auto;display:flex;align-items:center;gap:var(--p-space-200)}
  .top-btn{background:var(--p-color-bg-surface-inverse);border:1px solid var(--p-color-border-inverse);color:var(--p-color-border);border-radius:var(--p-border-radius-200);padding:var(--p-space-100) var(--p-space-200);

  .top-btn:hover{background:var(--p-color-bg-fill-inverse-hover,var(--p-color-border-inverse))}

    border-color:var(--p-color-bg-fill-brand)}
  .avatar{width:26px;height:26px;border-radius:50%;background:var(--p-color-border-inverse);color:var(--p-color-border);display:flex;
    align-items:center;justify-content:center;font-size:11px;font-weight:600}

  /* ---------- shell ---------- */
  /* ---------- Shopify admin frame: sidebar trái giả lập admin, app render bên phải ---------- */
  .admin-layout{display:grid;grid-template-columns:232px minmax(0,1fr);align-items:start}
  .admin-sidebar{
    position:sticky;top:52px;height:calc(100dvh - 52px);overflow-y:auto;

  .app-ic{width:18px;height:18px;border-radius:var(--p-border-radius-100);display:grid;place-items:center;font-size:8.5px;font-weight:800;flex:none}
  .app-title-bar{background:#f6f6f7;border-bottom:1px solid var(--p-color-border);padding:11px var(--p-space-400);display:flex;align-items:center;gap:var(--p-space-200);font-weight:700;font-size:14px;color:var(--p-color-text)}

  .shell{display:grid;grid-template-columns:minmax(0,1fr);align-items:start}

  .multi-list{border:1px solid var(--border);border-radius:var(--p-border-radius-200);max-height:216px;overflow-y:auto;background:var(--p-color-bg-surface)}

  .multi-head{display:flex;align-items:center;gap:var(--p-space-200);margin-bottom:var(--p-space-150)}

  .kind-pick-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--p-space-200);margin:var(--p-space-150) 0 var(--p-space-050)}
  .kind-pick{display:flex;flex-direction:column;align-items:flex-start;gap:var(--p-space-100);text-align:left;
    border:1px solid var(--border);border-radius:var(--p-border-radius-300);background:var(--p-color-bg-surface);
    padding:var(--p-space-300);cursor:pointer;color:var(--text-strong);line-height:1.3}
  .kind-pick:hover{border-color:var(--text-sub);background:var(--p-color-bg-fill-hover)}
  .kind-pick .k-head{display:flex;align-items:center;gap:var(--p-space-150);font-size:13px;

  .kind-pick .plus{color:var(--text-sub);font-size:13px}
  .kind-pick.taken{opacity:.4;cursor:default;background:var(--p-color-bg-fill-hover)}
  .kind-pick.taken:hover{border-color:var(--border);background:var(--p-color-bg-fill-hover)}
  .added-row{display:flex;align-items:center;gap:var(--p-space-200);padding:var(--p-space-200) var(--p-space-300);border:1px solid var(--border);
    border-radius:var(--p-border-radius-200);background:var(--p-color-bg-surface);margin-bottom:var(--p-space-200)}

  .pl-toolbar{display:flex;gap:var(--p-space-200);align-items:center;margin-bottom:var(--p-space-200)}

  .token.clickable{cursor:pointer}
  .token.clickable:hover{background:var(--p-color-bg-fill-secondary)}

  /* The search field runs the width of the row to Cancel, and the filters go
     on the line under it. The two rows read as one block: no divider between
     them, and the head gives up its bottom padding to the filter row. */
  .find-head{gap:var(--p-space-200);align-items:center;flex-wrap:wrap;

  .tool-wrap{position:relative;display:inline-flex}
  .filter-btn{display:inline-flex;align-items:center;gap:var(--p-space-100);
    border:0.0625rem solid var(--p-color-border);background:var(--p-color-bg-surface);

  /* Specific enough to beat input[type=text], which is declared later in the

  #app:has(.app-analytics){max-width:1600px}

  /* ---------- page head ---------- */

    line-height:var(--p-font-line-height-600);letter-spacing:var(--p-font-letter-spacing-dense);
    color:var(--text-strong)}
  .page-sub{color:var(--text-sub);margin-top:var(--p-space-100);font-size:13px}
  .head-actions{margin-left:auto;display:flex;gap:var(--p-space-200);flex-wrap:wrap}

  /* ---------- primitives ---------- */
  /* Polaris buttons carry a bevel shadow instead of a border, and the primary
     one is a dark fill with a subtle top-light gradient. */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--p-space-150);
    background:var(--p-color-bg-fill);border:none;border-radius:var(--p-border-radius-200);
    padding:var(--p-space-150) var(--p-space-300);min-height:var(--p-height-800);
    font-weight:var(--p-font-weight-medium);font-size:var(--p-font-size-325);color:var(--p-color-text);
    cursor:pointer;box-shadow:var(--p-shadow-button);white-space:nowrap}
  .btn:hover{background:var(--p-color-bg-fill-hover);box-shadow:var(--p-shadow-button-hover)}
  .btn:active{box-shadow:var(--p-shadow-button-inset)}
  .btn:focus-visible{outline:0.125rem solid var(--p-color-border-focus);outline-offset:0.0625rem}
  .btn.primary{background:var(--p-color-button-gradient-bg-fill),var(--p-color-bg-fill-brand);
    color:var(--p-color-text-brand-on-bg-fill);box-shadow:var(--p-shadow-button-primary)}
  .btn.primary:hover{background:var(--p-color-button-gradient-bg-fill),var(--p-color-bg-fill-brand-hover)}
  .btn.primary:active{box-shadow:var(--p-shadow-button-primary-inset)}
  .btn.small{padding:var(--p-space-100) var(--p-space-200);font-size:var(--p-font-size-300);min-height:1.5rem}
  .btn.icon{padding:var(--p-space-100);min-width:var(--p-height-800);display:inline-flex;align-items:center;
    justify-content:center;color:var(--p-color-icon-secondary)}
  .btn.icon:hover{color:var(--p-color-text)}
  .btn.icon.critical{color:var(--p-color-icon-secondary)}
  .btn.icon.critical:hover{color:var(--p-color-text-critical)}
  .btn.icon svg{display:block}
  .btn.critical{background:var(--p-color-bg-fill);color:var(--p-color-text-critical)}
  .btn:disabled{background:rgba(0,0,0,0.05);color:var(--p-color-text-disabled);
    box-shadow:none;cursor:not-allowed}
  .link{background:none;border:0;padding:0;color:var(--info);cursor:pointer;font-size:12px;font-weight:500;
    text-decoration:underline;text-underline-offset:2px}
  .link:hover{color:var(--p-color-text-info)}

  .card{background:var(--surface);border:none;border-radius:var(--radius);
    box-shadow:var(--p-shadow-100),var(--p-shadow-bevel-100);
    margin-bottom:var(--p-space-400);overflow:hidden}
  .card-head{display:flex;align-items:center;gap:var(--p-space-200);padding:var(--p-space-300) var(--p-space-300);border-bottom:1px solid var(--border);flex-wrap:wrap}
  .card-head h2{font-size:var(--p-font-size-350);font-weight:var(--p-font-weight-semibold);
    line-height:var(--p-font-line-height-500);color:var(--text-strong)}
  .card-head .right{margin-left:auto;display:flex;gap:var(--p-space-200);align-items:center;flex-wrap:wrap}
  .card-body{padding:var(--p-space-300)}
  .card.plain{box-shadow:none}

  .badge{display:inline-flex;align-items:center;gap:var(--p-space-100);
    border-radius:var(--p-border-radius-200);padding:var(--p-space-050,0.125rem) var(--p-space-200);
    font-size:var(--p-font-size-300);font-weight:var(--p-font-weight-medium);
    background:var(--p-color-bg-fill-transparent-secondary);color:var(--p-color-text-secondary);
    white-space:nowrap}
  .badge.success{background:var(--success-bg);color:var(--success)}
  .badge.warning{background:var(--warning-bg);color:var(--warning)}
  .badge.critical{background:var(--critical-bg);color:var(--critical)}
  .badge.info{background:var(--info-bg);color:var(--info)}
  /* Badge trạng thái quote lấy đúng hình dạng của app RFQ: một chấm màu trước chữ. */
  .badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;
    margin-right:var(--p-space-050);opacity:.75}
  .badge.q-new{background:var(--info-bg);color:var(--info)}
  .badge.q-read{background:var(--warning-bg);color:var(--warning)}
  .badge.q-updated{background:var(--warning-bg);color:var(--warning)}
  .badge.q-closed{background:var(--success-bg);color:var(--success)}
  .badge.q-rejected{background:var(--critical-bg);color:var(--critical)}
  .badge.q-trashed{background:var(--p-color-bg-fill-transparent-secondary);color:var(--p-color-text-secondary)}

  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:var(--p-font-size-300);font-weight:var(--p-font-weight-medium);
    color:var(--text-sub);padding:var(--p-space-200) var(--p-space-300);
    border-bottom:0.0625rem solid var(--p-color-border);background:var(--sunken)}
  /* Polaris-style dinh nghia cot: dotted underline + tooltip bubble khi hover.
     Bubble dat DUOI header vi .card overflow:hidden se cat bubble dat tren. */
  .th-hint{position:relative;border-bottom:1px dotted var(--text-sub,#8a8a8a);cursor:default}
  .th-hint::after{
    content:attr(data-tip);position:absolute;top:calc(100% + 8px);right:0;
    background:var(--p-color-bg-fill);color:var(--p-color-text);font-size:12px;font-weight:400;line-height:1.45;text-align:left;
    padding:var(--p-space-200) var(--p-space-300);border-radius:var(--p-border-radius-200);width:max-content;max-width:230px;white-space:normal;
    box-shadow:0 4px 12px rgba(26,26,26,.22),0 0 0 1px rgba(0,0,0,.06);
    opacity:0;pointer-events:none;transition:opacity .12s ease .05s;z-index:60}
  .th-hint:hover::after{opacity:1}
  td{padding:var(--p-space-300);border-bottom:0.0625rem solid var(--p-color-border-secondary);
    vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tr.clickable{cursor:pointer}
  tr.clickable:hover td{background:var(--sunken)}
  .num{text-align:right}
  .cell-main{font-weight:500;color:var(--text-strong)}
  .cell-sub{font-size:12px;color:var(--text-dim);margin-top:var(--p-space-025)}

  .segmented{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--p-border-radius-200);overflow:hidden;background:var(--p-color-bg-surface)}
  .segment{background:var(--p-color-bg-surface);border:0;border-right:1px solid var(--border-strong);padding:var(--p-space-100) var(--p-space-200);
    cursor:pointer;font-size:12px;display:flex;align-items:center;gap:var(--p-space-100)}
  .segment:last-child{border-right:0}
  .segment:hover{background:var(--p-color-bg-surface-hover)}
  .segment.active{background:var(--p-color-bg-surface-inverse);color:var(--p-color-bg-surface)}
  .segment .n{font-family:var(--mono);font-size:11px;background:var(--p-color-border-secondary);border-radius:var(--p-border-radius-200);padding:0 var(--p-space-100);color:var(--text-sub)}
  .segment.active .n{background:rgba(255,255,255,.22);color:var(--p-color-bg-surface)}

  /* Pricing-rules entry UI — typed rows, add-rule menu, multi-value chips */
  .add-rule-menu{position:absolute;top:100%;right:0;margin-top:var(--p-space-100);z-index:20;min-width:190px;
    background:var(--p-color-bg-surface);border:1px solid var(--border-strong);border-radius:10px;
    box-shadow:0 8px 24px rgba(0,0,0,.14);padding:var(--p-space-100);display:flex;flex-direction:column}
  .add-rule-menu button{background:none;border:0;text-align:left;padding:var(--p-space-200) 10px;border-radius:7px;
    font-size:13px;color:var(--text-strong);cursor:pointer;display:flex;align-items:center;gap:var(--p-space-200)}
  .add-rule-menu button:hover{background:var(--p-color-bg-surface-hover)}
  .add-rule-menu button:disabled{color:var(--text-sub);cursor:default;opacity:.55}
  .add-rule-menu button:disabled:hover{background:none}
  .add-rule-menu .menu-added{margin-left:auto;font-size:11px;color:var(--text-sub)}
  .add-rule-menu .menu-sep{height:1px;background:var(--border);margin:var(--p-space-100) var(--p-space-150)}
  /* Nút "+ Add rule" nằm ở đáy card, nên menu phải mở LÊN TRÊN để không bị tràn ra ngoài. */
  .add-rule-wrap{position:relative;display:inline-block}
  .add-rule-menu.up{top:auto;bottom:100%;left:0;right:auto;margin-top:0;margin-bottom:var(--p-space-100)}
  .add-rule-bar{display:flex;justify-content:flex-start;margin-top:var(--p-space-300)}
  .add-rule-empty{margin-top:14px;text-align:center}
  .rule-row .cell-main{font-size:13px;font-weight:var(--p-font-weight-semibold);color:var(--text-strong)}
  .rule-row .cell-sub{font-size:12px;color:var(--text-sub);margin-top:var(--p-space-025);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .loc-block.editing{border-color:var(--border-strong);box-shadow:0 0 0 3px var(--sunken)}
  /* Reorderable Pricing rules — drag the handle (Shopify Polaris pattern). */
  .drag-handle{display:inline-flex;align-items:center;justify-content:center;flex:none;
    color:var(--p-color-icon-secondary,#8a8a8a);cursor:grab;border-radius:var(--p-border-radius-150);padding:var(--p-space-050);touch-action:none}
  .drag-handle:hover{color:var(--p-color-text,#303030);background:var(--sunken)}
  .drag-handle:active{cursor:grabbing}
  .drag-handle svg{pointer-events:none}
  .rule-drag-row{transition:box-shadow .12s ease,opacity .12s ease}
  .rule-drag-row.dragging{opacity:.45}
  .rule-drag-row.drop-target{box-shadow:inset 0 2px 0 0 var(--p-color-bg-fill-emphasis),0 0 0 1px var(--p-color-bg-fill-emphasis)}
  .cond-line{display:flex;gap:var(--p-space-200);align-items:flex-start;margin-bottom:var(--p-space-200);flex-wrap:wrap}
  .cond-line .op{font-family:var(--mono);font-size:12px;color:var(--text-sub);flex:none;padding-top:7px}
  .chip-wrap{display:flex;flex-wrap:wrap;gap:var(--p-space-150);align-items:center;flex:1;min-width:160px}
  .chip{display:inline-flex;align-items:center;gap:5px;background:var(--sunken);border:1px solid var(--border);
    border-radius:var(--p-border-radius-500);padding:var(--p-space-050) 5px var(--p-space-050) 10px;font-size:12px;color:var(--text-strong)}
  .chip-x{background:none;border:0;cursor:pointer;color:var(--text-sub);font-size:15px;line-height:1;
    width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0}
  .chip-x:hover{background:var(--p-color-border-secondary);color:var(--text-strong)}
  .chip-add{flex:0 0 auto;min-width:130px;font-size:12px;padding:var(--p-space-100) var(--p-space-150)}
  .rule-mono{font-family:var(--mono);font-size:11px;color:var(--text-sub);letter-spacing:.06em}
  .editor-footer{display:flex;align-items:center;justify-content:space-between;gap:var(--p-space-200);margin-top:var(--p-space-400);
    padding-top:var(--p-space-300);border-top:1px solid var(--border)}
  .field-suffix{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--text-sub)}
  /* Price fields carry a $/% suffix — drop the native number spinner so its arrows don't collide with the symbol. */
  input[type=number]:has(+ .field-suffix){-moz-appearance:textfield;appearance:textfield}
  input[type=number]:has(+ .field-suffix)::-webkit-outer-spin-button,
  input[type=number]:has(+ .field-suffix)::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .rule-edit-head{display:flex;align-items:center;gap:var(--p-space-200);margin-bottom:14px}
  .rule-type-tag{font-size:13px;font-weight:var(--p-font-weight-semibold);color:var(--text-strong);
    background:var(--sunken);border:1px solid var(--border);border-radius:7px;padding:3px 10px}
  .rule-edit-head .hint{margin:0;flex:1}
  .rule-edit .form-field > label{display:block;font-size:12px;color:var(--text-sub);margin-bottom:var(--p-space-150);font-weight:var(--p-font-weight-medium)}
  .chip-field{display:flex;flex-wrap:wrap;gap:var(--p-space-150);align-items:center;border:1px solid var(--border-strong);
    border-radius:var(--p-border-radius-200);padding:7px var(--p-space-200);background:var(--p-color-bg-surface);min-height:38px}
  .chip-field .chip-add{border:0;background:none;min-width:150px;flex:1;padding:var(--p-space-050) var(--p-space-100);font-size:12.5px;color:var(--text-sub);cursor:pointer}
  .chip-field .chip-add:focus{outline:none}
  .price-row{display:flex;gap:10px;align-items:center}
  .price-row > select{flex:0 0 168px}

  .tabs{display:flex;gap:0;border-bottom:1px solid var(--border);padding:0 var(--p-space-300);background:var(--surface)}
  .tab{background:none;border:0;border-bottom:2px solid transparent;padding:var(--p-space-200) var(--p-space-300);cursor:pointer;
    color:var(--text-sub);font-size:13px;display:flex;align-items:center;gap:var(--p-space-150);margin-bottom:-1px}
  .tab:hover{color:var(--text-strong)}
  .tab.active{color:var(--text-strong);font-weight:600;border-bottom-color:var(--p-color-bg-surface-inverse)}
  .tab .n{font-family:var(--mono);font-size:11px;background:var(--p-color-border-secondary);border-radius:var(--p-border-radius-200);padding:0 var(--p-space-100);
    color:var(--text-sub);font-weight:500}
  .tab.active .n{background:var(--success-bg);color:var(--success)}

  .form-field{margin-bottom:var(--p-space-300)}
  /* Direct child only. This rule was hitting every label nested inside a
     field, so each row of a picker (they are labels, to make the whole row
     clickable) turned into display:block and stacked its checkbox above its
     own text. */
  .form-field > label{display:block;font-size:12px;font-weight:500;margin-bottom:var(--p-space-100)}
  input[type=text],input[type=number],input[type=date],select{
    width:100%;border:0.0625rem solid var(--p-color-input-border);border-top-color:var(--p-color-input-border-top);
    border-radius:var(--p-border-radius-200);padding:var(--p-space-150) var(--p-space-300);
    min-height:2rem;background:var(--p-color-input-bg-surface)}
  input:focus,select:focus{outline:0.125rem solid var(--p-color-border-focus);outline-offset:0.0625rem;
    border-color:var(--p-color-input-border-active)}
  select:disabled,input:disabled{background:rgba(0,0,0,0.05);color:var(--p-color-text-disabled);border-color:transparent}
  .hint{font-size:12px;color:var(--text-sub);margin-top:var(--p-space-100)}
  /* BFS 4.2.4 — errors are red, sit under their field, and stay put. */
  .picker-field{display:flex;align-items:center;gap:var(--p-space-150);width:100%;text-align:left;cursor:pointer;
    border:0.0625rem solid var(--p-color-input-border);border-top-color:var(--p-color-input-border-top);
    border-radius:var(--p-border-radius-200);padding:var(--p-space-150) var(--p-space-300);min-height:2rem;
    background:var(--p-color-input-bg-surface);color:var(--p-color-text-secondary);font:inherit}
  .picker-field:hover{border-color:var(--p-color-input-border-active)}
  .picker-field > svg{flex:none;color:var(--p-color-icon-secondary)}
  .tag-field{margin-top:var(--p-space-150);width:100%}
  .tag-tokens{display:flex;flex-wrap:wrap;gap:var(--p-space-100);margin-bottom:var(--p-space-150)}
  .tag-tokens .token{display:inline-flex;align-items:center;gap:var(--p-space-050);padding-right:var(--p-space-050)}
  .token-x{border:0;background:transparent;cursor:pointer;color:var(--p-color-text-secondary);
    display:inline-flex;align-items:center;justify-content:center;padding:0;
    width:20px;height:20px;border-radius:var(--p-border-radius-100)}
  .token-x:hover{color:var(--p-color-text)}
  .field-error{display:flex;gap:var(--p-space-150);align-items:flex-start;font-size:12px;
    color:var(--p-color-text-critical);margin-top:var(--p-space-100)}
  .field-error::before{content:'⚠';font-size:12px;line-height:16px}
  .form-field.has-error input,.form-field.has-error select{border-color:var(--p-color-text-critical)}
  .form-field.has-error > label{color:var(--p-color-text-critical)}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:var(--p-space-300)}
  /* Location detail: main (trái) + sidebar cố định (phải) — kiểu detail page Shopify. */
  .loc-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:var(--p-space-400);align-items:start}
  .loc-col{display:flex;flex-direction:column;gap:var(--p-space-400)}
  .loc-col>*{margin-bottom:0}
  .loc-sub{font-size:12px;font-weight:600;color:var(--text-sub);text-transform:uppercase;letter-spacing:.04em;margin:0 0 var(--p-space-200)}
  .loc-hr{height:1px;background:var(--border);margin:14px 0}
  @media(max-width:900px){.loc-layout{grid-template-columns:1fr}}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--p-space-300)}

  .banner{display:flex;gap:var(--p-space-200);border-radius:var(--p-border-radius-200);padding:var(--p-space-200) var(--p-space-300);margin-bottom:var(--p-space-300);font-size:12px;line-height:1.5}
  .banner b{display:block;margin-bottom:var(--p-space-050)}
  .banner.info{background:var(--p-color-bg-surface-info);color:var(--p-color-text-info)}
  .banner.warning{background:var(--p-color-bg-surface-warning);color:var(--p-color-text-warning)}
  .banner.critical{background:var(--p-color-bg-surface-critical);color:var(--p-color-text-critical)}
  .banner.success{background:var(--p-color-bg-surface-success);color:var(--p-color-text-success)}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:var(--p-space-400);overflow:hidden}
  .stat{padding:var(--p-space-300);border-right:1px solid var(--border)}
  .stat:last-child{border-right:0}
  .stat-label{font-size:12px;color:var(--text-sub)}
  .stat-value{font-size:24px;font-weight:600;color:var(--text-strong);margin:var(--p-space-100) 0 var(--p-space-050);letter-spacing:-.02em}
  .stat-value.hot{color:var(--critical)}
  .stat-note{font-size:11px;color:var(--text-dim)}
  .stat-split{font-size:11px;color:var(--text-dim);font-family:var(--mono)}

  .row{display:flex;align-items:center;gap:var(--p-space-300);padding:var(--p-space-200) var(--p-space-300);border-bottom:1px solid var(--border)}
  .row:last-child{border-bottom:0}
  .row .grow{flex:1;min-width:0}
  .row-title{font-weight:500;color:var(--text-strong)}
  .row-meta{font-size:12px;color:var(--text-dim);margin-top:var(--p-space-025)}
  .sev-dot{width:7px;height:7px;border-radius:50%;flex:none}
  .sev-dot.blocking{background:var(--critical)}
  .sev-dot.soon{background:var(--warning)}
  .sev-dot.idea{background:var(--p-color-border-magic)}

  .empty{padding:var(--p-space-1200) var(--p-space-500);text-align:center}
  .empty-title{font-size:14px;font-weight:600;color:var(--text-strong);margin-bottom:var(--p-space-100)}
  .help-foot{text-align:center;font-size:12px;color:var(--text-sub);margin:var(--p-space-500) 0 var(--p-space-200)}
  .help-foot a{color:var(--p-color-text-link);text-decoration:none}
  .help-foot a:hover{text-decoration:underline}
  a.btn{display:inline-flex;align-items:center;text-decoration:none}
  .empty p{color:var(--text-sub);max-width:44ch;margin:0 auto var(--p-space-400);line-height:1.55}
  .empty .btns{display:flex;gap:var(--p-space-200);justify-content:center}

  .kv{display:grid;grid-template-columns:auto 1fr;gap:var(--p-space-150) var(--p-space-400);font-size:12px}
  .kv dt{color:var(--text-sub)}
  .kv dd{color:var(--text-strong);text-align:right}

  /* ---------- price control (F-04) ---------- */
  .price-control{display:flex;gap:var(--p-space-200);align-items:flex-end}
  .price-control .rule{flex:1.5;min-width:120px}
  .price-control .val{flex:1;min-width:80px}
  .price-control .unit{flex:.55;min-width:64px}
  .preview{background:var(--sunken);border:1px solid var(--border);border-radius:var(--p-border-radius-200);padding:var(--p-space-200) var(--p-space-300);margin-top:var(--p-space-200)}
  .preview-cap{font-size:11px;color:var(--text-sub);text-transform:uppercase;letter-spacing:.05em;margin-bottom:var(--p-space-100)}
  .preview-price{font-size:16px;font-weight:600;color:var(--text-strong);display:flex;align-items:baseline;gap:var(--p-space-200)}
  .preview-price .was{text-decoration:line-through;color:var(--text-dim);font-weight:400;font-size:14px}
  .preview-price .now{color:var(--success)}
  .preview-price .delta{font-size:12px;color:var(--text-sub);font-family:var(--mono);margin-left:auto}

  /* ---------- collapsible section (F-05) ---------- */
  .section{border:1px solid var(--border);border-radius:var(--radius);background:var(--p-color-bg-surface);margin-bottom:var(--p-space-200);overflow:hidden}
  .section-head{display:flex;align-items:center;gap:var(--p-space-200);padding:var(--p-space-300) var(--p-space-300);cursor:pointer;background:var(--p-color-bg-surface);
    width:100%;border:0;text-align:left}
  .section-head:hover{background:var(--sunken)}
  .section.open .section-head{border-bottom:1px solid var(--border);background:var(--sunken)}
  .step-no{width:19px;height:19px;border-radius:50%;background:var(--p-color-bg-surface-inverse);color:var(--p-color-bg-surface);font-size:11px;
    display:flex;align-items:center;justify-content:center;flex:none;font-weight:600}
  .section:not(.open) .step-no{background:var(--p-color-bg-surface);color:var(--text-sub);border:1px solid var(--border-strong)}
  .section-title{font-weight:600;color:var(--text-strong);font-size:13px}
  .section-desc{font-size:12px;color:var(--text-sub);margin-top:var(--p-space-025)}
  .chev{margin-left:auto;color:var(--text-sub);font-size:11px;transition:transform .15s}
  .section.open .chev{transform:rotate(90deg)}
  .section-body{padding:var(--p-space-300)}

  .sub-toggle{width:100%;display:flex;align-items:center;gap:var(--p-space-200);background:var(--p-color-bg-surface);border:1px solid var(--border);
    border-radius:var(--p-border-radius-200);padding:var(--p-space-200) var(--p-space-300);cursor:pointer;margin-top:var(--p-space-200);text-align:left;font-size:12px}
  .sub-toggle:hover{background:var(--sunken)}
  .sub-toggle .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--text-dim)}
  .sub-toggle .n.on{color:var(--success);font-weight:500}

  .summary-strip{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--border);
    border-radius:var(--radius);overflow:hidden;background:var(--p-color-bg-surface);margin-bottom:var(--p-space-400)}
  .summary-strip>div{padding:var(--p-space-200) var(--p-space-300);border-right:1px solid var(--border);min-width:0}
  .summary-strip>div:last-child{border-right:0}
  .summary-strip .k{font-size:11px;color:var(--text-sub);text-transform:uppercase;letter-spacing:.05em}
  .summary-strip .v{font-size:12px;font-weight:500;color:var(--text-strong);margin-top:var(--p-space-050);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .rule-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--p-space-200)}
  /* One line, a tick and a label: the modal has one option, so it does not
     need a card with a heading and a paragraph inside it. */
  /* Câu dẫn là nội dung chính của modal nên nó phải là chữ chính. Trước đây nó dùng
     màu phụ, thành ra nhạt hơn cả nhãn checkbox bên dưới — thứ tự nhìn thấy ngược
     với thứ tự quan trọng. */
  /* Ba mức chữ tách hẳn nhau: câu dẫn 14px gần đen, nhãn checkbox 13px, chú thích
     12px xám. Cùng cỡ cùng màu thì mức quan trọng phải đoán, không đọc ra được. */
  .modal-lead{color:var(--text-strong);font-size:var(--p-font-size-350);
    line-height:var(--p-font-line-height-600)}
  .modal-lead b{font-weight:var(--p-font-weight-semibold)}
  /* Checkbox và câu giải thích của nó là một khối: cùng một khung, và câu giải thích
     thụt vào đúng mép nhãn để không bị đọc thành một đoạn ngang hàng với câu dẫn. */
  .check-block{margin-top:var(--p-space-300);border:1px solid var(--border);
    border-radius:var(--p-border-radius-200);background:var(--p-color-bg-surface);
    padding:var(--p-space-200) var(--p-space-300)}
  .check-row{display:flex;align-items:center;gap:var(--p-space-200);cursor:pointer;margin:0}
  .check-block:hover{background:var(--p-color-bg-surface-hover)}
  .check-row input{width:auto;flex:none}
  .check-hint{margin:var(--p-space-050) 0 0 var(--p-space-600);font-size:var(--p-font-size-300);
    line-height:var(--p-font-line-height-500);color:var(--p-color-text-secondary)}
  /* Toggle: bật hay tắt là một trạng thái đang có, không phải một ô cần tick để đồng ý. */
  .switch{display:flex;align-items:center;gap:var(--p-space-300);cursor:pointer;margin:0}
  .switch input{position:absolute;opacity:0;width:0;height:0}
  .switch .track{position:relative;flex:none;width:2rem;height:1.125rem;border-radius:999px;
    background:var(--p-color-bg-fill-tertiary);transition:background .15s}
  .switch .track::after{content:"";position:absolute;top:2px;left:2px;width:0.875rem;height:0.875rem;
    border-radius:50%;background:var(--p-color-bg-surface);box-shadow:var(--p-shadow-100);
    transition:transform .15s}
  .switch input:checked + .track{background:var(--p-color-bg-fill-brand)}
  .switch input:checked + .track::after{transform:translateX(0.875rem)}
  .switch input:focus-visible + .track{outline:0.125rem solid var(--p-color-border-focus);outline-offset:0.125rem}
  .switch .lbl{flex:1;font-size:var(--p-font-size-350);font-weight:var(--p-font-weight-semibold);
    color:var(--text-strong)}
  .switch-hint{margin:var(--p-space-100) 0 0 2.75rem;font-size:var(--p-font-size-300);
    line-height:var(--p-font-line-height-500);color:var(--p-color-text-secondary)}
  .rule-card{display:flex;gap:var(--p-space-200);border:1px solid var(--border-strong);border-radius:var(--p-border-radius-200);padding:var(--p-space-200);
    cursor:pointer;align-items:flex-start;background:var(--p-color-bg-surface)}
  .rule-card:hover{background:var(--sunken)}
  .rule-card.selected{border-color:var(--p-color-bg-surface-inverse);box-shadow:inset 0 0 0 1px var(--p-color-bg-surface-inverse)}
  .rule-title{font-weight:500;font-size:12px;color:var(--text-strong)}
  .rule-desc{font-size:11px;color:var(--text-sub);margin-top:var(--p-space-050);line-height:1.4}

  .product-selector{border:1px solid var(--border);border-radius:var(--p-border-radius-200);margin-top:var(--p-space-300);overflow:hidden}
  .toolbar{display:flex;align-items:center;gap:var(--p-space-200);padding:var(--p-space-200) var(--p-space-300);background:var(--sunken);
    border-bottom:1px solid var(--border);font-size:12px;flex-wrap:wrap}

  /* ---------- resolution chain (F-06) ---------- */
  .chain{border:1px solid var(--border);border-radius:var(--p-border-radius-200);overflow:hidden}
  .chain-step{display:flex;align-items:center;gap:var(--p-space-200);padding:var(--p-space-200) var(--p-space-300);border-bottom:1px solid var(--border);font-size:12px}
  .chain-step:last-child{border-bottom:0}
  .chain-step .mk{width:18px;height:18px;border-radius:50%;flex:none;display:flex;align-items:center;
    justify-content:center;font-size:11px;background:var(--p-color-border-secondary);color:var(--text-dim)}
  .chain-step.hit{background:var(--success-bg)}
  .chain-step.hit .mk{background:var(--success);color:var(--p-color-bg-surface)}
  .chain-step.skip{color:var(--text-dim)}
  .chain-step .lbl{font-weight:500;color:var(--text-strong)}
  .chain-step.skip .lbl{color:var(--text-dim);font-weight:400}
  .chain-step .out{margin-left:auto;font-family:var(--mono);font-size:12px}

  /* ---------- drawer / modal ---------- */
  .scrim{position:fixed;inset:0;background:rgba(26,26,26,.45);z-index:40;display:none}
  .scrim.open{display:block}
  .drawer{position:absolute;right:0;top:0;bottom:0;width:min(560px,100%);background:var(--bg);
    display:flex;flex-direction:column;box-shadow:var(--shadow-pop)}
  .drawer.fullscreen{width:100%;left:0}
  .drawer-head{display:flex;align-items:center;gap:var(--p-space-200);padding:var(--p-space-300) var(--p-space-400);background:var(--p-color-bg-surface);
    border-bottom:1px solid var(--border)}
  .drawer-head h2{font-size:14px;font-weight:600;color:var(--text-strong)}
  .drawer-body{flex:1;overflow:auto;padding:var(--p-space-400)}
  .drawer.fullscreen .drawer-body{padding:var(--p-space-500) calc(50% - 430px)}
  @media(max-width:960px){.drawer.fullscreen .drawer-body{padding:var(--p-space-400)}}
  .drawer-foot{display:flex;gap:var(--p-space-200);justify-content:flex-end;padding:var(--p-space-300) var(--p-space-400);background:var(--p-color-bg-surface);
    border-top:1px solid var(--border)}
  .x-btn{margin-left:auto;background:none;border:0;font-size:14px;cursor:pointer;color:var(--text-sub);
    padding:var(--p-space-050) var(--p-space-150);border-radius:var(--p-border-radius-100)}
  .x-btn:hover{background:var(--p-color-border-secondary)}
  .x-btn svg{width:1.25rem;height:1.25rem;display:block}
  .modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(540px,94vw);
    max-height:88vh;background:var(--bg);border-radius:var(--p-border-radius-300);display:flex;flex-direction:column;overflow:hidden;
    box-shadow:var(--shadow-pop)}
  .modal .drawer-body{padding:var(--p-space-400)}
  .modal-wide{width:min(820px,94vw)}
  /* ---------- Resolved-prices board (full assignment, Shopify-style) ---------- */
  .rp-panel-head{display:flex;align-items:center;justify-content:space-between;gap:var(--p-space-200);margin-bottom:var(--p-space-100)}
  .rp-panel-head h3{margin:0}
  .rp-board{display:flex;flex-direction:column;gap:var(--p-space-300);max-height:66vh}
  .rp-board .search-field{flex:none}
  .rp-count{flex:none;color:var(--text-sub);font-size:12px;margin-top:calc(-1 * var(--p-space-150))}
  .rp-scroll{flex:1;min-height:0;overflow-y:auto;border:1px solid var(--border);border-radius:var(--p-border-radius-300);background:var(--p-color-bg-surface)}
  .rp-table{width:100%;border-collapse:collapse;font-size:13px}
  .rp-table thead th{position:sticky;top:0;z-index:1;background:var(--sunken);text-align:left;font-weight:600;color:var(--text-sub);font-size:12px;padding:var(--p-space-200) var(--p-space-300);border-bottom:1px solid var(--border);white-space:nowrap}
  .rp-table td{padding:var(--p-space-200) var(--p-space-300);border-bottom:1px solid var(--border);vertical-align:middle}
  .rp-table tbody tr:last-child td{border-bottom:0}
  .rp-table tbody tr:hover{background:var(--sunken)}
  .rp-table td.num,.rp-table th.num{text-align:right;white-space:nowrap}
  .rp-name{font-weight:550;color:var(--text-strong);line-height:1.3}
  .rp-sku{font-size:11px;color:var(--text-dim);font-family:var(--mono)}
  .rp-tier{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:9px;white-space:nowrap;background:var(--p-color-bg-fill-tertiary);color:var(--text-sub)}
  .rp-tier.rp-product{background:var(--success-bg);color:var(--success)}
  .rp-tier.rp-rule{background:var(--info-bg);color:var(--info)}
  .rp-off{color:var(--success);font-weight:600}
  .rp-empty{padding:var(--p-space-1000) var(--p-space-400);text-align:center;color:var(--text-sub);border:1px solid var(--border);border-radius:var(--p-border-radius-300);background:var(--p-color-bg-surface)}

  /* ---------- add-company source picker ---------- */
  .source-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--p-space-200)}
  .source-option{background:var(--p-color-bg-surface);border:1px solid var(--border-strong);border-radius:var(--p-border-radius-200);padding:var(--p-space-300);
    text-align:left;cursor:pointer;min-height:132px;display:flex;flex-direction:column;gap:var(--p-space-150)}
  .source-option:hover{background:var(--sunken);border-color:var(--p-color-icon-secondary)}
  .source-option .source-icon{width:28px;height:28px;border-radius:var(--p-border-radius-200);background:var(--p-color-border-secondary);
    display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--text-strong)}
  .source-option .source-title{font-weight:600;color:var(--text-strong);font-size:13px}
  .source-option .source-desc{font-size:12px;line-height:1.45;color:var(--text-sub)}
  .source-option .source-meta{margin-top:auto;font-size:11px;color:var(--text-dim);font-family:var(--mono)}

  .directory-toolbar{display:flex;align-items:center;gap:var(--p-space-200);margin-bottom:var(--p-space-200)}
  .directory-toolbar input{flex:1}
  .directory-list{border:1px solid var(--border);border-radius:var(--p-border-radius-200);overflow:hidden;background:var(--p-color-bg-surface);max-height:390px;overflow-y:auto}
  .directory-row{width:100%;border:0;border-bottom:1px solid var(--border);background:var(--p-color-bg-surface);padding:var(--p-space-300) var(--p-space-300);
    display:grid;grid-template-columns:30px minmax(0,1fr);align-items:center;gap:var(--p-space-200);text-align:left;cursor:pointer}
  .directory-row:last-child{border-bottom:0}
  .directory-row:hover:not(:disabled){background:var(--sunken)}
  .directory-row.selected{background:var(--info-bg);box-shadow:inset 3px 0 0 var(--info)}
  .directory-row.selected .directory-title:after{content:" · Selected";color:var(--info);font-weight:600}
  .directory-row:disabled{cursor:not-allowed;opacity:.68}
  .directory-radio{width:17px;height:17px;border:1px solid var(--border-strong);border-radius:50%;display:flex;
    align-items:center;justify-content:center;background:var(--p-color-bg-surface)}
  .directory-row.selected .directory-radio:after{content:"";width:9px;height:9px;border-radius:50%;background:var(--p-color-bg-surface-inverse)}
  .directory-title{font-weight:600;color:var(--text-strong)}
  .directory-meta{font-size:12px;color:var(--text-sub);margin-top:var(--p-space-050)}
  .selected-source{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--p-space-300);align-items:start;
    padding:var(--p-space-300);border:1px solid var(--info-border);border-radius:var(--p-border-radius-200);background:var(--info-bg);margin-bottom:var(--p-space-300)}
  .location-checks{border:1px solid var(--border);border-radius:var(--p-border-radius-200);overflow:hidden}
  .location-check{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:var(--p-space-200);align-items:center;
    padding:var(--p-space-200) var(--p-space-300);border-bottom:1px solid var(--border);background:var(--p-color-bg-surface)}
  .location-check:last-child{border-bottom:0}
  .location-check input{width:auto}
  .source-placeholder{padding:var(--p-space-500);border:1px dashed var(--border-strong);border-radius:var(--p-border-radius-200);background:var(--p-color-bg-surface)}

  /* ---------- guided company setup ---------- */
  /* Auto-fit the steps rather than a fixed four columns: the wizard lost a step
     and the grid kept an empty cell at the end. */
  .setup-steps{display:flex;margin-bottom:var(--p-space-400);
    border:1px solid var(--border);border-radius:var(--p-border-radius-200);overflow:hidden;background:var(--p-color-bg-surface)}
  .setup-step{flex:1;min-width:0;padding:var(--p-space-200) var(--p-space-300);border-right:1px solid var(--border);
    display:flex;gap:var(--p-space-200);align-items:center;color:var(--text-dim);font-size:12px}
  .setup-step > span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .setup-step:last-child{border-right:0}
  .setup-step .step-dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    border:1px solid var(--border-strong);font-size:11px;flex:none;background:var(--p-color-bg-surface)}
  .setup-step.done{color:var(--text-sub)}
  .setup-step.done .step-dot{background:var(--success);border-color:var(--success);color:var(--p-color-bg-surface)}
  .setup-step.active{color:var(--text-strong);font-weight:var(--p-font-weight-semibold);background:var(--sunken)}
  .setup-step.active .step-dot{background:var(--p-color-bg-surface-inverse);border-color:var(--p-color-bg-surface-inverse);color:var(--p-color-bg-surface)}
  .pricing-route-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--p-space-200);margin-bottom:var(--p-space-300)}
  .pricing-route{border:1px solid var(--border-strong);border-radius:var(--p-border-radius-200);background:var(--p-color-bg-surface);padding:var(--p-space-300);text-align:left;
    cursor:pointer;min-height:116px;display:flex;flex-direction:column;gap:var(--p-space-100)}
  .pricing-route:hover{background:var(--sunken)}
  .pricing-route.selected{border-color:var(--p-color-bg-surface-inverse);box-shadow:inset 0 0 0 1px var(--p-color-bg-surface-inverse);background:var(--p-color-bg-fill-hover)}
  .pricing-route .route-title{font-weight:600;color:var(--text-strong)}
  .pricing-route .route-desc{font-size:12px;line-height:1.45;color:var(--text-sub)}
  .pricing-route .route-cta{margin-top:auto;font-size:11px;color:var(--info);font-weight:600}
  .review-block{border:1px solid var(--border);border-radius:var(--p-border-radius-200);background:var(--p-color-bg-surface);overflow:hidden;margin-bottom:var(--p-space-300)}
  .review-block .review-head{padding:var(--p-space-200) var(--p-space-300);background:var(--sunken);border-bottom:1px solid var(--border);
    font-weight:600;color:var(--text-strong)}
  .review-block .review-body{padding:var(--p-space-300) var(--p-space-300)}
  .context-banner{display:flex;align-items:flex-start;gap:var(--p-space-200);background:var(--info-bg);
    border:1px solid var(--info-border);border-radius:var(--p-border-radius-200);padding:var(--p-space-200) var(--p-space-300);margin-bottom:var(--p-space-300);color:var(--p-color-text-info)}
  .context-banner .context-mark{width:24px;height:24px;border-radius:var(--p-border-radius-150);background:var(--p-color-bg-surface);display:flex;
    align-items:center;justify-content:center;font-weight:700;flex:none}

  .pricing-structure{display:grid;grid-template-columns:1fr 1fr;gap:var(--p-space-200);margin-bottom:var(--p-space-300)}
  .pricing-structure-option{border:1px solid var(--border-strong);border-radius:var(--p-border-radius-200);background:var(--p-color-bg-surface);
    padding:var(--p-space-300) var(--p-space-300);text-align:left;cursor:pointer}
  .pricing-structure-option:hover{background:var(--sunken)}
  .pricing-structure-option.selected{border-color:var(--p-color-bg-surface-inverse);box-shadow:inset 0 0 0 1px var(--p-color-bg-surface-inverse);background:var(--p-color-bg-fill-hover)}
  .pricing-structure-option b{display:block;color:var(--text-strong);margin-bottom:var(--p-space-100)}
  .pricing-structure-option span{font-size:12px;color:var(--text-sub);line-height:1.45}
  .location-pricing-list{border:1px solid var(--border);border-radius:var(--p-border-radius-200);overflow:hidden;background:var(--p-color-bg-surface);margin-bottom:var(--p-space-300)}
  .location-pricing-row{display:grid;grid-template-columns:minmax(150px,1fr) minmax(220px,1.4fr) auto;
    gap:var(--p-space-200);align-items:center;padding:var(--p-space-200) var(--p-space-300);border-bottom:1px solid var(--border)}
  .location-pricing-row:last-child{border-bottom:0}
  .location-pricing-row select{margin:0}
  .location-pricing-name{font-weight:600;color:var(--text-strong)}
  .location-pricing-meta{font-size:11px;color:var(--text-dim);margin-top:var(--p-space-050)}
  .bulk-price-toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--p-space-200);align-items:end;
    padding:var(--p-space-200) var(--p-space-300);background:var(--sunken);border-bottom:1px solid var(--border)}
  .location-price-summary{display:flex;align-items:center;gap:var(--p-space-200);flex-wrap:wrap}
  .location-price-summary .arrow{color:var(--text-dim)}

  .pricing-context-bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--p-space-200);align-items:end;
    padding:var(--p-space-300) var(--p-space-300);border:1px solid var(--border);border-radius:var(--p-border-radius-200);background:var(--sunken);margin-bottom:var(--p-space-300)}
  .pricing-context-bar .form-field{margin:0}
  .context-nav{display:flex;gap:var(--p-space-150)}
  .context-nav .btn{min-width:34px}
  .pricing-resolution-card{border:1px solid var(--border);border-radius:var(--p-border-radius-200);background:var(--p-color-bg-surface);overflow:hidden;margin-bottom:var(--p-space-300)}
  .pricing-resolution-card .resolution-head{display:flex;align-items:center;gap:var(--p-space-200);padding:var(--p-space-200) var(--p-space-300);
    border-bottom:1px solid var(--border);background:var(--sunken)}
  .pricing-resolution-card .resolution-head b{color:var(--text-strong)}
  .pricing-resolution-card .resolution-body{padding:var(--p-space-300) var(--p-space-300)}
  .pricing-resolution-path{display:flex;align-items:center;gap:var(--p-space-200);flex-wrap:wrap;color:var(--text-sub);font-size:12px}
  .pricing-resolution-path .active-source{color:var(--success);font-weight:600}
  .context-target-title{font-size:14px;font-weight:600;color:var(--text-strong);margin-bottom:var(--p-space-100)}
  .context-target-sub{font-size:12px;color:var(--text-sub)}

  .type-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--p-space-400);margin:var(--p-space-300) 0 var(--p-space-200)}
  .type-card{border:1px solid var(--border);border-radius:var(--p-border-radius-300);background:var(--p-color-bg-surface);padding:var(--p-space-400);display:flex;flex-direction:column;gap:var(--p-space-300);min-height:280px}

   ============================================================ */
/* A target can hold one profile per pricing model. The rest of the app still
   resolves a single profile per target, so the most specific one is mirrored
   into companySetupPolicyId. */
/* Hai pricing type, không phải ba. Price list và Price rule gộp thành Base pricing:
   một default adjustment cộng explicit price cho những product ngoại lệ. Merchant
   không còn phải hỏi "dùng cái nào" rồi "cái nào thắng". */
const KIND_ORDER = ['base','quantity'];
function emptyKindSel(){ return {base:[],quantity:null}; }
/* Phương án A: base là DANH SÁCH refs (thêm nhiều base), quantity vẫn 1 slot. */
function selBaseRefs(sel){ return (sel && Array.isArray(sel.base)) ? sel.base : (sel && sel.base ? [sel.base] : []); }
function selAllRefs(sel){ return [...selBaseRefs(sel), ...(sel && sel.quantity ? [sel.quantity] : [])]; }
function kindOf(p){ return p?.priceKind==='quantity' ? 'quantity' : 'base'; }
/* Buyer count is derived from the account list so the number and the names
   can never disagree. */
const buyersAt = (source,locationName) => (source.contacts||[]).filter(c=>c.location===locationName);
/* Whoever Shopify lists first on the Company. There is no app-side "account
   owner" to type in: the app does not own buyer accounts, so a field for one
   only created something that could disagree with Shopify. */

/* ============================================================
   LOCATION MODEL — Location là resource thật của Company.
   Identity (name/address/status) + Purchasing (paymentTerms,
   purchasingMode) + Buyers (contacts với locationId). Pricing KHÔNG
   lưu trên Location — luôn resolve từ Company qua effectivePricing(),
   nên Location không bao giờ thành pricing engine thứ hai.
   purchasingMode và paymentTerms là hai dimension độc lập.
   ============================================================ */
const PURCHASING_LABEL = {DIRECT:'Buys directly', REQUIRE_APPROVAL:'Requires approval'};
function purchasingLabel(mode){ return PURCHASING_LABEL[mode] || PURCHASING_LABEL.DIRECT; }

/* Canonical hoá mọi company object (seed data, Shopify link, RFQ inject):
   legacy fields (terms/ordering/buyers trên location, locations/location trên
   contact) được map sang model mới rồi xoá, để không còn hai nguồn số liệu. */
function normalizeCompany(c){
  (c.locations||[]).forEach((l,i)=>{
    l.id = l.id || (c.id+'-l'+(i+1));
    l.status = l.status || 'Active';
    if(!l.paymentTerms) l.paymentTerms = (l.terms && l.terms!=='Not set') ? l.terms : 'No payment terms';
    if(!l.purchasingMode) l.purchasingMode = l.ordering==='You approve first' ? 'REQUIRE_APPROVAL' : 'DIRECT';
    if(l.address===undefined) l.address = '';
    /* Các field cùng cấu trúc với form Create location bên RFQ (shipping,
       external ID, checkout, tax) — để hai app mô tả cùng một Location. */
    if(l.externalId===undefined) l.externalId = '';
    if(!l.shipping) l.shipping = {country:'VN', address1:l.address||'', address2:'', city:'', postal:'', phone:''};
    if(l.billingSameAsShipping===undefined) l.billingSameAsShipping = true;
    if(l.editableShipping===undefined) l.editableShipping = false;
    if(l.taxId===undefined) l.taxId = '';
    if(!l.taxSettings) l.taxSettings = 'collect';
    // Per-location pricing override: chỉ giữ REFERENCE tới Pricing Profile
    // (policyId), không lưu rule. Rỗng → inherit từ Company.
    if(!l.pricing) l.pricing = {base:null, quantity:null};
    delete l.terms; delete l.ordering; delete l.buyers;
  });
  (c.contacts||[]).forEach(ct=>{
    if(!ct.locationId){
      const name = ct.locations || ct.location || '';
      const loc = (c.locations||[]).find(l=>l.name===name);
      ct.locationId = loc ? loc.id : null;
    }
    delete ct.locations; delete ct.location;
  });
  // Orders (orderSeed) tham chiếu location bằng tên — map sang locationId,
  // giữ o.location làm tên hiển thị dự phòng.
  (c.orders||[]).forEach(o=>{
    if(!o.locationId){
      const loc = (c.locations||[]).find(l=>l.name===o.location);
      o.locationId = loc ? loc.id : null;
    }
  });
  return c;
}
const locationById = (c,id) => (c?.locations||[]).find(l=>l.id===id) || null;
/* Buyer count luôn derive từ contact assignment — số và tên không thể lệch nhau. */
const locationBuyers = (c,l) => (c?.contacts||[]).filter(ct=>ct.locationId===(l&&l.id));
const contactLocationName = (c,ct) => (locationById(c, ct.locationId)||{}).name || 'Unassigned';

/* Pricing resolution — chuỗi Location → Company. Với mỗi pricing kind:
   Location override (nếu có) thắng, không thì Company assignment. UI chỉ render
   kết quả resolve + source; rule nằm ở Pricing Profile, không ở Location. */
/* Back-compat alias — every caller now goes through the single resolvePricing()
   below so precedence and Inactive-handling can never drift between screens. */
function effectivePricing(company, location){ return resolvePricing(company, location); }

function kindSelPrimary(sel){ return selAllRefs(sel)[0] || null; }
function kindSelPolicies(sel){ return selAllRefs(sel).map(id=>policyById(id)).filter(Boolean); }
function syncSetupPolicySelections(){
  state.companySetupPolicyId = kindSelPrimary(state.companySetupPolicyByKind);
}
/* A slot holds either a library id or a reference to a draft. Everything that
   renders a slot goes through setupPolicy() so both read the same. */
const DRAFT_PREFIX = 'draft:';
const isDraftRef = ref => typeof ref==='string' && ref.startsWith(DRAFT_PREFIX);
const draftKindOf = ref => isDraftRef(ref) ? ref.slice(DRAFT_PREFIX.length) : null;
function setupPolicy(ref){
  if(!ref) return null;
  return isDraftRef(ref) ? (state.companySetupDrafts[draftKindOf(ref)] || null) : policyById(ref);
}
const setupKindPolicies = sel =>
  selAllRefs(sel).map(setupPolicy).filter(Boolean);

function seedKindSelFromPolicy(sel, policyId){
  const p=policyById(policyId); if(!p) return sel;
  if(kindOf(p)==='base'){ if(!Array.isArray(sel.base)) sel.base=[]; if(!sel.base.includes(p.id)) sel.base.push(p.id); }
  else sel.quantity=p.id;
  return sel;
}

/* A Company has no single "default price". It holds at most one profile per
   pricing type, and what it actually has is whichever types were assigned to
   it — so every screen shows the three slots, not one fixed profile. */
/* ── Multiple Base pricings per Company ──────────────────────────────────────
   A Company can hold several Base pricings, each with a merchant-set priority
   (lower number = higher priority). Every base covers the whole catalog, so per
   product the first base — in priority order — that is Active and inside its
   validity window wins; the rest are fallbacks (e.g. a dated top-priority base
   expires and the next one takes over). Quantity keeps a single slot; a Location
   keeps a single base override that replaces the whole company base list.
   Storage: c.pricing = { base:[{id,priority}], quantity:id|null }. */
function normalizePricingSel(pr){
  if(!pr || typeof pr!=='object') return {base:[],quantity:null};
  /* Legacy scalar base (old single-slot data / seed) → one-item list. This is
     the only step allowed to replace the array reference, and it runs at most
     once per object. Everything else normalizes IN PLACE so the array identity
     stays stable — a fresh array on every read would let a nested companyPricing()
     call (e.g. nextBasePriority during addCompanyBase) push into a stale array. */
  if(!Array.isArray(pr.base)) pr.base = pr.base ? [{id:pr.base, priority:1}] : [];
  for(let i=0;i<pr.base.length;i++){
    const e=pr.base[i];
    if(typeof e==='string') pr.base[i]={id:e, priority:i+1};
    else if(e && typeof e==='object'){ e.priority = (e.priority!=null)?Number(e.priority):i+1; }
  }
  for(let i=pr.base.length-1;i>=0;i--){ if(!pr.base[i] || !pr.base[i].id) pr.base.splice(i,1); }
  if(pr.quantity===undefined) pr.quantity=null;
  return pr;
}
function companyPricing(c){ c.pricing = normalizePricingSel(c.pricing); return c.pricing; }
/* Base entries in resolution order. Priority is a property of the PRICING
   itself — the profile's "Priority (0 to 99)" field — not a per-company number:
   lower applies first, ties keep insertion order, dangling ids dropped. */
function companyBaseEntries(c){
  /* On a priority tie, a SCOPED base (e.g. a quote pricing that only covers a
     few SKUs) beats an all-products base — the specific negotiated price should
     win over the general list; then insertion order. */
  const spec = id => { const st=policyById(id)?.scopeType; return (st && st!=='all') ? 0 : 1; };
  return companyPricing(c).base
    .map((e,i)=>{ const id=(e&&e.id)||e; return {id, priority:Number(policyById(id)?.priority)||0, _i:i}; })
    .filter(e=>policyById(e.id))
    .sort((a,b)=>(a.priority-b.priority)||(spec(a.id)-spec(b.id))||(a._i-b._i));
}
const companyBasePolicies = c => companyBaseEntries(c).map(e=>policyById(e.id));
const companyHasBase = (c,id) => companyPricing(c).base.some(e=>e.id===id);
function nextBasePriority(c){ const es=companyPricing(c).base; return es.length?Math.max(...es.map(e=>Number(e.priority)||0))+1:1; }
function addCompanyBase(c,id,priority){
  const pr=companyPricing(c);
  if(!policyById(id) || pr.base.some(e=>e.id===id)) return false;
  pr.base.push({id, priority: priority!=null?Number(priority):nextBasePriority(c)});
  return true;
}
function removeCompanyBase(c,id){
  const pr=companyPricing(c); const n=pr.base.length;
  pr.base = pr.base.filter(e=>e.id!==id);
  return pr.base.length!==n;
}
/* Usable for resolution right now: not turned off, and inside its dated window
   if it has one. Scheduled/expired bases step aside so the next priority applies. */
function basePriceableNow(p){
  if(!p || p.status==='Inactive') return false;
  if(p.validityType==='dated'){
    if(p.startDate && new Date(p.startDate) > TODAY) return false;
    if(p.endDate && new Date(p.endDate) < TODAY) return false;
  }
  return true;
}
const companyActiveBasePolicies = c => companyBasePolicies(c).filter(basePriceableNow);
function companyPricing_quantity(c){ return policyById(companyPricing(c).quantity); }
const companyPolicies = c => { const q=companyPricing_quantity(c); return [...companyBasePolicies(c), ...(q?[q]:[])]; };
const companyPrimaryPolicy = c => companyPolicies(c)[0] || null;
/* How many pricing TYPES a Company has set (base present counts once, quantity
   once) — the "N/2 types set" figure, not the number of base pricings. */
const companyKindCount = c => (companyBaseEntries(c).length?1:0) + (companyPricing_quantity(c)?1:0);

/* Một pricing phục vụ MỘT phía, ghi trên chính profile. Company-based B2B và
   D2C Wholesale là hai tập buyer không giao nhau: một email gắn với
   Location của Company luôn được phục vụ qua đường B2B. Hai phía đi qua hai đường
   resolve khác nhau, nên một profile nằm trong cả hai danh sách là một profile có
   thể bị gán vào chỗ nó không bao giờ áp được. Cùng một mức giảm 20% cho Company và
   cho customer là hai profile riêng, quản lý độc lập, vì hai nhóm khách có cách gán
   và vòng đời pricing khác nhau. */
const AUDIENCE_KEYS = ['b2b','d2c'];
const audienceOf = p => (p && p.audienceType==='d2c') ? 'd2c' : 'b2b';
const audienceName = a => a==='d2c' ? 'D2C Wholesale' : 'Company-based B2B';
const audienceShort = a => a==='d2c' ? 'Customers' : 'Companies';
const wantedAudienceFor = targetType => targetType==='customer' ? 'd2c' : 'b2b';
const policiesFor = (audience, kind) =>
  db.policies.filter(p=>audienceOf(p)===audience && (!kind || kindOf(p)===kind));
/* Đổi phía là đổi tập buyer, nên assignment bên cũ không đi theo được. */
function applyAudience(b, want){
  if(!b) return;
  b.audienceType = want==='d2c' ? 'd2c' : 'b2b';
  if(want==='d2c'){ b.b2bCompanyIds=[]; b.b2bLocationIds=[]; }
  else { b.customerTarget='none'; b.assignmentTargetIds=[]; }
}

/* Usage is counted from the data, never stored on the profile: a saved counter
   drifts the moment anything is assigned, reassigned or deleted. */
function policyUsage(id){
  if(!id) return {companies:[],tags:[],customers:[],globals:[],count:0};
  const companies=db.companies.filter(c=>companyHasBase(c,id) || companyPricing(c).quantity===id);
  const tags=db.tagPricing.filter(t=>t.defaultPolicyId===id);
  const customers=db.customers.filter(c=>c.policyId===id);
  /* Location override cũng là một assignee thật: một profile chỉ được location
     override tới vẫn đang "được dùng" (Active), và edit từ nơi khác phải fork. */
  const locations=[];
  db.companies.forEach(c=>c.locations.forEach(l=>{
    if(KIND_ORDER.some(k=>(l.pricing||{})[k]===id)) locations.push({companyId:c.id, id:l.id, name:l.name});
  }));
  /* Một global default vẫn là Companies hoặc Customers, không phải một loại buyer
     thứ ba. Nó tự gọi tên đúng cái đã chọn trong picker (All customers, Logged-in
     customers, Non logged-in customers), thay vì đặt ra một tên riêng. */
  const globals=[];
  if(db.defaults.b2bPolicyId===id) globals.push({side:'companies', label:'All Companies'});
  if(db.defaults.wholesalePolicyId===id){
    const p=policyById(id);
    globals.push({side:'customers',
      label:customerTargetLabel(AUDIENCE_TARGETS.includes(p&&p.audience)?p.audience:'all')});
  }
  return {companies,tags,customers,locations,globals,
    count:companies.length+tags.length+customers.length+locations.length+globals.length};
}
const policyUsageCount = id => policyUsage(id).count;
/* The library list is for finding a profile, so both of these answer at the
   level of kind: which sort of products, which sort of buyer. The counts and
   the names live on the profile and on the Company, where they are acted on. */
/* Không in số sản phẩm ở đây nữa. Con số đó chỉ đúng với Specific products, thứ
   chính merchant chọn ra; với Collections thì Shopify giữ danh sách thành viên và
   nó đổi mà app không biết, còn All products là cả catalog của cửa hàng, một con số
   biến động và không nói lên điều gì về chính pricing này. Nó có mặt ở đây chỉ để
   phục vụ việc sort theo Products, và việc sort đó vừa bị bỏ vì cùng lý do. Cột trở

/* Số assignee quay lại trên hàng, không phải để bổ sung chi tiết mà vì cột này giờ

const policyById = id => db.policies.find(p=>p.id===id) || null;

/* Shopify decides the buying context by email: an email attached to a company
   location always gets the B2B experience, so customer-level pricing can never
   reach it. Such customers are excluded from customer assignment. */
function companyForCustomerEmail(email){
  if(!email) return null;
  const key = String(email).toLowerCase();
  for(const c of db.companies){
    if((c.contacts||[]).some(x=>String(x.email).toLowerCase()===key)) return c;
  }
  return null;
}
const isCompanyContact = customer => !!companyForCustomerEmail(customer?.email);
/* "Wholesale customers not attached to a company". They are no longer listed
   as a section — this is only used to keep company contacts out of the
   customer-level assignment lists, since Shopify prices them as B2B. */
const individualCustomers = () => db.customers.filter(c=>!isCompanyContact(c));
/* A customer enters this app one of three ways: a price was assigned to them,
   they carry a tag that has a price, or they applied through the Form. The app
   never creates customers — Shopify owns that record. */
const isManagedCustomer = c => !!c.policyId || !!tagPolicyFor(c) || c.source==='Wholesale application';
const companyById = id => db.companies.find(c=>c.id===id) || null;
const customerById = id => db.customers.find(c=>c.id===id) || null;
/* Shopify has no "customer group" object — only tags (static labels) and
   segments (dynamic ShopifyQL queries). Membership lives on the customer as
   tags; the app only owns the tag -> pricing profile mapping. */
const tagById = tag => db.tagPricing.find(t=>t.id===tag) || null;
const groupById = tagById;   // back-compat for older call sites
const allCustomerTags = () => [...new Set(db.customers.flatMap(c=>c.tags||[]))].sort();
const customersWithTag = tag => db.customers.filter(c=>(c.tags||[]).includes(tag)).length;
/* A customer can carry several priced tags. Priority on the profile decides,
   then the most recently created profile. */
function tagPolicyFor(cust){
  const hits=(cust.tags||[]).map(tagById).filter(t=>t&&t.defaultPolicyId)
    .map(t=>({tag:t, p:policyById(t.defaultPolicyId)})).filter(x=>x.p);
  if(!hits.length) return null;
  hits.sort((a,b)=>(b.p.priority||0)-(a.p.priority||0));
  return hits[0];
}
const productBySku = sku => db.products.find(p=>p.sku===sku) || null;

/* ── ONE pricing resolver ─────────────────────────────────────────────────
   Precedence per pricing type: Location override → Company assignment. A
   turned-off (Inactive) profile does not apply, so it is skipped here exactly
   as it is in policyStatus — the on/off control is never decoration. If nothing
   is assigned at either level, the store-wide All-Companies default (if any, and
   active) is the last resort. Company status, the Location table, the Location
   pricing card and any order preview all read this one function, so precedence
   can never drift between them. */
const activePolicy = p => (p && p.status!=='Inactive') ? p : null;
function resolveKind(company, location, kind){
  /* Locations no longer hold their own pricing — always inherit the Company. */
  const compP = activePolicy(policyById(companyPricing(company)[kind]));
  if(compP) return {kind, policy:compP, source:'COMPANY'};
  return {kind, policy:null, source:null};
}
function resolvePricing(company, location){
  /* No per-Location override — pricing applies to the whole Company; every
     Location inherits the Company's Active, in-date bases in priority order. */
  const baseSource = 'COMPANY';
  const basePolicies = companyActiveBasePolicies(company);
  const qEntry = resolveKind(company, location, 'quantity');
  const entries = [
    ...basePolicies.map(p=>({kind:'base', policy:p, source:baseSource})),
    ...(qEntry.policy ? [qEntry] : [])
  ];
  const set = entries.filter(e=>e.policy);
  let profiles = set.map(e=>e.policy), source;
  if(profiles.length){
    const lead = set[0].source==='LOCATION' ? 'Location pricing' : 'Company pricing';
    source = profiles.length>1 ? `${lead} · ${profiles.length} pricings`
                               : `${lead} · ${kindName(kindOf(set[0].policy))}`;
  } else {
    const def = activePolicy(policyById(db.defaults.b2bPolicyId));
    if(def){ profiles=[def]; source='All Companies default'; }
    else source='No pricing';
  }
  return {
    entries,                              // per-kind {kind, policy, source}
    profiles,                             // resolved policies (assigned, else default)
    profile: profiles[0] || null,
    source,
    hasLocationOverride: false,
    sourceName: company.name
  };
}
/* Back-compat alias for the Company-status path. */
function resolveCompany(company, location){ return resolvePricing(company, location); }
function resolveCustomer(cust){
  /* Shopify tính giá theo email: email đã gắn vào một Company location luôn được
     hưởng trải nghiệm B2B, nên không pricing mức customer nào với tới được — kể cả
     qua tag hay store-wide default. Loại họ khỏi picker mới là một nửa việc. */
  if(isCompanyContact(cust)) return {profile:null, source:'Priced by their Company'};
  if(cust.policyId) return {profile:policyById(cust.policyId), source:'Customer override'};
  const hit = tagPolicyFor(cust); const g = hit ? hit.tag : null;
  if(g && g.defaultPolicyId) return {profile:policyById(g.defaultPolicyId), source:`Tag default · ${esc(g.name)}`};
  if(db.defaults.wholesalePolicyId) return {profile:policyById(db.defaults.wholesalePolicyId), source:'All customers default'};
  return {profile:null, source:'No pricing'};
}
function inScope(profile, sku){
  if(!profile) return false;
  /* Base pricing (3 tầng) luôn phủ toàn bộ sản phẩm — muốn hẹp thì dùng
     Collection/Product overrides. Chỉ Quantity pricing mới còn scope theo sản phẩm. */
  if(kindOf(profile)==='base') return true;
  if(profile.scopeType==='all') return true;
  return (profile.selectedProducts||[]).includes(sku);
}
/* Which products a BASE pricing actually prices, for the company base list only.
   Default "all products"; a base can be narrowed to specific products (e.g. a
   pricing built from a quote — only the quoted SKUs) or a collection, so a
   product outside that scope falls through to the NEXT base by priority. Single-
   profile paths (d2c customer, tag) still go through inScope and are untouched. */
function baseInScope(base, sku){
  if(!base) return false;
  const st = base.scopeType;
  if(!st || st==='all') return true;
  if(st==='collection') return collectionHas(base.collection, sku);
  if(st==='products')   return (base.selectedProducts||[]).includes(sku);
  return true;
}
/* Không còn toggle bật/tắt: một product có mặt trong danh sách override tức là nó
   đang có giá riêng. Không product thì không có lớp override. Bỏ được cả một trạng
   thái "có data nhưng không áp". */
const explicitOn = p => !!(p && Object.keys(p.productAdjustments||{}).length);

/* Danh mục (Collection) mô hình hoá bằng tập SKU — app không có membership riêng. */
const COLLECTIONS = {
  'Wholesale assortment':  ['FIL-XL','FIL-STD','SEA-30','HOS-12','VLV-40'],
  'Contractor assortment': ['FIL-XL','FIL-STD','SEA-30'],
  'Distributor assortment':['HOS-12','VLV-40'],
  'Project assortment':    ['SEA-30','HOS-12']
};
const collectionNames = () => Object.keys(COLLECTIONS);
const collectionHas = (name, sku) => (COLLECTIONS[name]||[]).includes(sku);
const vendorNames = () => [...new Set(db.products.map(p=>p.vendor).filter(Boolean))];
const productTypeNames = () => [...new Set(db.products.map(p=>p.productType).filter(Boolean))];
const tagNames = () => [...new Set(db.products.flatMap(p=>p.tags||[]))];

/* Conditional rule engine — Collection / Vendor / Tag / Product type chỉ là các
   CONDITION FIELD của cùng một engine, không phải pricing type riêng. Thêm field
   mới (SKU, Category, Metafield…) sau này không cần redesign. */
const COND_FIELDS = [
  {key:'collection',  label:'Collection',   op:'is',       values:collectionNames},
  {key:'vendor',      label:'Vendor',       op:'is',       values:vendorNames},
  {key:'productType', label:'Product type', op:'is',       values:productTypeNames},
  {key:'tag',         label:'Product tag',  op:'contains', values:tagNames},
  {key:'all',         label:'All products', op:'is',       values:()=>[]}
];
const condField = key => COND_FIELDS.find(f=>f.key===key) || COND_FIELDS[0];
/* Một condition giữ NHIỀU value: "Collection is any of Summer, Accessories" là một
   condition, không phải nhiều rule. AND/OR (match) chỉ để nối các DIMENSION khác
   nhau (Vendor AND Tag), không phải để chọn nhiều value trong cùng một field.
   Tolerant với data cũ dạng single `value`. */
const condValues = c => !c ? [] : (Array.isArray(c.values) ? c.values.filter(Boolean) : (c.value!=null&&c.value!=='' ? [c.value] : []));
function conditionMatches(cond, product){
  const vals=condValues(cond);
  if(!vals.length) return false;
  switch(cond.field){
    case 'all':         return true;
    case 'collection':  return vals.some(v=>collectionHas(v, product.sku));
    case 'vendor':      return vals.includes(product.vendor);
    case 'productType': return vals.includes(product.productType);
    case 'tag':         return (product.tags||[]).some(tg=>vals.includes(tg));
    default: return false;
  }
}
function ruleMatches(rule, product){
  const conds=(rule.conditions||[]).filter(c=>condValues(c).length);
  if(!conds.length) return false;
  return rule.match==='ANY' ? conds.some(c=>conditionMatches(c,product))
                            : conds.every(c=>conditionMatches(c,product));
}
/* Rule thắng = rule KHỚP đầu tiên tính từ trên xuống. Thứ tự chính là priority
   (kéo ↑↓ để đổi). KHÔNG suy ra "specific hơn" từ số condition nữa: với Match any,
   nhiều condition lại nghĩa là RỘNG hơn chứ không hẹp hơn, nên đếm condition là
   sai. First-match giải thích được cho merchant và làm nút ↑↓ có nghĩa thật. */
function matchConditionalRule(profile, product){
  return (profile.conditionalRules||[]).find(r=>ruleMatches(r,product)) || null;
}
/* Một rule có ít nhất một condition đã chọn value và một adjustment thật (không
   phải 'keep') mới thực sự đổi giá — dùng cho cả validate lẫn prune. */
const validConditionalRule = r => (r.conditions||[]).some(c=>condValues(c).length) && r.rule && r.rule!=='keep';
/* Áp một adjustment {rule,valueType,value} lên giá gốc. */
function applyAdjustment(rule, vt, val, base){
  const round = x => Math.round(x*100)/100;
  val = Number(val ?? 0);
  if(rule==='keep') return base;
  if(rule==='set') return round(val);
  if(rule==='decrease') return round(vt==='percentage' ? base*(1-val/100) : base-val);
  if(rule==='increase') return round(vt==='percentage' ? base*(1+val/100) : base+val);
  return base;
}
/* Resolve 3 tầng, cụ thể nhất thắng: Product override → Conditional rule → Default. */
function priceFor(profile, product){
  if(!profile || !product) return null;
  if(!inScope(profile, product.sku)) return null;
  const base = product.list;
  const adj = explicitOn(profile) ? (profile.productAdjustments||{})[product.sku] : null;
  if(adj && adj.rule) return applyAdjustment(adj.rule, adj.valueType||'percentage', adj.value, base);
  const cr = matchConditionalRule(profile, product);
  if(cr && cr.rule) return applyAdjustment(cr.rule, cr.valueType||'percentage', cr.value, base);
  return applyAdjustment(profile.pricingRule, profile.valueType, profile.value, base);
}
/* Tier mà một SKU rơi vào — dùng cho preview/nhãn. */
function priceTierFor(profile, sku){
  if(!profile) return null;
  const product = db.products.find(p=>p.sku===sku);
  if(explicitOn(profile) && (profile.productAdjustments||{})[sku]?.rule) return 'product';
  if(product && matchConditionalRule(profile, product)) return 'rule';
  return 'base';
}
/* Op hiển thị: một value thì "is"/"contains"; nhiều value thì "is any of" /
   "has any of". */
function condOpLabel(c){
  const f=condField(c.field), multi=condValues(c).length>1;
  return f.op==='contains' ? (multi?'has any of':'has') : (multi?'is any of':'is');
}
function condLabel(c){
  if(c && c.field==='all') return 'All products';
  const f=condField(c.field), vals=condValues(c);
  if(!vals.length) return `${f.label} — not set`;
  const shown = vals.length<=2 ? vals.join(', ') : `${vals.slice(0,2).join(', ')} +${vals.length-2}`;
  return `${f.label} ${condOpLabel(c)} ${shown}`;
}
/* Nhãn một dòng cho resolution preview. */
function ruleLabel(rule){
  const conds=(rule.conditions||[]).filter(c=>condValues(c).length);
  if(!conds.length) return 'Any product';
  const join = rule.match==='ANY' ? ' or ' : ' and ';
  return conds.map(condLabel).join(join);
}
/* Rule luôn một dimension → nhãn "type" là tên field, summary là các value. */
const RULE_TYPE_LABEL = {collection:'Collection', vendor:'Vendor', productType:'Product type', tag:'Product tag', all:'All products'};
function ruleTypeLabel(r){
  const c=(r.conditions||[])[0];
  return c ? (RULE_TYPE_LABEL[c.field]||'Rule') : 'Rule';
}
function ruleValuesSummary(r){
  const c=(r.conditions||[])[0];
  if(c && c.field==='all') return 'Every product';
  const vals=condValues(c);
  return vals.length ? vals.join(' · ') : 'Not configured yet';
}
function ruleAdjustmentLabel(r){
  if(r.rule==='set') return `Fixed ${money(r.value||0)}`;
  if(!r.value) return '—';
  return r.valueType==='amount' ? `${money(r.value)} off` : `${r.value}% off`;
}

/* Migration: base về scope 'all'; collectionOverrides cũ → conditionalRules
   (mỗi cái = 1 condition Collection is X); base scope collection hẹp có adjustment
   thật → thành một conditional rule để giữ hành vi. */
(function migrateBaseRules(){
  let rid=1;
  const allSkus=db.products.map(p=>p.sku);
  db.policies.forEach(p=>{
    if(kindOf(p)!=='base') return;
    p.conditionalRules = p.conditionalRules || [];
    // collectionOverrides (bản trước) → conditionalRules
    (p.collectionOverrides||[]).forEach(co=>{
      p.conditionalRules.push({id:co.id||'cr'+(rid++),
        conditions:[{field:'collection',operator:'is',value:co.collection}], match:'ALL',
        rule:co.rule, valueType:co.valueType, value:co.value});
    });
    delete p.collectionOverrides;
    // base scope collection hẹp + adjustment thật → conditional rule
    const scoped=p.selectedProducts||[];
    const isAll=scoped.length && allSkus.every(s=>scoped.includes(s));
    if(p.scopeType==='collection' && !isAll && p.pricingRule && p.pricingRule!=='keep' && COLLECTIONS[p.collection]){
      p.conditionalRules.unshift({id:'cr'+(rid++),
        conditions:[{field:'collection',operator:'is',value:p.collection}], match:'ALL',
        rule:p.pricingRule, valueType:p.valueType, value:p.value});
      p.pricingRule='keep'; p.value=0;
    }
    /* Default price (adjustment base cũ) → một rule "All products" ở CUỐI danh sách:
       catch-all thua mọi rule cụ thể theo first-match. Không còn card Default price
       riêng — "giá cho mọi sản phẩm" giờ cũng chỉ là một rule như các rule khác. */
    if(p.pricingRule && p.pricingRule!=='keep'){
      p.conditionalRules.push({id:'cr-all-'+p.id,
        conditions:[{field:'all',operator:'is',values:['All products']}], match:'ALL',
        rule:p.pricingRule, valueType:p.valueType, value:p.value});
      p.pricingRule='keep'; p.value=0;
    }
    p.scopeType='all'; p.selectedProducts=allSkus;
  });
  /* Condition single-value (data cũ) → multi-value: một condition giữ mảng values.
     Từ đây toàn app đọc/ghi qua condValues + c.values đồng nhất. */
  db.policies.forEach(p=>{
    (p.conditionalRules||[]).forEach(r=>{
      (r.conditions||[]).forEach(c=>{
        if(!Array.isArray(c.values)) c.values = (c.value!=null&&c.value!=='') ? [c.value] : [];
        delete c.value;
      });
    });
  });
})();
/* labels */
function scopeLabel(p){
  if(!p) return 'None';
  /* Base defaults to all products, but can be narrowed (e.g. a quote pricing
     covers only its SKUs), so read the real scope instead of assuming "all". */
  const st = p.scopeType || (kindOf(p)==='base' ? 'all' : 'products');
  if(st==='all') return 'All products';
  if(st==='collection') return `${p.collection}`;
  return `${(p.selectedProducts||[]).length} selected products`;
}
/* The rule column used to read "−10%" with nothing to say what it was off, and
   an amount discount ("−$5.00") looked the same as a fixed price. An amount is
   per unit, not per order — that is the part worth being explicit about. Each
   pricing type also gets its own phrasing: a volume pricing was showing the
   profile-level value it does not use instead of its quantity ranges. */
const rangeAmount = r => r.valueType==='percentage'
  ? `${r.value||0}%` : `${money(r.value||0)} per unit`;

/* Quantity discount can be taken off the raw Shopify price or off the price the
   Base pricing already produced for the company. Default keeps the old
   behaviour (off the Shopify price). */
const volumeBasisOf = p => (p && p.volumeBasis==='base') ? 'base' : 'shopify';
const VOLUME_BASIS_LABEL = { shopify:'Shopify price', base:'the base price' };
const volumeBasisLabel = p => VOLUME_BASIS_LABEL[volumeBasisOf(p)];

function priceLabel(p){
  if(!p) return 'None';
  const n = explicitOn(p) ? Object.keys(p.productAdjustments||{}).length : 0;

  if(kindOf(p)==='quantity'){
    const ranges = p.volumeRanges||[];
    if(!ranges.length) return 'No quantity ranges yet';
    /* The first tier is normally the no-discount baseline (1–9 at 0%). Reading
       it as part of the span produced "−0% to −20%", which names a discount
       of nothing and hides where discounting actually starts. */
    const active = ranges.filter(r=>Number(r.value||0)>0);
    const count = `${ranges.length} range${ranges.length===1?'':'s'}`;
    if(!active.length) return `No discount in any range · ${count}`;
    const span = active.length>1
      ? `${rangeAmount(active[0])} to ${rangeAmount(active[active.length-1])}`
      : rangeAmount(active[0]);
    return `${span} off ${volumeBasisLabel(p)} from ${active[0].from}+ · ${count}`;
  }

  /* "Giá cho mọi sản phẩm" giờ là một rule "All products" chứ không còn là base.
     Nhấc nó lên làm headline; các rule hẹp hơn đếm vào phần " · N rules". */
  const allRule = (p.conditionalRules||[]).find(r=>((r.conditions||[])[0]||{}).field==='all');
  const cn = (p.conditionalRules||[]).length - (allRule?1:0);
  const extra = `${cn>0?` · ${cn} rule${cn>1?'s':''}`:''}${n?` · ${n} product price${n>1?'s':''}`:''}`;
  if(!allRule || allRule.rule==='keep') return `Shopify price${extra}`;
  if(allRule.rule==='set') return `Fixed ${money(allRule.value)} per unit${extra}`;
  const unit = allRule.valueType==='percentage' ? `${allRule.value||0}%` : `${money(allRule.value||0)} per unit`;
  return `${unit} ${allRule.rule==='decrease'?'off':'above'} Shopify price${extra}`;
}
const fallbackLabel = f => ({hide:'Hide them', store:'Show Shopify price', quote:'Require a quote', fallback:'Use another price'}[f] || 'None');
/* Turned off is a choice the merchant made; scheduled is a fact about the
   dates. Reading both off p.status alone could not tell them apart, and the
   sample data proved it: one profile was stored as Scheduled, so the on/off
