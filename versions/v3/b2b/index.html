    return {...b,count:rows.length,wins,rate:rows.length?Math.round(wins/rows.length*100):null};
  });
  const maxDiscountRate=Math.max(1,...discountBuckets.map(x=>x.rate||0));
  const discountConversionBody=`<div class="analytics-rank">${discountBuckets.map(b=>`<div class="analytics-rank-row"><div class="analytics-rank-label"><b>${b.name}</b><small>${b.count} finalized quote${b.count===1?'':'s'}</small></div><div class="analytics-rank-track"><div class="analytics-rank-fill" style="width:${b.rate==null?0:Math.round(b.rate/maxDiscountRate*100)}%"></div></div><div class="analytics-rank-value"><b>${b.rate==null?'—':b.rate+'%'}</b><small> won</small></div></div>`).join('')}</div>`;
  const discountWithData=discountBuckets.filter(x=>x.rate!=null);

  const pipelineScores=scorecard([
    {label:'Open quote value',value:money(openQuoteValue),foot:`${openQuotes.length} quote${openQuotes.length===1?'':'s'} waiting for a decision`,question:'How much quoted value is still unresolved?'},
    {label:'Typical first response',value:formatTypicalTime(responseMedian),foot:'time to the first priced response',question:'How long do buyers typically wait for the first priced response?'},
    {label:'Typical time to close',value:formatTypicalTime(closeMedian),foot:'RFQ received to final decision',question:'How long does a quote typically take to reach a final decision?'}
  ]);

  const agingCard=card('Open quote aging','Open quoted value grouped by time since the latest buyer or merchant decision point.',agingBody,'','How much unresolved quoted value has been open for 3, 7, 14 or more days?');

  const avgDealCompare=`<div class="analytics-mini-compare"><div><span>Average won quote</span><b>${avgWonValue==null?'—':money(avgWonValue)}</b></div><div><span>Average lost quote</span><b>${avgLostValue==null?'—':money(avgLostValue)}</b></div></div>`;
  const winBody=`<div class="analytics-rank"><div class="analytics-rank-row"><div class="analytics-rank-label"><b>Quotes won</b><small>${wonQuotes.length} of ${finalizedQuotes.length} finalized quotes</small></div><div class="analytics-rank-track"><div class="analytics-rank-fill" style="width:${winRateCount||0}%"></div></div><div class="analytics-rank-value"><b>${winRateCount==null?'—':winRateCount+'%'}</b></div></div><div class="analytics-rank-row"><div class="analytics-rank-label"><b>Quoted value won</b><small>${money(wonValue)} of ${money(finalizedValue)} finalized quoted value</small></div><div class="analytics-rank-track"><div class="analytics-rank-fill" style="width:${winRateValue||0}%"></div></div><div class="analytics-rank-value"><b>${winRateValue==null?'—':winRateValue+'%'}</b></div></div></div>${avgDealCompare}`;
  const winCard=card('Win performance','Compare win rate by quote count and by quoted value.',winBody,'','Are finalized wins concentrated in many smaller quotes or in larger quoted value?');

  const avgDiscountHeader=`<div class="analytics-inline-kpi"><span>Average discount given</span><b>${avgDiscount==null?'—':avgDiscount.toFixed(1)+'%'}</b><small>weighted by quoted value · vs Shopify list price</small></div>`;
  const discountCard=card('Discount & conversion','Finalized quote win rate by discount band relative to Shopify list price.',avgDiscountHeader+discountConversionBody,'','How does observed quote win rate vary across discount levels?');

  const priceRealizationBody=`<div class="analytics-mini-compare"><div><span>Shopify reference value</span><b>${money(referenceValue)}</b><small>list/base price × observed quantity</small></div><div><span>Realized sales</span><b>${money(sales)}</b><small>completed order value</small></div><div><span>Realized price delta</span><b>${deltaLabel}</b><small>${deltaPctLabel} vs reference · not margin</small></div><div><span>Revenue with active pricing intervention</span><b>${money(influencedRevenue)}</b><small>${Math.round(influencedShare)}% of completed sales</small></div></div>`;
  const priceRealization=card('Price realization','Reference price versus the commercial price actually realized on completed orders. The delta is a commercial price difference, not causal “revenue lost” or margin.',priceRealizationBody,'','How far did realized selling prices differ from Shopify reference prices, and how much revenue used an active pricing rule?');

  const priceRank=card('Sales by pricing','Rank the resolved pricing actually used on completed orders.',rankRows(pricingUsage,'revenue',10),'','Which pricing profiles actually appear on completed sales?');

  const priceDetail=card('Pricing performance','Compare sales, reference value, realized price delta and breadth of use by pricing profile.',pricingTable,'','How much business runs through each pricing profile, how far does its realized price differ from reference price, and how broadly is it used?');

  const tierEvents=quantityEvents.filter(e=>e.type==='tier_observed');
  const tierPolicies=[...new Set(tierEvents.map(e=>e.policy))].map(name=>{ const es=tierEvents.filter(e=>e.policy===name); const reached=es.filter(e=>e.reached); const near=es.filter(e=>e.near); const revenue=reached.reduce((a,e)=>a+e.orderValue,0); const discount=reached.length?reached.reduce((a,e)=>a+e.realizedDiscount,0)/reached.length:null; return {name,eligible:es.length,reached:reached.length,near:near.length,revenue,discount}; });
  const tierTable=`<div class="analytics-table-wrap"><table class="analytics-data-table"><thead><tr><th>Quantity pricing</th><th class="num">Eligible observations</th><th class="num">Reached tier</th><th class="num">Near threshold</th><th class="num">Revenue at tier</th><th class="num">Realized discount</th></tr></thead><tbody>${tierPolicies.map(r=>`<tr><td class="entity">${esc(r.name)}</td><td class="num">${r.eligible}</td><td class="num">${r.reached}</td><td class="num">${r.near}</td><td class="num">${money(r.revenue)}</td><td class="num">${r.discount==null?'—':r.discount.toFixed(1)+'%'}</td></tr>`).join('')||'<tr><td colspan="6">No quantity-rule observations in this scope.</td></tr>'}</tbody></table></div>`;
  const quantityBody=`<div class="analytics-mini-compare"><div><span>MOQ-blocked attempted value</span><b>${money(moqAttempted)}</b><small>${moqEvents.length} blocked attempt${moqEvents.length===1?'':'s'}</small></div><div><span>Buyers affected</span><b>${moqBuyers}</b></div><div><span>Later completed a purchase</span><b>${moqRecovered} / ${moqEvents.length||0}</b><small>observed after the blocked attempt</small></div></div>${tierTable}`;
  const quantityCard=card('Quantity rule performance','Observed demand around MOQ and quantity-tier rules. Near-threshold behavior is evidence to investigate, not a recommendation to change the tier.',quantityBody,'','Are MOQ and quantity thresholds blocking attempted demand, and how often do eligible orders reach or cluster near each tier?');

  let ruleChanges=analyticsPricingChanges.filter(r=>filterId==='all'||r.companyId===filterId);
  const ruleChangeTable=`<div class="analytics-table-wrap"><table class="analytics-data-table"><thead><tr><th>Date</th><th>Scope</th><th>Rule change</th><th class="num">Sales before</th><th class="num">Sales since</th><th class="num">AOV before</th><th class="num">AOV since</th><th class="num">Price delta before</th><th class="num">Price delta since</th></tr></thead><tbody>${ruleChanges.map(r=>`<tr><td>${r.date}</td><td>${esc(r.scope)}</td><td class="entity">${esc(r.rule)}<div class="muted">${esc(r.change)}</div></td><td class="num">${money(r.before.sales)}</td><td class="num">${money(r.after.sales)}</td><td class="num">${money(r.before.aov)}</td><td class="num">${money(r.after.aov)}</td><td class="num">${r.before.priceDelta.toFixed(1)}%</td><td class="num">${r.after.priceDelta.toFixed(1)}%</td></tr>`).join('')||'<tr><td colspan="9">No tracked pricing changes in this scope.</td></tr>'}</tbody></table></div>`;
  const ruleChangeCard=card('Pricing change outcomes','Observed commercial metrics before and after a pricing-rule edit. This is temporal comparison, not causal attribution.',ruleChangeTable,'','What happened to sales, order value and price realization after a commercial pricing rule changed?');

  const pricingView=`<section class="analytics-report">${priceRealization}<div class="analytics-grid-2">${priceRank}${priceSource}</div>${priceDetail}${quantityCard}${ruleChangeCard}</section>`;

  const views={overview,companies:companiesView,orders:ordersView,quotes:quotesView,pricing:pricingView};
  const section=views[state.appAnalyticsSection]?state.appAnalyticsSection:'overview';
  const options=`<option value="all" ${filterId==='all'?'selected':''}>All companies</option>`+db.companies.map(c=>`<option value="${c.id}" ${filterId===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
  const locationOptions=`<option value="all">All locations</option>`+scopedCompanies.flatMap(c=>(c.locations||[]).map(l=>`<option value="${c.id}::${esc(l.name)}" ${locationFilter===`${c.id}::${l.name}`?'selected':''}>${esc(l.name)}${selected?'':` · ${esc(c.name)}`}</option>`)).join('');
  const periodOptions=[['30','Last 30 days'],['60','Last 60 days'],['90','Last 90 days'],['9999','All available']].map(([v,l])=>`<option value="${v}" ${String(periodDays)===v?'selected':''}>${l}</option>`).join('');
  const compareOptions=[['none','No comparison'],['previous','Previous period']].map(([v,l])=>`<option value="${v}" ${comparisonMode===v?'selected':''} ${periodDays===9999&&v==='previous'?'disabled':''}>${l}</option>`).join('');
  const scopeText=selected?`Filtered to <b>${esc(selected.name)}</b>`:`Across <b>${db.companies.length}</b> managed companies`;
  const clear=(selected||locationFilter!=='all'||periodDays!==90||comparisonMode!=='none')?`<button class="clear-filter" data-action="analytics-clear-filters">Clear filters</button>`:'';
  return head('Analytics','Explore B2B performance across companies, orders, quotes and pricing — then drill into the underlying entities.')+`<div class="app-analytics workspace"><nav class="analytics-model-nav embedded" aria-label="App analytics sections"><button class="${section==='overview'?'active':''}" data-action="app-analytics-tab" data-analytics-tab="overview">Overview</button><button class="${section==='companies'?'active':''}" data-action="app-analytics-tab" data-analytics-tab="companies">Companies</button><button class="${section==='orders'?'active':''}" data-action="app-analytics-tab" data-analytics-tab="orders">Orders</button><button class="${section==='quotes'?'active':''}" data-action="app-analytics-tab" data-analytics-tab="quotes">Quotes</button><button class="${section==='pricing'?'active':''}" data-action="app-analytics-tab" data-analytics-tab="pricing">Pricing</button></nav><div class="app-analytics-filters"><div class="analytics-filter-field"><label>Date range</label><select data-app-analytics-period>${periodOptions}</select></div><div class="analytics-filter-field"><label>Compare to</label><select data-app-analytics-compare>${compareOptions}</select></div><div class="analytics-filter-field"><label>Company</label><select data-app-analytics-company>${options}</select></div><div class="analytics-filter-field"><label>Location</label><select data-app-analytics-location>${locationOptions}</select></div><div class="analytics-filter-context"><span>${scopeText}</span>${clear}</div></div>${views[section]}</div>`;
}

function pricingRows(){
  const q=(state.pricingSearch||'').trim().toLowerCase();
  let list=db.policies;
  if(state.pricingKind) list=list.filter(p=>kindOf(p)===state.pricingKind);
  if(state.pricingStatus) list=list.filter(p=>policyStatus(p).label===state.pricingStatus);
  if(state.pricingAudience) list=list.filter(p=>audienceOf(p)===state.pricingAudience);
  if(q) list=list.filter(p=>[p.name, kindName(kindOf(p)), p.type, scopeTypeLabel(p), audienceName(audienceOf(p))]
    .join(' ').toLowerCase().includes(q));
  const by={
    name:(a,b)=>a.name.localeCompare(b.name),
    /* Đếm mọi assignee, cùng con số mà quy tắc fork và cảnh báo shared đang dùng,
       nên ba chỗ không thể lệch nhau. */
    assigned:(a,b)=>policyUsageCount(a.id)-policyUsageCount(b.id) || a.name.localeCompare(b.name)
  };
  const out=[...list].sort(by[state.pricingSortField]||by.name);
  if(state.pricingSortDir==='desc') out.reverse();
  return out;
}

function newBuilder(p){
  /* Mở/đổi builder thì đóng mọi editor rule đang mở của builder trước. */
  state.ruleEdit=null; state.addRuleMenu=false; state.ruleEditError=false;
  /* ...và xoá lỗi validate còn sót từ lần Save trước. Không có dòng này thì lỗi kiểu
     "One pricing rule has no products selected yet" bám lại dù out ra vào lại builder
     mới (state.errors là global, exit không tự dọn). */
  clearErrors();
  if(p){
    const copy=JSON.parse(JSON.stringify(p));
    if(!copy.priceKind) copy.priceKind='base';
    if(copy.explicitEnabled===undefined) copy.explicitEnabled=Object.keys(copy.productAdjustments||{}).length>0;
    if(!Array.isArray(copy.conditionalRules)) copy.conditionalRules=[];
    if(copy.hasEndDate===undefined) copy.hasEndDate=copy.validityType==='dated';
    if(!copy.startTime) copy.startTime='12:00 AM';
    if(!copy.volumeRanges) copy.volumeRanges=[{id:'r1',from:1,to:9,valueType:'percentage',value:10},{id:'r2',from:10,to:49,valueType:'percentage',value:25}];
    if(!copy.quantityBasis) copy.quantityBasis='all_selected';
    if(!copy.volumeBasis) copy.volumeBasis='shopify';
    /* Audience nằm trên profile. Bản ghi viết trước khi có trường này thì suy từ
       nơi nó đang thực sự được gán, chứ không mặc định im lặng về B2B rồi biến một
       pricing đang chạy cho tag thành pricing của Company. */
    if(!AUDIENCE_KEYS.includes(copy.audienceType)){
      const u = copy.id ? policyUsage(copy.id) : null;
      copy.audienceType = (u && !u.companies.length &&
        (u.tags.length || u.customers.length || u.globals.length)) ? 'd2c' : 'b2b';
    }
    if(!Array.isArray(copy.b2bCompanyIds)) copy.b2bCompanyIds=[];
    if(!copy.customerTarget) copy.customerTarget=
      CUSTOMER_TARGET_KEYS.includes(copy.assignmentTargetType) ? copy.assignmentTargetType : 'none';
    delete copy.assignmentBuyerType; delete copy.assignmentTargetType;
    delete copy.assignmentTargetId; delete copy.assignmentMode;
    /* Open with whoever already holds this profile ticked. Otherwise the tree
       reads as empty and re-saving an existing pricing looks like it is
       assigned to nobody. */
    if(copy.id && audienceOf(copy)==='b2b'){
      copy.b2bCompanyIds=companiesHolding(copy.id, kindOf(copy));
      copy.b2bBaselineCompanyIds=[...copy.b2bCompanyIds];
      copy.b2bLocationIds=locationsHolding(copy.id, kindOf(copy));
      copy.b2bBaselineLocationIds=[...copy.b2bLocationIds];
      copy.b2bBaselineFor=copy.id;
    }
    if(!Array.isArray(copy.b2bLocationIds)) copy.b2bLocationIds=[];
    if(!Array.isArray(copy.assignmentTargetIds)) copy.assignmentTargetIds=[];
    /* Phía customer cũng phải mở ra với đúng những gì đang giữ nó, cùng lý do đã
       làm cho phía Company: mở ra trống thì lưu lại trông như chưa gán ai. */
    if(copy.id && audienceOf(copy)==='d2c' && customerTargetOf(copy)==='none'){
      const u=policyUsage(copy.id);
      if(u.tags.length){ copy.customerTarget='tags'; copy.assignmentTargetIds=u.tags.map(x=>x.id); }
      else if(u.customers.length){ copy.customerTarget='specific'; copy.assignmentTargetIds=u.customers.map(x=>x.id); }
    }
    /* Bên kia không được mang dữ liệu theo: profile chỉ phục vụ một phía. */
    if(audienceOf(copy)==='d2c'){ copy.b2bCompanyIds=[]; copy.b2bBaselineCompanyIds=[]; copy.b2bLocationIds=[]; copy.b2bBaselineLocationIds=[]; copy.b2bBaselineFor=null; }
    else { copy.customerTarget='none'; copy.assignmentTargetIds=[]; }
    if(!copy.marketScope) copy.marketScope='all';
    if(!copy.selectedMarkets) copy.selectedMarkets=['US'];
    if(!copy.appearanceTitle) copy.appearanceTitle='Wholesale pricing';
    if(!copy.appearanceLabel) copy.appearanceLabel='Special price';
    return copy;
  }
  /* No name until a pricing type is picked: a preset name made every
     kind-specific default below unreachable (`b.name || ...` never fired). */
  const fresh = {id:null,name:'',type:'Reusable',status:'Active',audienceType:'b2b',
    priceKind:null,priority:0,scopeType:'collection',collection:'Wholesale assortment',
    b2bCompanyIds:[],b2bLocationIds:[],customerTarget:'none',assignmentTargetIds:[],
    marketScope:'all',selectedMarkets:['US'],appearanceTitle:'Wholesale pricing',appearanceLabel:'Special price',
    selectedProducts:db.products.map(x=>x.sku),
    pricingRule:'decrease',valueType:'percentage',value:20,productAdjustments:{},explicitEnabled:false,conditionalRules:[],
    fallback:'quote',validityType:'evergreen',startDate:'2026-07-17',endDate:'2026-12-31',hasEndDate:false,startTime:'12:00 AM',
    volumeRanges:[{id:'r1',from:1,to:9,valueType:'percentage',value:10},{id:'r2',from:10,to:49,valueType:'percentage',value:25}],
    quantityBasis:'all_selected',volumeBasis:'shopify'};
  /* No model yet: Create pricing opens the pricing-model chooser.
     Company setup skips it by calling applyKindDefaults(b,'base'). */
  return fresh;
}

/* Defaults for each pricing model. Used by the pricing-model chooser, by the
   inline model switch, and by company setup which goes straight to Price list. */
/* Switching model must not destroy work. Each model keeps its own snapshot of
   the pricing fields, so Price list -> Volume -> Price list comes back intact. */
const KIND_FIELDS = ['scopeType','collection','selectedProducts','pricingRule','valueType',
  'value','productAdjustments','conditionalRules','volumeRanges','quantityBasis','volumeBasis'];

function switchKind(b, kind){
  if(b.priceKind === kind) return b;
  b._kindState = b._kindState || {};
  if(b.priceKind){
    const snap = {};
    KIND_FIELDS.forEach(f=>{ if(b[f] !== undefined) snap[f] = JSON.parse(JSON.stringify(b[f])); });
    b._kindState[b.priceKind] = snap;
  }
  const saved = b._kindState[kind];
  if(saved){ Object.keys(saved).forEach(f=>{ b[f] = JSON.parse(JSON.stringify(saved[f])); }); b.priceKind = kind; return b; }
  return applyKindDefaults(b, kind);
}

function applyKindDefaults(b, kind){
  const switched = !!b.priceKind && b.priceKind!==kind;
  /* Slots are per pricing type, so switching type means a different slot and a
     different set of Companies already holding this profile. */
  if(b && b.id && kind && b.priceKind!==kind){
    b.b2bCompanyIds=companiesHolding(b.id, kind);
    b.b2bBaselineCompanyIds=[...b.b2bCompanyIds];
    b.b2bLocationIds=locationsHolding(b.id, kind);
    b.b2bBaselineLocationIds=[...b.b2bLocationIds];
    b.b2bBaselineFor=b.id;
  }
  /* Each type owns pricingRule / valueType / scope. Switching type must reset
     them, not fill in blanks: a Price rule that kept the Price list's
     rule='set' read as "Set to $20.00" while behaving like a rule. Per-SKU
     prices written for a Price list are dropped for the same reason. */
  b.priceKind = kind;
  if(kind==='base'){
    if(!b.name) b.name='New base pricing';
    /* Không còn card Default price: base LUÔN giữ giá Shopify, mọi điều chỉnh giá đi
       qua rule (kể cả rule "All products" cho toàn bộ catalog). */
    b.pricingRule='keep'; b.valueType='percentage'; b.value=0;
    /* Base luôn = All products (3 tầng); thu hẹp bằng Collection/Product overrides. */
    b.scopeType='all'; b.selectedProducts=db.products.map(p=>p.sku);
    if(!Array.isArray(b.conditionalRules)) b.conditionalRules=[];
  }
  if(kind==='quantity'){
    if(!b.name) b.name='New quantity pricing';
    if(switched || !b.scopeType) b.scopeType='all';
    if(switched || b.pricingRule==='set'){ b.pricingRule='decrease'; b.valueType='percentage'; b.value=10; }
  }
  return b;
}
const builderProducts = b => (kindOf(b)==='base' || b.scopeType==='all') ? db.products : db.products.filter(p=>(b.selectedProducts||[]).includes(p.sku));

function previewBlock(b){
  const p = builderProducts(b)[0];
  if(!p) return `<div class="preview"><div class="preview-cap">Preview</div><span class="dim">Pick a product first.</span></div>`;
  const out = priceFor(b, p);
  const diff = out - p.list;
  const pct = p.list ? (diff/p.list*100) : 0;
  return `<div class="preview">
    <div class="preview-cap">Preview · ${p.title} (${p.sku})</div>
    <div class="preview-price">
      <span class="was">${money(p.list)}</span> →
      <span class="now">${money(out)}</span>
      <span class="delta">${diff===0?'no change':`${diff<0?'off ':'up '}${money(Math.abs(diff))} · ${pct>0?'+':''}${pct.toFixed(1)}%`}</span>
    </div>
  </div>`;
}

/* Companies only. Pricing is never assigned to a single Location in this
   version, so the target list has no second level. */
/* Dòng phụ trả lời đúng câu hỏi của màn này: tick vào thì slot của **loại pricing
   đang gán** ở Company đó sẽ ra sao. Trước đây nó in trạng thái resolve tổng thể —
   "Company pricing · 2 types" — vừa thừa (đang ở phía Company thì tất nhiên là
   Company pricing) vừa đổi cách nói theo số lượng, và không nói gì về cái sắp bị
   thay. */
function b2bAssignmentTree(context, kind){
  const nodes=[];
  const setup=currentSetupCompanyNode(context);
  if(setup) nodes.push(setup);
  db.companies.forEach(company=>{
    const locs = `${company.locations.length} Location${company.locations.length===1?'':'s'}`;
    let held;
    if(kind==='base'){ const n=companyBaseEntries(company).length; held = n?`${n} base pricing${n===1?'':'s'}`:'No base pricing'; }
    else if(kind){ const q=policyById(companyPricing(company).quantity); held = q?q.name:`No ${kindName(kind).toLowerCase()}`; }
    nodes.push({
      type:'company', id:company.id, title:company.name,
      meta: kind ? `${locs} · ${held}` : locs
    });
    /* Location con: gán per-location (override company slot). */
    (company.locations||[]).forEach(l=>{
      const lHeld = kind ? policyById((l.pricing||{})[kind]) : null;
      nodes.push({
        type:'location', id:l.id, companyId:company.id, title:l.name,
        meta: kind ? (lHeld ? lHeld.name : `Inherits company`) : ''
      });
    });
  });
  return nodes;
}
function prefillAssignmentFromContext(b,context){
  if(!context) return b;
  b.assignmentTargetIds=[];
  b.b2bCompanyIds=[];
  b.b2bLocationIds=[];

  /* Luồng mở ra đã quyết định phía phục vụ, nên audience khoá theo nó. */
  if(context.type==='company_setup'){ b.audienceType='b2b'; b.b2bCompanyIds=['__setup_company__']; }
  if(context.type==='assignment'){
    const a=context.assign||{};
    if(a.targetType==='company'){ b.audienceType='b2b'; b.b2bCompanyIds=[a.companyId].filter(Boolean); }
    if(a.targetType==='customer'){

      else { b.customerTarget='specific'; b.assignmentTargetIds=[a.customerId].filter(Boolean); }
    }
    if(a.targetType==='customer_group'){ b.audienceType='d2c'; b.customerTarget='tags'; b.assignmentTargetIds=[a.groupId].filter(Boolean); }
  }
  return b;
}

function openCompanyPicker(){

  const q = (state.companyPickerSearch||'').trim().toLowerCase();

     chính nó khớp hoặc company cha khớp — để cây không đứt giữa chừng. */
  const compMatch = {};
  nodes.forEach(n=>{ if(n.type==='company') compMatch[n.id]=hit(n); });
  nodes.forEach(n=>{ if(n.type==='location' && hit(n)) compMatch[n.companyId]=true; });
  const rows = nodes.filter(n=> n.type==='company' ? compMatch[n.id] : (hit(n) || compMatch[n.companyId]));

  const rowHtml = n => {

    const coveredByCompany = cChosen.includes(n.companyId);

      <span class="grow"><span class="m-name" style="font-weight:500">↳ ${esc(n.title)}</span>

      <span class="badge">${coveredByCompany?'Covered by company':'Location'}</span>

  if(lChosen.length) sumParts.push(`${lChosen.length} Location${lChosen.length===1?'':'s'}`);

    <div class="multi-list">
      ${rows.length?rows.map(rowHtml).join('')
      :`<div class="pl-empty" style="border:0">Nothing matches that search.</div>`}
    </div>`,
    `<button class="btn" data-close-modal>Cancel</button>
     <button class="btn primary" data-action="company-picker-done">Done</button>`);
}

function companiesHolding(policyId, kind){
  if(!policyId || !kind) return [];
  return db.companies.filter(c=> kind==='base' ? companyHasBase(c,policyId) : companyPricing(c).quantity===policyId).map(c=>c.id);
}
/* Locations đang override tới profile này (cho kind tương ứng). */
function locationsHolding(policyId, kind){
  if(!policyId || !kind) return [];
  const ids=[];
  db.companies.forEach(c=>c.locations.forEach(l=>{ if((l.pricing||{})[kind]===policyId) ids.push(l.id); }));
  return ids;
}
/* Tìm location theo id trên toàn bộ companies. */
function findLocation(id){
  for(const c of db.companies){ const l=(c.locations||[]).find(x=>x.id===id); if(l) return {company:c, location:l}; }
  return null;
}
/* Location row trong picker đang giữ gì cho kind này. */
function locRowState(b, locId){
  const kind=builderKind(b), f=findLocation(locId);
  if(!kind || !f) return {holdsThis:false, other:null};
  const held=(f.location.pricing||{})[kind];
  return {holdsThis: !!b.id && held===b.id, other: (held && held!==b.id) ? policyById(held) : null};
}
const builderKind = b => b && b.priceKind ? kindOf(b) : null;

/* THE FORK RULE, in one place so the banner and the save button cannot drift:
   a pricing held by two or more Companies is shared, so editing it from one of
   them forks into a new pricing for that Company. Held by a single Company it
   is that Company's own pricing and the edit lands in place — forking there
   would just breed duplicates. Counted in Companies, not in assignments: a tag
   or a customer also using it does not make it a template. */
/* Đếm theo **mọi** assignee, không riêng Company: giờ một profile gán được cho cả
   Company lẫn customer, nên một tag hay một customer đang dùng cũng là người ngoài.
   Đếm theo Company như trước sẽ âm thầm đổi giá phía customer khi sửa từ Company. */
function otherAssigneeCount(b, company){
  if(!b || !b.id) return 0;
  const u=policyUsage(b.id);
  const mine = (company && u.companies.some(c=>c.id===company.id)) ? 1 : 0;
  return u.count - mine;
}
const editForksForCompany = (b, company) => !!(company && b && b.id && otherAssigneeCount(b, company) > 0);

/* Fork từ một Location: sửa in-place chỉ an toàn khi profile CHỈ được location này
   dùng (không company/customer/tag assignee nào, không location khác override tới).
   Ngược lại (thường gặp: đang inherit từ company) → fork ra một profile riêng cho
   location này, để không đổi giá của company/sibling locations/khách khác. */
function editForksForLocation(b, company, location){
  if(!b || !b.id || !company || !location) return false;
  const u = policyUsage(b.id);
  const mineLoc = u.locations.filter(x=>x.companyId===company.id && x.id===location.id).length;
  return (u.count - mineLoc) > 0;   // profile còn ai khác dùng ngoài location này → fork
}

/* What ticking or unticking a row will actually do to that Company. */
function b2bRowState(b, companyId){
  const kind=builderKind(b), c=companyById(companyId);
  if(!kind || !c) return {holdsThis:false, other:null};
  /* Base stacks, so there is no profile it "replaces" — a company either
     already holds this base or does not. Quantity keeps its single slot. */
  if(kind==='base') return {holdsThis: !!b.id && companyHasBase(c, b.id), other:null};
  const held=companyPricing(c).quantity;
  return {holdsThis: !!b.id && held===b.id, other: (held && held!==b.id) ? policyById(held) : null};
}

/* The tree is the full list of Companies that get this pricing, not an
   "add more" box — so both directions have consequences worth stating. */
function b2bAssignmentImpact(b){
  if(!(b.b2bCompanyIds||[]).length && !(b.b2bBaselineCompanyIds||[]).length) return '';
  const kind=builderKind(b); if(!kind) return '';
  const sel=b.b2bCompanyIds||[], base=b.b2bBaselineCompanyIds||[];
  /* Base stacks (adds alongside), so it never replaces anything — only the
     single quantity slot can. */
  const replaces=kind==='base' ? [] : sel.map(id=>{
    const c=companyById(id); if(!c) return null;
    const held=policyById(companyPricing(c).quantity);
    return (held && held.id!==b.id) ? `${c.name} (${held.name})` : null;
  }).filter(Boolean);
  const removes=base.filter(id=>!sel.includes(id)).map(id=>companyById(id)?.name).filter(Boolean);
  if(!replaces.length && !removes.length) return '';
  const label=kindName(kind).toLowerCase();
  return `<div class="banner warning" style="margin-top:8px"><div>
    ${replaces.length?`<b>${replaces.length} selected Compan${replaces.length===1?'y':'ies'} already ${replaces.length===1?'has':'have'} a different ${label}</b>Saving replaces it for ${replaces.join(', ')}.`:''}
    ${removes.length?`<b>${removes.length} Compan${removes.length===1?'y':'ies'} will lose this pricing</b>Unticking removes it from ${removes.join(', ')}. That ${label} slot goes back to Not set.`:''}
  </div></div>`;
}

/* Đếm theo đúng phía profile phục vụ. Cộng cả hai bên chỉ đúng khi một profile
   gán được cho cả hai, và đó chính là điều vừa bị bỏ. */
function assignmentTargetCount(b){
  return audienceOf(b)==='d2c' ? customerAssignmentCount(b) : b2bAssignmentCount(b);

const customerTargetLabel = t => (CUSTOMER_TARGETS.find(x=>x[0]===t)||[,'Customers'])[1];
function customerAssignmentSummary(b){
  const t=customerTargetOf(b), n=customerAssignmentCount(b);
  if(t==='none') return 'None';
  if(AUDIENCE_TARGETS.includes(t)) return customerTargetLabel(t);
  if(t==='specific') return n?`${n} customer${n===1?'':'s'}`:'None selected';
  if(t==='tags') return n?`${n} tag${n===1?'':'s'}`:'None entered';
  return 'None';
}
function assignmentTargetSummary(b){
  if(!assignmentTargetCount(b)) return 'Not assigned';
  return audienceOf(b)==='d2c' ? customerAssignmentSummary(b) : b2bAssignmentSummary(b);
}

              <span><span class="r-title">${d[1]}</span>
                ${d[0]==='tags' && ct==='tags' ? tagTokenField(b.assignmentTargetIds||[],'builder') : ''}
                ${d[0]==='specific' && ct==='specific' ? customerPickerField(b.assignmentTargetIds||[]) : ''}</span>
            </label>`).join('')}
          </div>

        </div>

    ${assignmentTargetCount(b)===0?`<div class="inline-note" style="margin-top:8px">No buyer selected yet. Saving adds this to the Pricing library without changing any price. Assign it later from Pricing.</div>`:''}
  </div>`;

function discountExecutionIssues(b){
  const issues=[];
  const products=builderProducts(b);

  const validateRule=(rule,valueType,value,product,label)=>{
    const amount=Number(value||0);
    if(rule==='increase') issues.push(`${label} increases the Shopify price. This pricing cannot increase the Shopify price.`);
    /* Giảm quá 100% → giá âm, không phụ thuộc product. */
    if(rule==='decrease' && valueType==='percentage' && amount>100) issues.push(`${label} discount of ${amount}% is more than 100%, which would make the price negative.`);
    if(rule==='set' && product && amount>Number(product.list)) issues.push(`${label} sets ${money(amount)}, above Shopify price ${money(product.list)}.`);
    if(rule==='decrease' && valueType==='amount' && product && amount>Number(product.list)) issues.push(`${label} discount ${money(amount)} is greater than Shopify price ${money(product.list)}.`);
  };

  if(b.priceKind==='base'){
    /* Mọi pricing đều là rule (kể cả "All products"): rule chạy qua cùng một cửa —
       không được đẩy giá lên trên Shopify price, không giảm quá 100%. */
    (b.conditionalRules||[]).forEach((r,ri)=>{
      const base=`Rule ${ri+1} (${ruleTypeLabel(r)})`;
      validateRule(r.rule, r.valueType, r.value, null, base);
      products.filter(pr=>ruleMatches(r,pr)).forEach(pr=>validateRule(r.rule, r.valueType, r.value, pr, `${base} on ${pr.sku}`));
    });
  }
  Object.entries(b.productAdjustments||{}).forEach(([sku,rule])=>{
    validateRule(rule.rule,rule.valueType,rule.value,productBySku(sku),sku);
  });
  if(b.priceKind==='quantity'){
    (b.volumeRanges||[]).forEach((range,index)=>{
      if(range.valueType==='amount'){
        products.forEach(product=>{
          if(Number(range.value||0)>Number(product.list)) issues.push(`Volume range ${index+1} discount is greater than ${product.sku}'s Shopify price.`);
        });
      }
    });
  }
  return [...new Set(issues)];
}

       on the catch-all base shows "Base price". */
    let decided, badge;

  const count = q ? `${rows.length} of ${all.length} products` : `${all.length} product${all.length!==1?'s':''}`;
  const table = `<div class="rp-scroll"><table class="rp-table">
      <thead><tr><th>Product</th><th class="num">Shopify price</th><th>Decided by</th><th class="num">Buyer pays</th><th class="num">Off</th></tr></thead>

/* Bảng resolve: Shopify price, adjustment, explicit price, giá cuối. Merchant đọc được
   giá cuối đến từ đâu mà không phải học thứ tự ưu tiên. */
function resolutionPreview(b){
  /* Ví dụ minh hoạ: ưu tiên lớp cụ thể nhất đang dùng (Product override → Rule →
     Base); trong lớp đó chọn sản phẩm bị đổi giá MẠNH NHẤT để hiệu ứng rõ nhất
     (thay vì lấy "cái đầu danh sách"). */
  const scope = builderProducts(b);
  if(!scope.length) return '';
  const drop = x => Number(x.list) - (priceFor(b,x) ?? Number(x.list));   // Shopify − khách trả
  const deepest = list => list.reduce((a,c)=> drop(c) > drop(a) ? c : a);
  const overrides = scope.filter(x=>priceTierFor(b,x.sku)==='product');
  const rules     = scope.filter(x=>priceTierFor(b,x.sku)==='rule');
  const p = overrides.length ? deepest(overrides)
          : rules.length     ? deepest(rules)
          : deepest(scope);
  const tier = priceTierFor(b, p.sku);
  const cr = matchConditionalRule(b, p);
  const ex = explicitOn(b) ? (b.productAdjustments||{})[p.sku] : null;
  const crPrice = cr ? applyAdjustment(cr.rule, cr.valueType||'percentage', cr.value, p.list) : null;
  const exPrice = (ex&&ex.rule) ? applyAdjustment(ex.rule, ex.valueType||'amount', ex.value, p.list) : null;
  const fin = priceFor(b,p);
  const row=(k,v,active,dim)=>`<div class="summary-item"${active?' style="background:var(--sunken);margin:0 -8px;padding:6px 8px;border-radius:7px"':''}>
    <span${active?' style="color:var(--text-strong)"':(dim?' style="color:var(--text-dim)"':'')}>${k}</span>
    <b${active?'':' style="font-weight:450;color:var(--text-sub)"'}>${v}</b></div>`;
  return `<div class="soft-card"><div class="rp-panel-head"><h3>How the price resolves</h3><button class="btn small" data-action="preview-all-prices">Preview all</button></div>
    <div class="muted" style="margin:-4px 0 8px">${esc(p.title)} <span class="mono">${p.sku}</span></div>
    <div class="summary-list">
      ${row('Shopify price', money(p.list), false, tier!=='base')}
      ${cr?row(`Rule ${(b.conditionalRules||[]).indexOf(cr)+1}`, crPrice!=null?money(crPrice):'-', tier==='rule', tier==='product'):''}
      ${ex?row('Product override', exPrice!=null?money(exPrice):'-', tier==='product', false):''}
      <div class="summary-item" style="border-top:1px solid var(--border);padding-top:8px">
        <span style="color:var(--text-strong)">Buyer pays</span><b>${fin!=null?money(fin):'-'}</b></div>
    </div>
  </div>`;
}

/* Tầng 2 — Pricing rules. Mỗi rule là MỘT dimension độc lập (Collection / Vendor /
   Product tag / Product type) + nhiều value (chip, "is any of"). Không còn Advanced
   / IF-THEN / Match all-any: muốn giao 2 thuộc tính thì... không — model cố tình
   giữ rule độc lập cho dễ đọc. Chọn LOẠI từ "+ Add rule ▾", cấu hình bằng chip.
   Rule KHỚP ĐẦU TIÊN (trên→dưới) thắng — thứ tự là priority, kéo ↑↓ để đổi. */
function ruleBuilderCard(b){
  const rules = b.conditionalRules = b.conditionalRules||[];
  const editing = ri => state.ruleEdit===ri;
  const APPLY = {
    collection:'Apply to these collections',
    vendor:'Apply to these vendors',
    productType:'Apply to these product types',
    tag:'Apply to products with any of these tags'
  };
  const NOUN = {collection:'collection', vendor:'vendor', productType:'product type', tag:'tag'};

  /* Ô chip: value đã chọn + một select để thêm value còn lại. */
  const chipField = (ri, c) => {
    const f=condField(c.field), vals=condValues(c), noun=NOUN[c.field];
    const remaining=(f.values()||[]).filter(v=>!vals.includes(v));
    return `<div class="chip-field">
      ${vals.map((v,vi)=>`<span class="chip">${esc(v)}<button class="chip-x" data-action="cr-remove-value" data-idx="${ri}.0.${vi}" aria-label="Remove ${esc(v)}">×</button></span>`).join('')}
      ${remaining.length
        ? `<select class="chip-add" data-cr-addval="${ri}.0">
            <option value="">${vals.length?`+ Add ${noun}…`:`Select ${noun}…`}</option>
            ${remaining.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}
          </select>`
        : `<span class="dim" style="font-size:12px;padding:2px 4px">All ${noun}s added</span>`}
    </div>`;
  };

  const priceRow = (ri, r) => {
    const rk = r.rule==='set' ? 'set' : (r.valueType==='amount' ? 'decrease_amt' : 'decrease_pct');
    const suffix = rk==='decrease_pct'?'%':'$';
    return `<div class="price-row">
      <select data-cr-rule="${ri}">
        <option value="decrease_pct" ${rk==='decrease_pct'?'selected':''}>Decrease by %</option>
        <option value="decrease_amt" ${rk==='decrease_amt'?'selected':''}>Decrease by amount</option>
        <option value="set" ${rk==='set'?'selected':''}>Fixed price</option>
      </select>
      <div style="position:relative;flex:1">
        <input type="number" step="0.01" min="0" ${rk==='decrease_pct'?'max="100"':''} data-cr-adjval="${ri}" value="${r.value ?? ''}" placeholder="Value">
        <span class="field-suffix">${suffix}</span>
      </div>
    </div>`;
  };

  /* Editor gọn: tên loại + ô chip "Apply to…" + Price + Done. Không jargon. */
  const editor = (ri, r) => {
    const c = (r.conditions=r.conditions||[])[0] || (r.conditions[0]={field:'collection',operator:'is',values:[]});
    const nProd = db.products.filter(p=>ruleMatches(r,p)).length;
    const isAll = c.field==='all';
    return `<div class="loc-block editing"><div class="loc-body rule-edit" style="padding:16px">
      <div class="rule-edit-head">
        <span class="rule-type-tag">${RULE_TYPE_LABEL[c.field]||'Rule'}</span>
        <span class="hint">${nProd} product${nProd===1?'':'s'} match</span>
        <button class="btn small icon critical" data-action="remove-rule" data-idx="${ri}" title="Delete rule" aria-label="Delete rule">${ICON.del}</button>
      </div>
      ${isAll
        ? `<div class="form-field"><label>Applies to</label>
            <div class="hint" style="margin-top:0">Every product in this price list.</div></div>`
        : `<div class="form-field"><label>${APPLY[c.field]}</label>${chipField(ri,c)}
        ${state.ruleEditError && !condValues(c).length
          ? `<div class="field-error" role="alert">Pick at least one ${NOUN[c.field]} for this rule, or delete it.</div>` : ''}</div>`}
      <div class="form-field" style="margin-bottom:0"><label>Price</label>${priceRow(ri,r)}</div>
      <div class="editor-footer">
        <span></span>
        <button class="btn small primary" data-action="rule-done" data-idx="${ri}">Done</button>
      </div>
    </div></div>`;
  };

  /* Hàng thu gọn — drag handle · "Rule N" + subtext · badge giảm giá · Edit/Xóa.
     Reorderable bằng kéo-thả (chuẩn Shopify Polaris) thay cho nút ↑↓. */
  const collapsed = (ri, r) => {
    const disc = ruleAdjustmentLabel(r);
    const tone = (r.rule!=='set' && r.value) ? 'success' : '';
    const vsum = ruleValuesSummary(r);
    const sub = `${ruleTypeLabel(r)}${vsum && vsum!=='Every product'?` · ${esc(vsum)}`:''}`;
    return `<div class="loc-block rule-drag-row" data-rule-drag="${ri}">
      <div class="loc-body rule-row" style="display:flex;align-items:center;gap:10px;padding:10px 12px">
        <span class="drag-handle" draggable="true" data-rule-grip title="Drag to reorder" aria-label="Drag to reorder">${ICON.grip}</span>
        <div style="flex:1;min-width:0">
          <div class="cell-main">Rule ${ri+1}</div>
          <div class="cell-sub">${sub}</div>
        </div>
        <span class="badge ${tone}" style="flex:none">${disc}</span>
        <div style="display:flex;align-items:center;gap:4px;flex:none">
          <button class="btn small" data-action="edit-rule" data-idx="${ri}">Edit</button>
          <button class="btn small icon critical" data-action="remove-rule" data-idx="${ri}" title="Delete rule" aria-label="Delete rule">${ICON.del}</button>
        </div>
      </div>
    </div>`;
  };

  const rows = rules.map((r,ri)=> editing(ri) ? editor(ri,r) : collapsed(ri,r)).join('');

  const TYPES = [['all','All products'],['collection','Collection'],['vendor','Vendor'],['tag','Product tag'],['productType','Product type']];
  /* Menu mở LÊN TRÊN vì nút "+ Add rule" giờ nằm ở đáy card (trong empty state khi
     chưa có rule, hoặc dưới danh sách khi đã có rule) — không còn ở góc trên nữa. */
  /* "All products" phủ toàn bộ catalog nên chỉ có nghĩa MỘT lần — thêm lần hai cũng
     bị first-match che, chỉ gây rối. Có rồi thì disable mục đó trong menu. */
  const hasAll = rules.some(r=>((r.conditions||[])[0]||{}).field==='all');
  const menu = state.addRuleMenu ? `<div class="add-rule-menu up">
    ${TYPES.map(t=>{
      const dis = t[0]==='all' && hasAll;
      return `<button data-action="add-rule-type" data-field="${t[0]}" ${dis?'disabled':''}>${t[1]}${dis?'<span class="menu-added">Added</span>':''}</button>`;
    }).join('')}
  </div>` : '';
  const addRuleControl = `<div class="add-rule-wrap">
      <button class="btn small" data-action="toggle-add-rule-menu">+ Add rule ▾</button>
      ${menu}
    </div>`;

  return `<div class="soft-card">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
      <h3 style="margin:0;flex:1">Pricing rules ${rules.length?`<span class="badge">${rules.length}</span>`:''}</h3>
    </div>
    <div class="muted" style="margin:-2px 0 10px">Price all products or a set by collection, vendor, tag or type. When several rules match one product, the higher rule wins — drag the handle to reorder.</div>
    ${errorLine('rule')}
    ${rows
      ? `${rows}<div class="add-rule-bar">${addRuleControl}</div>`
      : `<div class="pl-empty" style="margin:0"><b>No pricing rules</b><span>Every product keeps its Shopify price. Add an “All products” rule to price the whole catalog, or a narrower rule for a subset.</span><div class="add-rule-empty">${addRuleControl}</div></div>`}
  </div>`;
}

function renderBuilder(){
  const b = state.builder;
  const context = state.priceCreateContext;
  const usage = b.id ? policyUsageCount(b.id) : 0;
  const scopeCompany = state.editScopeCompanyId ? companyById(state.editScopeCompanyId) : null;
  const scopeLocation = state.editScopeLocationId && scopeCompany ? locationById(scopeCompany, state.editScopeLocationId) : null;
  const scopeName = scopeLocation ? scopeLocation.name : (scopeCompany ? scopeCompany.name : '');

  const contextLabel=currentTargetLabel(context);


  if(assignmentLocked(b,context)) prefillAssignmentFromContext(b,context);
  const settingsMain = !b.priceKind ? choosePricingTypeView() : (
    b.priceKind==='quantity' ? quantityEditor(b) : baseEditor(b)
  );
  const main = state.pricingBuilderTab==='appearance' && b.priceKind ? appearanceEditor(b) : settingsMain;

  /* Two flows, decided by where the editor was opened from, not by a question
     at save time. From Pricing the pricing itself is the subject and the change
     is global. From a Company the subject is that Company, so a shared pricing
     forks instead of dragging everyone else along. */
  const forksOnSave = scopeLocation
    ? editForksForLocation(b, scopeCompany, scopeLocation)
    : editForksForCompany(b, scopeCompany);
  const sharedNotice = forksOnSave
    ? `<div class="banner warning"><div>
        <b>This change applies to ${esc(scopeName)} only</b>
        ${esc(b.name)} is assigned to ${policyUsageLabel(b.id)}. Saving creates a separate pricing for ${esc(scopeName)} and leaves everyone else on ${esc(b.name)} unchanged. To change it for all of them, open it from Pricing instead.
      </div></div>`
    : (usage>1
      ? `<div class="banner warning"><div><b>${usage} assignments use this price</b>Saving updates all of them. Preview first if you're unsure.</div></div>`
      : '');

  const body = `
    ${b.priceKind?`${usage>1?`<div class="switch-row" style="margin-bottom:8px"><span class="token">Used by ${usage} assignments</span>${
        scopeName?`<span class="dim" style="font-size:12px">Opened from ${esc(scopeName)}</span>`:''}</div>`:''}
    <div class="builder-tabs"><button class="builder-tab ${state.pricingBuilderTab==='settings'?'active':''}" data-action="builder-tab-settings">Settings</button><button class="builder-tab ${state.pricingBuilderTab==='appearance'?'active':''}" data-action="builder-tab-appearance">Appearance</button></div>`:''}
    ${main}
    ${sharedNotice}`;

  const builderTitle=b.id ? `Edit pricing: ${esc(b.name)}` : 'Create pricing';
  const saveLabel=b.id
    ? 'Save and update accounts'
    : (context && isContextAssignmentSelected(b,context) ? 'Create and continue' : 'Create pricing');
  openDrawer(builderTitle,body,
    `<button class="btn" ${context?'data-action="cancel-context-price"':'data-close-drawer'}>${context?'Back to setup':'Cancel'}</button>
     <button class="btn primary" data-action="save-price" ${!b.priceKind?'disabled':''}>${saveLabel}</button>`,true);
}

function runSavePrice(){
    const back = state.builder._returnTo;
    delete state.builder._kindState; delete state.builder._assignSide; delete state.builder._returnTo;
    const b=state.builder;
    const context=state.priceCreateContext;
    if(!b.priceKind) return toast('Choose a pricing type first.');
    b.validityType=b.hasEndDate?'dated':'evergreen';
    const useSetupTarget=isContextAssignmentSelected(b,context);
    const setupCompanySelected=selectedSetupCompany(b);

    /* Every field is checked in one pass, so the merchant sees all of what is
       wrong at once instead of fixing one thing and being told the next. */
    const errs={};
    if(!String(b.name||'').trim()) errs.name='Give this pricing a name.';
    /* Explicit price luôn là giá cuối theo product, nên chuẩn hoá về set/amount. */
    if(b.priceKind==='base'){
      Object.keys(b.productAdjustments||{}).forEach(sku=>{ b.productAdjustments[sku].rule='set'; b.productAdjustments[sku].valueType='amount'; });
      state.addRuleMenu=false;
      /* Rule chưa chọn value nào là rule dở dang. KHÔNG âm thầm xoá (user tưởng mình
         đã thêm rule mà tự nhiên mất): chặn Save, mở đúng rule đó lên và báo lỗi. */
      const incompleteIdx=(b.conditionalRules||[]).findIndex(r=>!condValues((r.conditions||[])[0]).length);
      if(incompleteIdx>=0){
        errs.rule='One pricing rule has no products selected yet. Pick at least one value for it, or remove the rule.';
        state.ruleEdit=incompleteIdx; state.ruleEditError=true;
      } else { state.ruleEdit=null; state.ruleEditError=false; }
      /* Không adjustment và cũng không product nào có giá riêng thì profile này
         không đổi giá của ai, dù nó đọc như một pricing. */
      const explicitCount = explicitOn(b) ? Object.keys(b.productAdjustments||{}).length : 0;
      /* Không rule thật (kể cả "All products") và cũng không product nào có giá riêng
         thì profile này không đổi giá của ai, dù nó đọc như một pricing. */
      const activeConditionalCount = (b.conditionalRules||[]).filter(validConditionalRule).length;
      if(!explicitCount && !activeConditionalCount)
        errs.products='This pricing changes nothing yet. Add a pricing rule, or give at least one product its own price.';
    }
    const executionIssues=discountExecutionIssues(b);
    if(executionIssues.length && !errs.rule) errs.rule=executionIssues[0];
    if(Object.keys(errs).length){
      setErrors(errs);
      state.openSections={...state.openSections,1:true,2:true};
      return renderBuilder();
    }
    clearErrors();

    /* Pricing dựng trong luồng setup là draft: không bản ghi, không id, không ai
       tham chiếu được cho tới khi Company được ghi ở bước cuối. */
    if(context?.type==='company_setup' && useSetupTarget && !b.id){
      const kind=kindOf(b), ref=DRAFT_PREFIX+kind;
      if(b.draftKind && b.draftKind!==kind){
        delete state.companySetupDrafts[b.draftKind];
        if(state.companySetupPolicyByKind[b.draftKind]===DRAFT_PREFIX+b.draftKind)
          state.companySetupPolicyByKind[b.draftKind]=null;
      }
      b.draftKind=kind;
      state.companySetupDrafts[kind]=b;
      const inSlot = state.companySetupPolicyByKind[kind]===ref;
      state.companySetupPricingMode='existing';
      if(inSlot){ state.companySetupAddKind=null; state.companySetupDraftPolicy=null; state.companySetupDraftIsNew=false; }
      else { state.companySetupAddKind=kind; state.companySetupDraftPolicy=ref; state.companySetupDraftIsNew=true; }
      syncSetupPolicySelections();
      state.companySetupStep=3;
      state.priceCreateContext=null;
      closeDrawer();
      toast(inSlot ? 'Pricing updated' : 'Pricing ready');
      return openShopifyCompanySetup(3);
    }

    let savedPolicy=null;
    const wasNew=!b.id;

    if(b.id){
      const i=db.policies.findIndex(p=>p.id===b.id);
      db.policies[i]=Object.assign(db.policies[i],b);
      savedPolicy=db.policies[i];
    } else {
      b.id=demoId('p');
      b.status='Active';
      db.policies.push(b);
      savedPolicy=b;
    }

    const assignmentResult=executeBuilderAssignment(b,savedPolicy.id);
    /* Created from a base "Change": the new base replaces the one being swapped
       out on that company (order follows the new pricing's own Priority field). */
    if(context?.type==='assignment' && context.assign?.swapBase && context.assign.targetType==='company'){
      const sco=companyById(context.assign.companyId), swapId=context.assign.swapBase;
      if(sco && swapId!==savedPolicy.id) removeCompanyBase(sco, swapId);
    }
    /* Forking a shared base for specific companies REPLACES the source base on
       each of them — the fork is that company's own copy, not a second base. */
    if(wasNew && b.b2bBaselineFor && b.b2bBaselineFor!==savedPolicy.id && kindOf(savedPolicy)==='base'){
      (b.b2bCompanyIds||[]).forEach(cid=>{ const fc=companyById(cid); if(fc) removeCompanyBase(fc, b.b2bBaselineFor); });
    }
    /* Location fork: gán profile mới vào slot pricing của đúng location (override). */
    if(state.forkToLocation){
      const {companyId, locationId, kind}=state.forkToLocation;
      const fco=companyById(companyId), fl=fco&&locationById(fco, locationId);
      if(fl){ if(!fl.pricing) fl.pricing={base:null,quantity:null}; fl.pricing[kind]=savedPolicy.id; }
      state.forkToLocation=null;
    }
    state.priceCreateContext=null;
    closeDrawer();

    if(context?.type==='company_setup' && useSetupTarget){
      const savedKind=kindOf(savedPolicy);
      /* Creating a pricing here is the same move as picking an existing one:
         it becomes the selection, and Save is what puts it in the Company's
         slot. Committing it on the way back made the wizard show Remove for
         something the merchant had never agreed to add. Editing a pricing that
         is already in the slot stays in the slot. */
      const alreadyInSlot = state.companySetupPolicyByKind[savedKind]===savedPolicy.id;
      if(setupCompanySelected){
        state.companySetupPricingMode='existing';
        if(alreadyInSlot){ state.companySetupAddKind=null; state.companySetupDraftPolicy=null; state.companySetupDraftIsNew=false; }
        else { state.companySetupAddKind=savedKind; state.companySetupDraftPolicy=savedPolicy.id; state.companySetupDraftIsNew=true; }
        syncSetupPolicySelections();
      }
      syncSetupPolicySelections();
      state.companySetupStep=3;
      /* The "review it, then Save" half was an instruction, and the screen it
         returns to already shows the pricing under a New heading with Save and
         Discard beside it. */
      toast(alreadyInSlot ? 'Pricing updated' : 'Pricing created');
      return openShopifyCompanySetup(3);
    }

    if(back?.view==='company' && companyById(back.id)){
      state.selectedCompany=back.id; state.companyTab='pricing'; state.view='company';
    } else if(back?.view==='location' && companyById(state.selectedCompany)
              && locationById(companyById(state.selectedCompany), state.selectedLocation)){
      state.view='location';
    } else state.view='pricing';
    toast(wasNew ? 'Pricing created' : 'Pricing saved');
    return render();
}

/* No "apply to the template" here. Editing from a Company can only ever change
   that Company — the global edit has its own way in, from Pricing. Offering
   both at save time made a store-wide price change one careless click away. */
/* Two buttons, because Cancel and Discard changes were answering the same
   question badly: Cancel went back to the editor with the edit intact, Discard
   threw the edit away, and the editor already has its own Discard for that.
   Cancel is the way out here.

   The global edit is back, but as something to tick rather than a button of
   equal weight next to the safe one. Ticking it says out loud how far the
   change reaches. */
/* Nội dung modal đứng yên khi tick. Trước đây tiêu đề, câu dẫn, hai dòng hệ quả và
   cả tên nút đều đổi theo checkbox, nên một cú tick làm cả modal viết lại và người
   đọc phải đọc lại từ đầu để tìm xem cái gì vừa khác. Giờ phần thân mô tả mặc định,
   còn dòng dưới checkbox mô tả cái mà tick vào sẽ đổi thành. */
function renderForkConfirm(co){
  const b=state.builder, p=policyById(b.id);
  const all=!!state.forkApplyAll;
  const reach=policyUsageLabel(p.id);
  /* Mở từ Location → fork về location; mở từ Company → fork về company. */
  const loc = state.editScopeLocationId ? locationById(co, state.editScopeLocationId) : null;
  const scopeName = loc ? loc.name : co.name;

  openModal(`Save changes to ${esc(p.name)}`, `
    <p class="modal-lead">Used by ${reach}. Your changes become a separate pricing for
      <b>${esc(scopeName)}</b>. Other assignees keep ${esc(p.name)}.</p>
    <div class="check-block">
      <label class="check-row" data-action="toggle-fork-all">
        <input type="checkbox" ${all?'checked':''}>
        <span>Apply to all assignees instead</span>
      </label>
      <div class="check-hint">Saves into ${esc(p.name)} itself instead of creating a
        separate one. The new price applies to ${reach} straight away.</div>
    </div>
`,
    `<button class="btn" data-close-modal>Cancel</button>
     <button class="btn primary" data-action="${all?'save-price-apply-all':'save-price-fork'}">Save</button>`);
}

/* ============================================================
   ASSIGN — contextual when the target is known
   ============================================================ */
function assignmentCountForGlobal(type){
  return type==='b2b' ? db.companies.reduce((n,c)=>n+c.locations.length,0) : db.customers.length;
}
function applyPricingAssignment(assign,policyId){
  if(assign.targetType==='company'){
    const company=companyById(assign.companyId); if(!company) return false;
    const profile=policyById(policyId); if(!profile) return false;
    /* Base pricings stack: assigning one ADDS it to the Company (a no-op if it
       is already there), ordered by its own priority; the quantity slot keeps
       being replaced. */
    if(kindOf(profile)==='base') addCompanyBase(company, policyId);
    else companyPricing(company).quantity=policyId;
  }
  if(assign.targetType==='customer_group'){
    let tag=tagById(assign.groupId);
    if(!tag){ if(!allCustomerTags().includes(assign.groupId)) return false;
      tag={id:assign.groupId,name:assign.groupId,defaultPolicyId:null}; db.tagPricing.push(tag); }
    tag.defaultPolicyId=policyId;
  }
  if(assign.targetType==='customer'){
    const customer=customerById(assign.customerId); if(!customer) return false;
    customer.policyId=policyId; customer.status='Active';
  }
  return true;
}
function applyGlobalPricingDefault(type,policyId){
  const key=type==='b2b'?'b2bPolicyId':'wholesalePolicyId';
  db.defaults[key]=policyId;
  return assignmentCountForGlobal(type);
}
/* Chỉ ghi phía profile phục vụ, và dọn phía kia. Việc dọn không chỉ để xử lý lúc
   đổi audience: nó giữ bất biến rằng một pricing không bao giờ bị giữ bởi cả Company
   lẫn customer, kể cả với dữ liệu cũ. */
function executeBuilderAssignment(b,policyId){
  const result={count:0,removed:0,label:''};
  const side=audienceOf(b);

  if(side==='b2b'){
    (b.b2bCompanyIds||[]).filter(id=>id!=='__setup_company__').forEach(companyId=>{
      if(applyPricingAssignment({targetType:'company',companyId},policyId)) result.count++;
    });
    /* Per-location assignment: set slot pricing của location (override). */
    const kindNow=kindOf(policyById(policyId)||b);
    (b.b2bLocationIds||[]).forEach(locId=>{
      const f=findLocation(locId);
      if(f){ if(!f.location.pricing) f.location.pricing={base:null,quantity:null}; f.location.pricing[kindNow]=policyId; result.count++; }
    });
    /* Unticking a row that was ticked when the editor opened is a removal —
       the tree is the full list, not a queue of additions. Only for the same
       profile: saving a fork creates a new id and takes nothing away. */
    if(b.b2bBaselineFor && b.b2bBaselineFor===policyId){
      const kind=kindOf(policyById(policyId)||b);
      (b.b2bBaselineCompanyIds||[]).filter(id=>!(b.b2bCompanyIds||[]).includes(id)).forEach(id=>{
        const c=companyById(id); if(!c) return;
        if(kind==='base'){ if(removeCompanyBase(c, policyId)) result.removed++; }
        else if(companyPricing(c).quantity===policyId){ companyPricing(c).quantity=null; result.removed++; }
      });
      (b.b2bBaselineLocationIds||[]).filter(id=>!(b.b2bLocationIds||[]).includes(id)).forEach(id=>{
        const f=findLocation(id);
        if(f && (f.location.pricing||{})[kind]===policyId){ f.location.pricing[kind]=null; result.removed++; }
      });
    }
    /* Phía customer phải sạch: nếu profile này từng phục vụ customer, những chỗ đó
       không còn resolve tới nó được nữa. */
    db.tagPricing.forEach(tg=>{ if(tg.defaultPolicyId===policyId){ tg.defaultPolicyId=null; result.removed++; } });
    db.customers.forEach(c=>{ if(c.policyId===policyId){ c.policyId=null; result.removed++; } });
    if(db.defaults.wholesalePolicyId===policyId){ db.defaults.wholesalePolicyId=null; result.removed++; }
  }

  if(side==='d2c'){
    const type=customerTargetOf(b);
    if(type==='specific'){
      (b.assignmentTargetIds||[]).forEach(customerId=>{
        if(applyPricingAssignment({targetType:'customer',customerId},policyId)) result.count++;
      });
    }
    if(type==='tags'){
      (b.assignmentTargetIds||[]).forEach(groupId=>{
        if(applyPricingAssignment({targetType:'customer_group',groupId},policyId)) result.count++;
      });
    }
    /* All / logged-in / logged-out are audiences rather than picked records, so
       they land on the store-wide wholesale default and the audience is kept on
       the profile. */
    if(AUDIENCE_TARGETS.includes(type)){
      result.count+=applyGlobalPricingDefault('wholesale',policyId);
      const saved=policyById(policyId); if(saved) saved.audience=type;
    }
    /* Và ngược lại: không Company nào được giữ một pricing của phía customer. */
    db.companies.forEach(c=>{
      if(removeCompanyBase(c, policyId)) result.removed++;
      if(companyPricing(c).quantity===policyId){ companyPricing(c).quantity=null; result.removed++; }
    });
    if(db.defaults.b2bPolicyId===policyId){ db.defaults.b2bPolicyId=null; result.removed++; }
  }

  result.label=assignmentTargetSummary(b);
  return result;
}
/* Saving with no target is legal — it just means the profile goes to the
   library unassigned. Kept as a helper for callers that want to know. */
function assignmentIsComplete(b){ return assignmentTargetCount(b)>0; }
/* Two different jobs used to share one screen. Opened from the Pricing page the
   profile is fixed and the merchant is choosing buyers, so the buyer picker is
   the point. Opened from a Company's pricing row, both the buyer and the
   pricing type are already decided by the row that was clicked — the only open
   question is which profile of that type to put in the slot. */
function openAssign(ctx){
  const clean = Object.fromEntries(Object.entries(ctx||{}).filter(([,v])=>v!==undefined && v!==null));
  state.assign = Object.assign({targetType:null, customerTarget:'specific', companyId:null,
    customerId:null, groupId:null, policyId:null, ids:[], policyLocked:false, typeLocked:false,
    targetLocked:false, kind:null, swapBase:null, quoteOverrides:null, quoteLines:null}, clean);
  state.assignSearch='';
  const a = state.assign;
  /* Opened from a specific pricing row: that price is the decision already made. */
  a.policyLocked = !!(clean.policyId && policyById(clean.policyId));
  /* Opened from a Company page: that Company is the target, full stop. */
  a.targetLocked = !!(clean.targetLocked && a.companyId && companyById(a.companyId));
  if(a.targetLocked) a.targetType='company';
  /* Single-target entry points preselect that one target. */
  if(a.customerId){ a.ids=[a.customerId]; a.targetType='customer'; a.customerTarget='specific'; }
  else if(a.groupId){ a.ids=[a.groupId]; a.targetType='customer'; a.customerTarget='tags'; }
  else if(a.companyId) a.ids=[a.companyId];
  if(!['company','customer'].includes(a.targetType)) a.targetType = a.customerId ? 'customer' : 'company';
  /* Mở từ một pricing cụ thể: phía được gán do audience của chính pricing đó quyết
     định, không phải một lựa chọn nữa. Pricing của customer không gán được cho
     Company, và ngược lại. */
  if(a.policyLocked && !a.targetLocked){
    a.targetType = audienceOf(policyById(a.policyId))==='d2c' ? 'customer' : 'company';
    a.typeLocked = true;
    if(a.targetType==='customer' && !CUSTOMER_TARGETS.some(x=>x[0]===a.customerTarget)) a.customerTarget='specific';
  }
  /* A kind-locked entry only ever offers profiles of that pricing type, and only
     ever profiles that serve the side being assigned. */
  const pool = assignPolicyPool(a);
  const currentInSlot = a.targetLocked && a.kind
    ? companyPricing(companyById(a.companyId))[a.kind] : null;
  if(!a.policyId || (a.kind && kindOf(policyById(a.policyId))!==a.kind)){
    const current = currentInSlot || (a.customerId ? customerById(a.customerId)?.policyId
      : a.companyId ? (companyPrimaryPolicy(companyById(a.companyId))?.id||null)
      : null);
    /* An empty slot starts with nothing chosen: preselecting the first profile
       in the list would put a name in the field the merchant never picked, and
       the Assign button would be live for it. */
    const emptySlot = a.targetLocked && a.kind && !currentInSlot;
    a.policyId = (current && policyById(current) && (!a.kind || kindOf(policyById(current))===a.kind))
      ? current : (emptySlot ? null : (pool[0]?.id || null));
  }
  renderAssign();
}
const assignPolicyPool = a => policiesFor(wantedAudienceFor(a.targetType), a.kind);

/* Assigning a shared profile is harmless; editing it later is not. The warning
   used to live only in the editor, which is one screen too late. */
function sharedProfileNote(prof, excludeCompanyId){
  if(!prof) return '';
  const u=policyUsage(prof.id);
  const others=u.count - ((excludeCompanyId && u.companies.some(c=>c.id===excludeCompanyId))?1:0);
  if(others<1) return '';
  return `<div class="inline-note" style="margin-top:8px">${esc(prof.name)} is already assigned to ${policyUsageLabel(prof.id)}. Adding it here changes nothing for them, but editing the pricing itself later changes all of them at once.</div>`;
}
function assignTargetRows(a){
  const q=(state.assignSearch||'').trim().toLowerCase();
  /* "current" is what this target holds in the slot of the pricing type being
     assigned — that is the only thing this save can replace. */
  const kind = kindOf(policyById(a.policyId)), isBase = kind==='base';
  const items = a.targetType==='company'
      ? db.companies.map(c=>{
          const n=companyBaseEntries(c).length;
          /* Base stacks, so nothing is "replaced"; only the single quantity slot
             carries a current profile this save could take over. */
          const current = isBase ? null : (companyPricing(c).quantity||null);
          const _has = isBase ? companyHasBase(c, a.policyId) : (current===a.policyId);
          const note = isBase ? (n?`${n} base pricing${n===1?'':'s'}`:'No base pricing yet')
                              : (current?policyById(current)?.name:'No quantity pricing');
          return {id:c.id, name:c.name, current, _has, note,
            meta:`${c.locations.length} Location${c.locations.length===1?'':'s'} · ${companyKindCount(c)}/${KIND_ORDER.length} types set`};
        })
    : a.customerTarget==='tags'
      /* No picker for tags, but the override check still needs to know what the
         typed tags already hold. */
      ? (a.ids||[]).map(tag=>{ const cur=tagById(tag)?.defaultPolicyId||null;
          return {id:tag, name:tag, current:cur, _has:cur===a.policyId,
            note:cur?policyById(cur)?.name:'No pricing',
            meta:`${customersWithTag(tag)} customer${customersWithTag(tag)===1?'':'s'}`}; })
    : a.customerTarget==='specific'
      ? individualCustomers()
          .map(c=>({id:c.id, name:c.name, current:c.policyId, _has:c.policyId===a.policyId,
            note:c.policyId?policyById(c.policyId)?.name:'No pricing',
            meta:`${c.email}${isManagedCustomer(c)?'':' · not in this app yet'}`}))
      : [];
  /* A target already holding this exact pricing is not a choice: ticking it
     changes nothing and it pads the list. Dropped, and counted so the screen
     can say where they went. Same treatment the Shopify company browser gives
     Companies that are already linked. */
  const live = items.filter(x=>!x._has);
  a._alreadyOn = items.length - live.length;
  return live.filter(x=>!q || x.name.toLowerCase().includes(q) || x.meta.toLowerCase().includes(q));
}

/* Overriding is allowed, but never silent: one confirmation that names every
   target whose current pricing is about to be replaced. */
function assignReplacements(){
  const a = state.assign;
  return assignTargetRows(a)
    .filter(x => a.ids.includes(x.id) && x.current && x.current !== a.policyId && policyById(x.current))
    .map(x => ({name:x.name, from:policyById(x.current)}));
}

function renderAssignConfirm(){
  const a = state.assign;
  const prof = policyById(a.policyId);
  const list = assignReplacements();
  const noun = a.targetType==='company' ? (list.length===1?'company':'companies')
             : a.targetType==='customer_group' ? (list.length===1?'tag':'tags')
             : (list.length===1?'customer':'customers');
  const untouched = a.ids.length - list.length;
  const body = `
    <div class="banner warning" style="margin-top:0"><div>
      <b>${list.length} ${noun} already ${list.length===1?'has':'have'} a ${kindName(kindOf(prof)).toLowerCase()}</b>
      Assigning ${esc(prof.name)} replaces it. Their other pricing types are untouched. This takes effect immediately.
    </div></div>
    <div class="multi-list" style="max-height:200px">
      ${list.map(x=>`<div class="multi-row" style="cursor:default">
        <span class="grow"><span class="m-name">${esc(x.name)}</span>
          <span class="m-meta">${esc(x.from.name)} → ${esc(prof.name)}</span></span>
      </div>`).join('')}
    </div>
    ${untouched?`<div class="hint" style="margin-top:8px">${untouched} other selected ${untouched===1?'target has':'targets have'} no pricing yet and will simply receive it.</div>`:''}`;
  openModal('Override existing pricing?', body,
    `<button class="btn" data-action="assign-back">Back</button>
     <button class="btn primary" data-action="assign-confirm">Continue and override</button>`);
}

function renderAssign(){
  const a = state.assign;
  a.ids = a.ids || [];
  /* Companies or customers. Customer tags used to be a third tab, which asked
     the merchant to decide between two ways of naming the same audience before
     they had picked one. Tags are now a choice inside Customers, matching the
     list the app's Discount section uses. */
  const opts = [['company','Companies','Every Location of the company gets it'],
                ['customer','Customers','Who on the customer side receives this pricing']];
  if(!['company','customer'].includes(a.targetType)) a.targetType='customer';
  if(!CUSTOMER_TARGETS.some(x=>x[0]===a.customerTarget)) a.customerTarget='specific';
  const lockedCompany = a.targetLocked ? companyById(a.companyId) : null;
  const isBaseAssign = a.kind==='base';
  /* Quote mode: adding a set of quoted prices to a base — the pool is the
     company's CURRENT bases (merge targets), not the not-yet-held ones. */
  const isQuote = isBaseAssign && !!a.quoteOverrides;
  /* Base stacks, so a locked Company is normally in "add" mode and only bases it
     does not already hold are worth offering. */
  const pool0 = assignPolicyPool(a);
  const pool = (isQuote && lockedCompany)
    ? companyBaseEntries(lockedCompany).map(e=>policyById(e.id)).filter(Boolean)
    : (isBaseAssign && lockedCompany) ? pool0.filter(p=>!companyHasBase(lockedCompany, p.id)) : pool0;
  const emptyLockedSlot = a.targetLocked && a.kind
    && (isBaseAssign ? true : !companyPricing(companyById(a.companyId)||{}).quantity);
  if(!emptyLockedSlot && (!policyById(a.policyId) || (a.kind && kindOf(policyById(a.policyId))!==a.kind)))
    a.policyId = pool[0]?.id || null;
  /* Keep the selection within the offered pool (or __new__ in quote mode). */
  if(isBaseAssign && lockedCompany && a.policyId!=='__new__' && !pool.some(p=>p.id===a.policyId)) a.policyId = pool[0]?.id || (isQuote?'__new__':null);
  const prof = policyById(a.policyId);
  const kindLabel = a.kind ? kindName(a.kind) : null;

  /* Nothing of this type exists yet: the only useful move is to create one,
     already bound to this Company and this type. */
  const sideNoun = a.targetType==='customer' ? 'customers' : 'Companies';
  if(!prof && !(emptyLockedSlot && pool.length)) return openModal(a.kind?`Assign ${kindLabel.toLowerCase()}`:'Assign pricing',
    `<div class="banner warning"><div><b>No ${a.kind?kindLabel.toLowerCase():'pricing profile'} serves ${sideNoun} yet</b>${
      a.kind?`${a.targetType==='customer'?'Pricing set up for Companies cannot be assigned to a customer.':'Pricing set up for customers cannot be assigned to a Company.'} Create one and it will be assigned to ${lockedCompany?esc(lockedCompany.name):'this target'} straight away.`
            :'Create one from the Pricing page first.'}</div></div>`,
    `<button class="btn" data-close-modal>Cancel</button>
     ${a.kind?`<button class="btn primary" data-action="create-price-from-assignment">Create ${kindLabel.toLowerCase()}</button>`:''}`);

  /* Target fixed by the row that was clicked: no buyer picker at all. */
  if(lockedCompany){
    if(isQuote){
      const lines = a.quoteLines || [];
      const anyOver = lines.some(l => Number(l.quoted) > Number(productBySku(l.sku)?.list || 0));
      const lineRows = lines.map(l => { const p = productBySku(l.sku); if(!p) return '';
        const over = Number(l.quoted) > Number(p.list);
        return `<tr><td><div class="cell-main">${esc(p.title)}</div><div class="cell-sub mono">${esc(l.sku)} · Qty ${l.qty}</div></td>
          <td class="num muted">${money(p.list)}</td>
          <td class="num"><b>${money(l.quoted)}</b>${over?` <span class="badge critical">Above Shopify</span>`:''}</td></tr>`;
      }).join('');
      const body = `
        <div class="form-field"><label>Add quoted prices to</label>
          <select data-as="policyId">
            ${pool.map(p=>`<option value="${p.id}" ${p.id===a.policyId?'selected':''}>${esc(p.name)}</option>`).join('')}
          </select>
          <div class="hint">These ${lines.length} product price${lines.length===1?'':'s'} are added to it. Products not in the quote keep their current price.</div>
        </div>
        <div class="chooser-or">or</div>
        <button class="btn-alt" data-action="create-price-from-assignment"><span class="plus">+</span>Create a new base pricing</button>
        <div class="form-field" style="margin:12px 0 0"><label>Quoted prices</label>
          <table><thead><tr><th>Product</th><th class="num">Shopify</th><th class="num">Quoted</th></tr></thead><tbody>${lineRows}</tbody></table>
          ${anyOver?`<div class="field-error" role="alert">Some quoted prices are above the Shopify price — fix them in the quote first.</div>`:''}</div>`;
      return openModal(`Save quoted prices: ${lockedCompany.name}`, body,
        `<button class="btn" data-close-modal>Cancel</button>
         <button class="btn primary" data-action="apply-quote-assign" ${(anyOver||!pool.length)?'disabled':''}>Add prices</button>`);
    }
    const isSwap = isBaseAssign && !!a.swapBase;
    /* The profile this save replaces: the single quantity slot, or (for a base
       "Change") the specific base being swapped. A base "Add" replaces nothing. */
    const current = isSwap ? policyById(a.swapBase)
                  : ((!isBaseAssign && a.kind) ? policyById(companyPricing(lockedCompany).quantity) : null);
    const label = (kindLabel||'pricing').toLowerCase();
    /* Filling an empty slot is the same move company setup offers: pick one or
       make one. Changing a slot that already has pricing is a comparison, so
       that one keeps the detail and the worked example. */
    const picked = !!(current ? prof : (a.policyId && policyById(a.policyId)));
    const chosen = picked ? policyById(a.policyId) : null;

    const body = `
      <div class="form-field"><label>${current?(kindLabel||'Price'):`Use an existing ${label}`}</label>
        <select data-as="policyId">
          ${current?'':`<option value="">Select a ${label}…</option>`}
          ${pool.map(p=>`<option value="${p.id}" ${p.id===a.policyId?'selected':''}>${esc(p.name)}</option>`).join('')}
        </select>
        ${current?`<div class="hint">Currently ${esc(current.name)}. Saving replaces it${isSwap?', keeping its priority':''}.</div>`
                :(isBaseAssign?`<div class="hint">Adds it alongside this company's base pricings. Set its priority later from the base's Edit.</div>`
                              :`<div class="hint">Only pricing that serves Companies is listed.</div>`)}
        ${chosen?sharedProfileNote(chosen, lockedCompany.id):''}
      </div>

      ${(current && !isSwap)?'':`
        <div class="chooser-or">or</div>
        <button class="btn-alt" data-action="create-price-from-assignment">
          <span class="plus">+</span>Create a new ${label}
        </button>`}

      ${picked&&chosen?`<div class="card plain" style="margin:12px 0 0"><div class="card-head"><h2>What they will get</h2></div>
        <div class="card-body"><div class="kv">
          <dt>Products</dt><dd>${scopeLabel(chosen)}</dd>
          <dt>Rule</dt><dd>${priceLabel(chosen)}</dd>
          <dt>Outside those products</dt><dd>${fallbackLabel(chosen.fallback)}</dd>
          <dt>When</dt><dd>${validityLabel(chosen)}</dd>
        </div>
        ${previewBlock(chosen)}</div>
      </div>`:''}`;

    return openModal(`${isSwap?'Change':(isBaseAssign?'Add':'Assign')} ${label}: ${lockedCompany.name}`, body,
      `<button class="btn" data-close-modal>Cancel</button>
       <button class="btn primary" data-action="apply-assign" ${picked?'':'disabled'}>${current?(isSwap?'Change':'Replace'):(isBaseAssign?'Add':'Assign')}</button>`);
  }

  const rows = assignTargetRows(a);
  const noun = a.targetType==='company' ? 'companies'
             : a.customerTarget==='tags' ? 'tags' : 'customers';
  /* "companies" does not singularise by dropping an s. */
  const noun1 = noun==='companies' ? 'company' : noun.slice(0,-1);
  const locationsCovered = a.targetType==='company'
    ? a.ids.map(id=>companyById(id)).filter(Boolean).reduce((n,c)=>n+c.locations.length,0) : 0;

  /* The profile is already decided when this opens from a pricing row, so this
     screen has one job: pick the buyers. Its name moved into the modal title,
     and the banner, the "What they will get" card and the price preview all
     went with it — they described a pricing the merchant had just come from. */
  const sharedCount = policyUsageCount(prof.id);
  const body = `
    ${a.policyLocked
      ? (sharedCount?`<div class="hint" style="margin:-4px 0 12px">Already on ${policyUsageLabel(prof.id)}. Editing the pricing later changes all of them.</div>`:'')
      : `<div class="form-field"><label>Price</label><select data-as="policyId">
          ${pool.map(p=>`<option value="${p.id}" ${p.id===a.policyId?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>`}

    <div class="form-field"><label>Assign to</label>
      ${a.typeLocked
        ? `<div class="switch-row" style="margin:0 0 4px"><span class="token">${opts.find(o=>o[0]===a.targetType)[1]}</span></div>`
        : `<div class="segmented" style="flex-wrap:wrap">${opts.map(o=>`<button class="segment ${a.targetType===o[0]?'active':''}" data-atype="${o[0]}">${o[1]}</button>`).join('')}</div>`}
      <div class="hint">${a.targetType==='company'
        ? (kindOf(prof)==='base'
            ? `Every Location of the company gets it. It is added alongside each company's other base pricings.`
            : `Every Location of the company gets it. Only the ${kindName(kindOf(prof)).toLowerCase()} slot changes.`)
        : opts.find(o=>o[0]===a.targetType)[2]}</div>
      ${a.targetType==='customer'?`<div class="radio-list boxed" style="margin-top:8px">
        ${CUSTOMER_TARGETS.map(o=>`<label class="radio-row ${a.customerTarget===o[0]?'on':''}" data-acustomer="${o[0]}">
          <input type="radio" name="assign-customer-target" ${a.customerTarget===o[0]?'checked':''}>
          <span><span class="r-title">${o[1]}</span>
            ${o[0]==='tags' && a.customerTarget==='tags' ? tagTokenField(a.ids||[],'assign') : ''}</span>
        </label>`).join('')}
      </div>`:''}</div>

    ${a.targetType==='customer' && (AUDIENCE_TARGETS.includes(a.customerTarget) || a.customerTarget==='tags')
      ? (a.customerTarget==='tags' ? '' : `<div class="banner warning" style="margin:0"><div>
          <b>${customerTargetLabel(a.customerTarget)}</b>

function render(){
  renderSidebar();
  /* The top bar is static markup, so this one control is written on each
     render. It lives up here rather than inside Settings so the team can find
     it without hunting. */
  const et=document.getElementById('emptyToggle');
  if(et){
    et.textContent=`Empty state: ${state.emptyMode?'on':'off'}`;
    et.classList.toggle('on', !!state.emptyMode);
  }
  const v = {customers:renderCustomers, company:renderCompany,
             location:renderLocation, quote:renderQuote,
             pricing:renderPricing, settings:renderSettings,
             analytics:renderAnalytics};
  /* Scroll to top only when the page itself changes. A re-render triggered by a
     filter, sort or search on the page we're already on should leave the scroll
     position where the merchant left it — jumping to the top on every toggle
     (e.g. switching pricing type) loses their place. */
  const pageKey = state.view + '|' + (state.selectedCompany || '') + '|' + (state.selectedLocation || '');
  const pageChanged = pageKey !== state._pageKey;
  state._pageKey = pageKey;
  document.getElementById('app').innerHTML =
    (v[state.view] || renderCustomers)() + helpFooter(state.view);
  if(pageChanged) window.scrollTo({top:0});
}
